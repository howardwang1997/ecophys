# A4 — Multi-asset + Two-population per-type γ, T (P1+P4).
# K=4 persistent agent types with different (γ, T) pairs. Lux-Marchesi
# heterogeneity without K×K coupling — simpler than v2.1, hopefully more
# stable at scale.
#
# Choices below: type 0 (fundamentalists, low γ low T = slow + cool),
# type 1 (chartists, high γ high T = fast + hot),
# type 2 (noise traders, baseline),
# type 3 (institutional, low γ low T but extra slow).

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.1
    hawkes_kappa: 0.3
  pairwise_kind: stochastic_mlp
  sps_k_random: 50
  sps_resample_per_step: true
  # P4 two-population
  twopop_enabled: true
  twopop_gamma_scale: [0.7, 1.5, 1.0, 0.5]
  twopop_temp_scale:  [0.5, 2.0, 1.0, 0.3]
  v2_type_seed: 42

training:
  n_iters: 200
  chunk_steps: 24
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0
  seed: 0
  checkpoint_every_s: 1800
  joint_assets:
    - {dataset: spx,     period: 2015-2026_daily, weight: 1.0}
    - {dataset: btcusdt, period: 2024Q1_1m,        weight: 1.0}
    - {dataset: ethusdt, period: 2024Q1_1m,        weight: 1.0}
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
