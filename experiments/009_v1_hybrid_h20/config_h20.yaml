# EcoMD v1 HYBRID — H20 production config.
#
# Scaled version of experiments/008_ecomd_v1_ablation/config_H_F4_hybrid.yaml
# (Mac N=200 hit acf(r²)=+0.202, matching SPX target +0.221).
#
# Key mechanism (from Mac ablation):
#   - readout_mode='hybrid': per-edge 2-body + per-node 3/4-body tensor products
#   - Dense graph (complete at Mac; k=200 here due to memory)
#   - Student-t noise + learnable β inherited from v0.6 recipe
#
# H20 vs Mac scaling:
#   N        :  200    →  10000
#   k        :  199 (complete) → 200   # 2% coverage; 10⁸-edge complete is OOM
#   chunk    :   32    →  48            # longer BPTT for cleaner ACF signal
#   grad_clip:  1.0    → 100.0          # H20 diagnostics showed clip=1 kills lr
#   n_iters  :   80    → 200
#
# Expected per-iter time (based on earlier H20 diag): ~1.0s at 4 cards.
# Total training: ~200s. Eval 4000 steps × 8 realizations ≈ 2-3 min.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 64
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16
  pairwise_kind: mace_lite
  mace_k: 64                           # fits 96GB HBM; 200 OOMs
  mace_body_order: 4
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10
  mace_use_layernorm: true
  mace_readout_mode: hybrid            # WINNER at Mac: per_edge + per_node
  mace_readout_multiplier: 1.0         # let N·k = 2M edges self-scale
  mace_readout_init_gain: 0.5

training:
  n_iters: 200
  # k=64 hybrid readout + body=4 fits 96 GB HBM at chunk=24. Mac H winner used
  # chunk=32 warmup=16 (BPTT=16 effective). Keeping BPTT=16 for comparability.
  chunk_steps: 24
  warmup_steps: 8
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0            # H20 diag: clip=1 caps effective lr at μ-level
  seed: 0
  checkpoint_every_s: 1800
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
