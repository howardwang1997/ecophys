# EcoMD cross-asset validation — v0.6 recipe trained on BTC 1m.
#
# Pipeline: load real BTC 1m 2024 Q1 close-prices (131K minutes), compute
# training targets (acf_sq, leverage, hill) from them, train sim, evaluate
# 11 stylized facts, compare to real-BTC reference.
#
# Configuration: identical to experiments/005_ecomd_v0p6/config.yaml.
# (noise_dist=t, learnable_β=true, 80 iter, chunk=32, N=200.)
# Only change: target_dataset spx → btcusdt.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: btcusdt
  target_period: 2024Q1_1m
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

variant: v06_btc1m
