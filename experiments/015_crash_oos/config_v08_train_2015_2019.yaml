# EcoMD v0.8 trained on SPX 2015-2019 only (OOS crash validation).
#
# Goal: train EcoMD on pre-COVID SPX data; evaluate 11 stylized facts on
# held-out 2020 H1 (COVID crash + recovery window, 125 days, worst day -12.8%).
# Tests whether the learned potential generalizes to unseen crash regimes.
#
# Identical to experiments/011_ecomd_v0p8/config.yaml except:
#   target_period: 2015-2019_daily (was 2015-2026_daily)

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.0
    hawkes_kappa: 0.0

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2019_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000
  # Crash validation: compare sim rollout to REAL 2020 H1 stylized facts.
  holdout_period: 2020H1_daily

variant: v08_train15_19
