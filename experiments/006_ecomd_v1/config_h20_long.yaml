# EcoMD v1 — H20 long run (2026-04-24)
#
# 1000 iters to give γ and T more time to converge.
# Based on config_h20.yaml with n_iters=200→1000, grad_clip=1→100.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 64
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: normal
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
  pairwise_kind: mace_lite
  mace_k: 32
  mace_body_order: 4
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10

training:
  n_iters: 1000
  chunk_steps: 24
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 50
  grad_clip_max_norm: 100.0
  seed: 0
  checkpoint_every_s: 1800
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 16
    hill_k_frac: 0.05
