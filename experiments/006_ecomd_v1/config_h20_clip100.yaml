# EcoMD v1 — H20 clip=100 diagnostic (2026-04-24)
#
# Tests whether grad_clip_max_norm=1.0 was the real training bottleneck.
# Prior H20 runs (ORIG + DIAG) showed 100% grad clipping, mean grad_norm
# ~150, → effective lr = 1e-3 × (1/150) ≈ 6.6e-6 (100× smaller than set).
# Loss plateaued by iter 66 in both runs.
#
# This config is IDENTICAL to config_h20.yaml except:
#   - grad_clip_max_norm: 1.0 → 100
#   - n_iters: 200 → 100    (faster diagnostic; plateau was clear by 66)
#
# All other fields preserved: N=10K, chunk=24, warmup=16 (same BPTT window
# as the ORIG run) — this keeps the comparison clean, ONE variable changed.
#
# Expected:
#   - grad_norm mean may still be ~150, but ratio clip/grad = 100/150 = 0.67
#     instead of 0.007. Effective lr climbs from 6.6e-6 → 6.7e-4.
#   - If clip was the real issue: loss should keep dropping past 0.82 plateau;
#     acf_sim should reach and STAY in positive region (DIAG showed model can
#     touch +0.359, just can't hold it).
#   - If loss still plateaus near 0.82: problem is landscape / architecture,
#     not clip. Time to consider heterogeneous agents (persistent type labels).
#
# Wall time estimate: ~55s (100 iters × 531ms per iter).

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 64
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: normal
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
  pairwise_kind: mace_lite
  mace_k: 32
  mace_body_order: 4
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10

training:
  n_iters: 100
  chunk_steps: 24
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0
  seed: 0
  checkpoint_every_s: 1800
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 16
    hill_k_frac: 0.05
