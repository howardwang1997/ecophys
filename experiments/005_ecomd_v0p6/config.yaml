# EcoMD v0.6 — v0.5 training fixes + heavy-tail noise + learnable β.
#
# Differences from experiments/004_ecomd_v0p5/config.yaml:
#   - noise_dist: normal → "t", noise_df: 5          (补 #2 Hill, #5 Fano)
#   - price_formation_kwargs.learnable_beta: true     (补 #1 ACF — regime-dep β)

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

smoke:
  n_agents: 100
  n_iters: 8
  chunk_steps: 32
  eval_steps: 600
  n_realizations: 2
