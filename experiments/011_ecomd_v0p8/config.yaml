# EcoMD v0.8 — v0.6 minus learnable β.
#
# Cross-version analysis of #10 corr(V,|r|):
#   v0.5 (β_fixed, normal noise):  +0.111 ✓
#   v0.6 (β_learn, t noise):       +0.078 ✗
#   v0.7 (β_learn, t, small σ):    -0.074 ✗
#
# Hypothesis: learnable β (state-dependent β = β_base · clamp(exp(MLP(vol,
# last_return)), 0.1, 5)) breaks the monotone |excess_demand| → |return|
# relationship that volume depends on. β amplifies returns at some states
# and dampens at others, so |return|'s scaling with volume becomes
# state-dependent and can decorrelate or even anti-correlate.
#
# v0.8 test: keep all of v0.6's wins (t noise for #2/#3/#5/#7) but disable
# learnable β. If corr(V,|r|) rises back above 0.1 → hit 7/11 = M2 pass.
# Side expectation: #1 ACF(r) also drops toward v0.5's 0.24 level.
#
# ONLY CHANGE from v0.6: learnable_beta true → false.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false             # v0.6 was true — this is the single change
    beta_hidden: 16

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

smoke:
  n_agents: 100
  n_iters: 8
  chunk_steps: 32
  eval_steps: 600
  n_realizations: 2
