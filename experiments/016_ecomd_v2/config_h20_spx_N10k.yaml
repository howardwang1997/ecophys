# EcoMD v2 H20 — SPX daily, N=10K, full Kyle + Typed + Gauge + Hawkes stack.
#
# Headline Paper A experiment: market-microstructure-derived architecture at
# scale on H20, matching or beating v0.8 Mac (7/11) on SPX daily.
#
# Expected memory: N=10K × k=50 → 500K edges × 3·32 floats = ~192 MB input;
# chunk=32 with BPTT ≈ 32 GB/card on 4-card H20 DDP.
#
# NOTE: tuning — if v0.9 SPS already works at this scale, v2 should at
# worst match v0.9. If Kyle + Type + Gauge add value, v2 should beat it.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.1
    hawkes_kappa: 0.3
  pairwise_kind: ecomd_v2
  v2_k_types: 4
  v2_d_type_emb: 8
  v2_d_pi: 4
  v2_k_random: 50
  v2_kyle_enabled: true
  v2_kyle_lambda_init: 0.05
  v2_kyle_lambda_learnable: true
  v2_gauge_axis: 0
  v2_type_seed: 42

training:
  n_iters: 200
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0         # H20 diag lesson: clip=1 kills signal
  seed: 0
  checkpoint_every_s: 1800
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
    w_acf_shape: 0.0                # turn on for stronger shape enforcement later
    acf_shape_target_ratio: 2.0
    acf_shape_lag_peak: 1
    acf_shape_lag_tail: 10
