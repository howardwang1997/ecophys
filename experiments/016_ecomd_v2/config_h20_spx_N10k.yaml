# EcoMD v2.1 — H20 production config (SPX daily, N=10K)
#
# Mac-validated winning recipe (sweep 017_v2_ablation, 2026-04-25):
#   gauge_enforce=false, T_init_mode=ones, kyle_enabled=false (the v2.1 base)
#   + Hawkes κ=2.0, w_acf_shape=0.3 → **9/11 on SPX daily, N=200**.
#
# Hawkes×shape sweep (12 configs at N=200, 80 iters):
#   κ=0.1, ws=0.3   → 7/11   (weak Hawkes + shape loss)
#   κ=0.1, ws=1.0   → 7/11
#   κ=1.0, ws=0.0   → 7/11   (strong Hawkes alone)
#   κ=2.0, ws=0.0   → 7/11
#   κ=2.0, ws=0.3   → 9/11 ★ chosen
#   κ=2.0, ws=1.0   → 9/11   (slightly higher final loss)
# Two stragglers at 9/11: autocorr_returns (sim +0.33 vs real ±0.05, return
# memory too strong) and conditional_kurtosis. Both expected to ease at
# N=10K where the extra agents add noise that washes out short-term return
# autocorrelation.
#
# Goal at H20 N=10K: reach 9-10/11 with longer training (200 iters) and
# population effects on tails (#2 Hill).
#
# Launch:
#   bash scripts/h20_launch_v2_ablation.sh  (single GPU grid, many configs)
#   or for DDP single-run:
#   torchrun --nproc_per_node=4 --standalone -m ecomd.training.train_distributed \
#     --config experiments/016_ecomd_v2/config_h20_spx_N10k.yaml
#
# Expected memory: N=10K × k=50 → 500K edges × (3·32 + 16) = ~224 MB input;
# chunk=32 with BPTT ≈ 32 GB/card on 4-card H20 DDP.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.1
    hawkes_kappa: 2.0           # Mac sweep: κ=2.0 dominates (9/11 with ws=0.3)
  pairwise_kind: ecomd_v2
  v2_k_types: 4
  v2_d_type_emb: 8
  v2_d_pi: 4
  v2_k_random: 50
  # v2.1 winning recipe (Mac ablation 2026-04-25)
  v2_kyle_enabled: false            # Kyle anti-herding suppresses clustering
  v2_gauge_enforce: false           # allow full (s_i, s_j, |Δs|) pair input
  v2_T_init_mode: ones              # T=ones so all type pairs equally coupled
  v2_phi_init_gain: 1.0             # force magnitude ~v0.8 baseline
  v2_kyle_lambda_init: 0.05         # unused since kyle_enabled=false
  v2_kyle_lambda_learnable: true    # unused
  v2_gauge_axis: 0                  # unused since gauge_enforce=false
  v2_type_seed: 42
  v2_pi_init_gain: 0.5              # unused
  v2_T_offdiag_init: 0.1            # unused with T_init_mode=ones

training:
  n_iters: 200
  chunk_steps: 24                      # 32 OOMs on 96GB HBM
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0         # H20 scaling: clip=1 caps effective lr (diag 2026-04-24)
  seed: 0
  checkpoint_every_s: 1800
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
    w_acf_shape: 0.3                # Mac sweep: 0.3 with κ=2.0 → 9/11 (vs 7/11 at 0)
    acf_shape_target_ratio: 2.0
    acf_shape_lag_peak: 1
    acf_shape_lag_tail: 10
