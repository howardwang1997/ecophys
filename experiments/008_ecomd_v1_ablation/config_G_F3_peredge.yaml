# EcoMD v1 ablation G (F3 fix) — per-edge scalar readout, no per-node path.
#
# V = Σ_{(i,j)∈E} g(m_ij, z_i, z_j), with E = N·k = 200·8 = 1600 edges.
# This restores v0.6's pair-sum structure (scale ~ N·k vs current scale ~ N)
# while keeping MACE-lite's messaging + type prior + RBF.
#
# Required: body_order must be 2 (no per-node features for 3/4-body in pure
# per_edge mode). Use config_H_F4_hybrid for body>2.
#
# Only change from A_matched: mace_readout_mode 'per_node' → 'per_edge'.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16
  pairwise_kind: mace_lite
  # Complete graph (k=N-1) so per-edge sum runs over all N·(N-1) pairs, matching
  # v0.6's pair-sum structure. Dense-probe at init: |F| ≈ O(v0.6).
  mace_k: 199
  mace_body_order: 2
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10
  mace_use_layernorm: true
  mace_readout_mode: per_edge
  # Multiplier ~15 to bring init |F| ≈ 1.0 = v0.6 scale (per-edge MLP has
  # saturating SiLU composition that shrinks gradients below naive pair-sum).
  mace_readout_multiplier: 15.0
  mace_readout_init_gain: 0.5

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

variant: G_F3_peredge
