# EcoMD v1 ablation C — body_order=4 (full MACE expansion).
#
# Tests whether adding 3-body and 4-body tensor-product features HURTS
# clustering. H20 runs used body=4 and failed. This isolates body order
# from all other confounds (matched training recipe, same k=8 sparse graph).
#
# Only difference from A_matched: mace_body_order 2 → 4.
#
# Expected:
#   - acf(r²) drops relative to A → higher-body terms cancel / mask the
#     2-body clustering signal. Keep body=2 as production default.
#   - acf(r²) same as A → body order is neutral; other factors matter.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16
  pairwise_kind: mace_lite
  mace_k: 8
  mace_body_order: 4
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10
  mace_use_layernorm: true

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

variant: C_body4
