# EcoMD v1 ablation D — body_order=4 WITHOUT LayerNorm on h^(1).
#
# Tests whether LN on node features before the tensor products (h^(1) * h^(1))
# destroys the fat-tail amplitude distribution needed for vol clustering.
# LN subtracts mean and divides by std → it FORCES uniform scale, which may
# wipe out the rare-large-event component that drives vol clustering.
#
# Only differences from A_matched:
#   mace_body_order:    2 → 4
#   mace_use_layernorm: true → false
#
# Expected:
#   - If C (with LN) failed but D (no LN) recovers acf: LN is the culprit.
#     Could stabilize differently (e.g., GroupNorm, or learnable rescale).
#   - If both C and D fail: body-order ≥3 itself is the issue regardless of LN.
#   - If D diverges (numerical blowup): LN is necessary but inverts stability /
#     clustering trade-off — need smarter normalization.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16
  pairwise_kind: mace_lite
  mace_k: 8
  mace_body_order: 4
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10
  mace_use_layernorm: false

training:
  n_iters: 80
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

variant: D_body4_noLN
