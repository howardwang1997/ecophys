# EcoMD v1+ — MACE-lite + Student-t noise + learnable β (v0.6 inherited).
# Mac smoke only.

simulator:
  n_agents: 100
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  # v0.6 inherited
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true
    beta_hidden: 16
  # v1 MACE-lite
  pairwise_kind: mace_lite
  mace_k: 8
  mace_body_order: 2
  mace_n_classes: 4
  mace_n_rbf: 8
  mace_knn_refresh: 10

training:
  n_iters: 10
  chunk_steps: 32
  warmup_steps: 8
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 2
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05

evaluation:
  n_realizations: 2
  eval_steps: 600
