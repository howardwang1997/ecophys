simulator:
  asym_drag_alpha: 0.6
  bptt_checkpoint_every: 0
  bptt_custom_function: true
  d_state: 32
  dt: 0.01
  edge_gating_enabled: true
  edge_gating_init_p: 0.7
  edge_gating_input_u: true
  gamma_init: 10.0
  global_state_d: 16
  global_state_enabled: true
  global_state_into_pair: true
  global_state_update_every: 1
  hidden: 96
  init_state_scale: 0.1
  jump_lambda: 0.5
  jump_scale: 0.01
  lam_dissipation: 0.01
  learn_gamma: false
  learn_temperature: false
  n_agents: 10000
  noise_df: 5
  noise_dist: levy
  noise_levy_alpha: 1.9
  noise_levy_clip: 50.0
  pair_input_layernorm: true
  pairwise_kind: stochastic_mlp
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    beta_hidden: 16
    ewma_alpha: 0.05
    hawkes_alpha: 0.1
    hawkes_kappa: 0.3
    initial_log_price: 0.0
    kappa: 0.5
    learnable_beta: false
    sigma_price: 0.005
  sps_k_random: 50
  sps_resample_per_step: true
  temperature_init: 0.05
  twopop_enabled: true
  twopop_gamma_scale:
  - 0.7
  - 1.5
  - 1.0
  - 0.5
  twopop_temp_scale:
  - 0.5
  - 2.0
  - 1.0
  - 0.3
  v2_type_seed: 42
training:
  checkpoint_every_s: 1800
  chunk_steps: 24
  grad_clip_max_norm: 100.0
  loss_weights:
    balance_mode: fixed
    distance_mode: l1
    hill_k_frac: 0.05
    hill_max_target: 10.0
    loss_family: moments
    max_lag: 8
    tail_estimator: soft_hill
    w_acf_sq: 1.0
    w_autocorr_r: 0.5
    w_hill: 0.1
    w_hill_max: 0.3
    w_leverage: 0.2
  lr: 0.001
  lr_warmup_iters: 10
  n_iters: 200
  persistent_state: true
  seed: 23
  target_dataset: btcusdt
  target_period: 2024Q1_1m
  warmup_steps: 16
