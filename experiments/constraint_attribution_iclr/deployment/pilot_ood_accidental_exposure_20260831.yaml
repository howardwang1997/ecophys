  final_id_only_lock_changed: false
  main_confirmation_outcomes_accessed: false
  main_confirmation_validity_effect: none
mitigation:
  - Keep the already selected PDEBench benchmark; do not switch candidates after the exposure.
  - Freeze all external-benchmark settings without consulting the exposed values.
  - Never use historical pilot OOD values in the external benchmark design, analysis, or paper claim.
  - Restrict future monitoring searches to filenames, counts, hashes, provenance booleans, and logs.
  - Disclose this incident with the external-benchmark protocol and retained audit trail.

