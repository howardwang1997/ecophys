# Focused grid around phi_init_gain = 1.0 (Goldilocks force scale).
#
# Force-magnitude probe revealed:
#   phi=0.5 → |F|=0.06 (too weak)
#   phi=1.0 → |F|=0.88 (matches v0.8's 0.76 ✓)
#   phi=3.0 → |F|=46   (explodes)
# Previous mac_quick sampled {0.5, 1.5, 3.0}, all missing the sweet spot.
#
# This grid swept phi around 1.0 × (Kyle on/off) × (gauge on/off) at k=50.
# 2×2×3 = 12 runs × ~1.7 min ≈ 20 min.

base_config: base_config.yaml

grid:
  simulator.v2_phi_init_gain: [0.8, 1.0, 1.2]
  simulator.v2_kyle_enabled: [true, false]
  simulator.v2_gauge_axis: [-1, 0]
  simulator.v2_k_random: [50]     # fast; H20 later goes to larger k

skip_when: []

variant_template: "phi{simulator.v2_phi_init_gain}_K{simulator.v2_kyle_enabled}_g{simulator.v2_gauge_axis}"
