# EcoMD v2 ablation — base config that the grid runner overlays with knob values.
#
# To add a new ablation, define a list of values in grid.yaml for any simulator.*
# or training.* key. The runner expands the Cartesian product into N configs.

simulator:
  n_agents: 200                # Mac-scale default; grid can override to 10000 for H20
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.1
    hawkes_kappa: 0.3
  pairwise_kind: ecomd_v2
  v2_k_types: 4
  v2_d_type_emb: 8
  v2_d_pi: 4
  v2_k_random: 50
  v2_kyle_enabled: true
  v2_kyle_lambda_init: 0.05
  v2_kyle_lambda_learnable: true
  v2_gauge_axis: 0
  v2_type_seed: 42
  v2_phi_init_gain: 0.5
  v2_pi_init_gain: 0.5
  v2_T_offdiag_init: 0.1
  v2_T_init_mode: eye_plus_noise   # v2.1: set to 'ones' for vol clustering
  v2_gauge_enforce: false          # v2.1: false default (gauge on s[0] hurt Mac ablation)

training:
  n_iters: 80
  chunk_steps: 24                      # 32 OOMs on 96GB HBM at N=10K
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 3
  grad_clip_max_norm: 1.0         # Mac default; H20 grids set 100
  seed: 0
  target_dataset: spx
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
    w_acf_shape: 0.0
    acf_shape_target_ratio: 2.0
    acf_shape_lag_peak: 1
    acf_shape_lag_tail: 10

evaluation:
  n_realizations: 3
  eval_steps: 2000
