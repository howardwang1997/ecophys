# H20 v2.1 ablation grid — starts from Mac-winning recipe and explores the
# knobs that may lift 6/11 → 7/11+ by exploiting larger N and more iters.
#
# Mac fixed at 6/11 (phi=1.0, T=ones, gauge off, Kyle off). Missing:
#   #2 Hill (tail too light), #3 skew (too symmetric), #4 Δκ agg (wrong sign),
#   #11 Zumbach (wrong sign). These are all fat-tail/time-asymmetry metrics
#   → likely helped by Hawkes tuning + longer training at larger N.
#
# Grid: 3 × 3 × 2 × 2 × 2 = 72, minus skips ≈ 50-60 runs.
# Each run ~5-10 min on 4-card H20 gloo (N=10K, k=50, chunk=32).
# Total ~5-10 hours — overnight budget.

base_config: base_config.yaml    # relative to this grid file

grid:
  # N scaling: 2K (Mac-like) vs 10K (full)
  simulator.n_agents: [10000]
  # SPS density
  simulator.v2_k_random: [50, 100]
  # v2.1 core: T initialization strategy (ones vs legacy)
  simulator.v2_T_init_mode: [ones]
  # Gauge: v2.1 locked to false per Mac ablation; keep as sanity
  simulator.v2_gauge_enforce: [false]
  # Force magnitude
  simulator.v2_phi_init_gain: [0.8, 1.0, 1.2]
  # Kyle: off wins Mac; test on at N=10K in case scale helps
  simulator.v2_kyle_enabled: [false, true]
  # Hawkes self-excitation strength
  simulator.price_formation_kwargs.hawkes_kappa: [0.0, 0.3, 1.0]
  # Shape loss — push fat-tail decay
  training.loss_weights.w_acf_shape: [0.0, 0.5]
  # Training hyperparams
  training.n_iters: [200]
  training.chunk_steps: [24]
  training.grad_clip_max_norm: [100.0]

skip_when:
  # Kyle λ unused when Kyle off — avoid duplicates (we don't vary λ here, OK)
  # Extreme force gauges sometimes unstable; avoid phi=1.2 with Kyle on
  - simulator.v2_phi_init_gain: 1.2
    simulator.v2_kyle_enabled: true

variant_template: "h20_N{simulator.n_agents}_k{simulator.v2_k_random}_phi{simulator.v2_phi_init_gain}_K{simulator.v2_kyle_enabled}_h{simulator.price_formation_kwargs.hawkes_kappa}_s{training.loss_weights.w_acf_shape}"
