# EcoMD v0.9 SPS on BTC 1m, N=10K — cross-asset scaling validation.
# Identical to config_h20_spx_N10k.yaml except target_dataset switched to BTC.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: true                # v0.6-style; β_learn favors crypto from earlier exp
    beta_hidden: 16
    hawkes_alpha: 0.0
    hawkes_kappa: 0.0
  pairwise_kind: stochastic_mlp
  sps_k_random: 50
  sps_resample_per_step: true

training:
  n_iters: 200
  chunk_steps: 24                      # 32 OOMs on 96GB HBM
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0
  seed: 0
  target_dataset: btcusdt
  target_period: 2024Q1_1m
  checkpoint_every_s: 1800
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
