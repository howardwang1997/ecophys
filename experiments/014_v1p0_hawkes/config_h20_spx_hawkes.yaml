# EcoMD v1.0 — v0.9 SPS + Hawkes self-excitation on SPX daily (H20, N=10K).
#
# Tests whether Hawkes-like memory term in price formation can close the gap
# on ACF(r²) shape (v0.6/v0.8 overshoot magnitude but shape sometimes flat).
#
# Hawkes dynamics:
#   log_ret_core = β·ED - 0.5σ² + σ·η                # same as v0.8
#   log_ret      = log_ret_core + κ · memory · sign(core)  # self-excitation
#   memory_t+1   = (1-α)·memory + α·|log_ret_core|          # EMA of past |r|
#
# α = 0.1 (EMA half-life ~7 steps), κ = 0.3 (modest boost).
# Differentiable, no discrete jumps → clean backprop.

simulator:
  n_agents: 10000
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  noise_dist: t
  noise_df: 5
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0
    learnable_beta: false
    beta_hidden: 16
    hawkes_alpha: 0.1                   # EMA decay rate (v1.0 novelty)
    hawkes_kappa: 0.3                   # excitation strength
  pairwise_kind: stochastic_mlp
  sps_k_random: 50
  sps_resample_per_step: true

training:
  n_iters: 200
  chunk_steps: 32
  warmup_steps: 16
  persistent_state: true
  lr: 1.0e-3
  lr_warmup_iters: 10
  grad_clip_max_norm: 100.0
  seed: 0
  checkpoint_every_s: 1800
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 8
    hill_k_frac: 0.05
