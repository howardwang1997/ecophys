# EcoMD v0 demo training config.
# Override with --smoke for the fast smoke test.

simulator:
  n_agents: 200
  d_state: 32
  hidden: 48
  dt: 0.01
  gamma_init: 1.0
  temperature_init: 0.05
  init_state_scale: 0.1
  lam_dissipation: 0.01
  learn_gamma: true
  learn_temperature: true
  price_formation: excess_demand
  price_formation_kwargs:
    beta: 0.02
    kappa: 0.5
    sigma_price: 0.005
    ewma_alpha: 0.05
    initial_log_price: 0.0

training:
  n_iters: 30
  chunk_steps: 32
  lr: 3.0e-3
  grad_clip_max_norm: 1.0
  seed: 0
  target_dataset: spx        # the real data we optimise against
  target_period: 2015-2026_daily
  loss_weights:
    w_acf_sq: 1.0
    w_leverage: 0.2
    w_hill: 0.1
    max_lag: 20
    hill_k_frac: 0.05

evaluation:
  n_realizations: 3
  eval_steps: 2000

smoke:
  n_agents: 100
  n_iters: 4
  chunk_steps: 32
  eval_steps: 600
  n_realizations: 2
