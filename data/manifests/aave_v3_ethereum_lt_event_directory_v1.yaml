  pass: PASS_AAVE_LT_EVENT_DIRECTORY_AUTHORIZE_ALL_CANDIDATE_MECHANICS_PROTOCOL_ONLY
  fail: FAIL_AAVE_LT_EVENT_DIRECTORY_KEEP_ACCOUNTS_RESPONSES_AND_G1_LOCKED
  authorized_next_stage: separately_frozen_all_candidate_historical_state_receipt_payload_source_preflight

limitations:
  - A previous emitted configuration is not authoritative T-minus-one reserve state; every provisional row requires historical eth_call replay.
  - No transaction, receipt, calldata, proposal payload or call trace is opened, so same-execution spillovers outside the Configurator and provider/proxy log set remain unresolved.
  - Historical implementation addresses and end-block bytecode are inventoried, but verified source identity for every active implementation is deferred.
  - Reserve frozen state, eMode interactions, oracle/index/pause/grace changes and ConfigEngine KEEP_CURRENT semantics are not candidate-certified here.
  - Headers are provider-replicated, but fixed-block getters, slots and code come only from Blockscout and are not independent archive-state replication or state-proof evidence.
  - Proposal 204 is development reconnaissance and can never enter an untouched confirmation set.
  - No account, action, liquidation, price value or realized response is opened; G1 and all GPU work remain locked.
