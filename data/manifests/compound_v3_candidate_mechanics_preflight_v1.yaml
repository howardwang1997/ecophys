  - parent_hashes_and_exact_candidate_derivation
  - ethereum_chain_and_finality_sources
  - exact_complete_request_plan
  - all_receipts_and_d0_logs_conform
  - cross_provider_candidate_headers
  - complete_call_traces
  - candidate_mechanism_call_cones_evaluated
  - pre_post_getter_and_proxy_state_evaluated
  - contamination_windows_evaluated
  - at_least_one_fully_conforming_candidate
  - request_trace_and_byte_caps
  - participant_data_access_boundary

decision_policy:
  all_gates_required: true
  pass: PASS_CANDIDATE_MECHANICS_AUTHORIZE_D1_EXPOSURE_PROTOCOL_DESIGN_ONLY
  fail: FAIL_CANDIDATE_MECHANICS_KEEP_ACCOUNT_AND_RESPONSE_ROWS_LOCKED
  authorized_next_stage: separately_frozen_d1_exposure_count_and_cost_protocol_design

limitations:
  - The Beacon light-client finality response is provider-reported; this preflight does not locally verify its BLS signature or Merkle branches.
  - A callTracer tree can establish the provider-returned call surface but not independently prove node execution correctness.
  - Mechanism-cone isolation permits descendants of the exact Configurator and proxy-admin calls; historical deployed-source conformance remains a later hard gate.
  - A clean governance neighborhood covers the Configurator and six frozen proxies only, not unrelated market-wide news or price shocks.
  - Historical candidates are development events and cannot replace prospective first-event/no-replacement confirmation.
  - No account, participant action, liquidation, price, response or model row is authorized by this preflight.
