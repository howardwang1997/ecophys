limitations:
  - The latest-minus-64 snapshot is a fixed confirmation-depth convention, not Ethereum consensus finality.
  - The latest head and confirmed snapshot are supplied by one Blockscout endpoint and are not independent observations.
  - Any intervention clock or participant-response study requires separate consensus-finality and provider-replication checks.
  - The Blockscout endpoint is a transport provider, not an independent authority over Ethereum consensus or a complete licence for redistributing bulk chain data.
  - Only one confirmation-depth snapshot and one fixed historical block are tested; this does not prove continuous archive completeness.
  - Getter equality covers base token, governor and pause guardian only; it does not reconstruct every executed migration or current collateral configuration.
  - Shared proxy admin or Configurator state does not establish an untreated control market.
  - No account mapping, balance, action event, transaction, receipt, log, liquidation, oracle price or realized response may be inferred from this audit.
