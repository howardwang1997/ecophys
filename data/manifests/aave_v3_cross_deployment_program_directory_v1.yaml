  primary_universe_selected_before_new_event_counts: true
  selection_basis:
    - canonical Aave V3 main pool in the pinned official address book
    - free no-auth PublicNode primary RPC listed on 2026-08-16
    - separate public chain RPC for cutoff-header replication
    - architecture and governance-route breadth across mature EVM deployments
  excluded_from_primary_universe:
