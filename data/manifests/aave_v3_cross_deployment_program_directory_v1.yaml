gates:
  - parent_hashes_and_decisions
  - frozen_official_address_sources
  - exact_deployment_universe_and_split
  - replicated_chain_identities
  - deterministic_replicated_cutoff_headers
  - complete_provider_log_directories
  - complete_configurator_surface_derivation
  - complete_bounded_configurator_log_directories
  - strict_log_normalization
  - no_duplicate_or_conflicting_logs
  - source_corrected_configurator_upgrade_histories
  - exact_program_grouping_and_block_headers
  - minimum_train_support
  - minimum_validation_support
  - minimum_test_support
  - minimum_total_support
  - request_byte_log_and_program_caps
  - zero_account_and_response_access_boundary

decision_policy:
  all_gates_required: true
  pass: PASS_CROSS_DEPLOYMENT_PROGRAM_DIRECTORY_AUTHORIZE_B1_COMPILER_PROTOCOL_DESIGN_ONLY
  fail: FAIL_CROSS_DEPLOYMENT_PROGRAM_DIRECTORY_KEEP_B1_ACCOUNTS_RESPONSES_G1_GPU_LOCKED
  authorized_next_stage: separately_frozen_historical_abi_source_receipt_state_compiler_protocol_design_only

limitations:
  - Ethereum treatment structure was already explored and is development-only; it is excluded from every support threshold.
  - B0 enumerates transactions through Configurator-address logs and can miss state-changing routes that emit no Configurator-surface event.
  - Configurator topics and data are preserved but not yet mapped to historical ABI semantics, calldata, call paths, authoritative state writes or proposal intent.
  - Header timestamp monotonicity is assumed for deterministic cutoff binary search and adjacent cutoff blocks are checked explicitly.
  - Public free RPC completeness is tested by exact partitions and fail-closed rules but is not an independently proven archival guarantee.
  - Transaction hashes from logs are known, but transaction, receipt, calldata and trace objects remain unopened.
  - Counts determine only whether B1 compiler protocol design is worthwhile; accounts, responses, G1 and all GPU work remain locked.
