[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomd"
version = "0.0.1"
description = "EcoMD: Differentiable molecular-dynamics-style simulator for financial markets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Howard Wang" }]
dependencies = [
    # Core numerical / ML
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "torch>=2.3",
    # Data ingestion
    "yfinance>=0.2.40",
    "requests>=2.31",
    # Storage / IO
    "zstandard>=0.22",
    "boto3>=1.34",
    # Experiment management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "PyYAML>=6.0",
    "wandb>=0.17",
    # Stats / financial analysis
    "statsmodels>=0.14",
    "arch>=7.0",               # GARCH family
    "POT>=0.9",                # optimal transport / Wasserstein
    # SDE / physics (default: PyTorch stack)
    "torchsde>=0.2.6",
    # Progress / utilities
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
physics = [
    # JAX + diffrax for certain physics modules (ODE integration, fluctuation theorem batched analysis)
    "jax[cpu]>=0.4.30",
    "diffrax>=0.5",
    "equinox>=0.11",
]
research = [
    # Robust local-polynomial RD inference used by generated and real-data research gates
    "rdrobust==2.0.0",
    # Pinned to the audited Nempy 3.0.3 historical XML parser contract
    "xmltodict==0.12.0",
]

[tool.setuptools.packages.find]
include = ["ecomd*"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # long lines are OK for data/math

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["ecomd"]

[tool.pytest.ini_options]
testpaths = ["tests", "ecomd"]
addopts = "-ra -q"
markers = [
    "slow: resource-heavier regression tests",
]
