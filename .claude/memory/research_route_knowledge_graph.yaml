      Brownian case is ordinary first-passage mathematics, while marked informed flow and
      matched-variance jump kernels reverse or change the response with both controls fixed. CPI
      use is state-gated and selected; public EBS MBP has no individual EBS order identifiers or
      priority; and neither two native physical-time simulators nor an independent real mechanism
      satisfy the same-estimand contract. The frozen 12% full-T0 forecast resolved false because
      these hard gates failed, not because of the probability floor.
    evidence:
      - id: price_time_commitment_ebs_cpi_kg
        kind: official_market_protocol
        availability: external
        uri: https://cmegroupclientsite.atlassian.net/wiki/spaces/EPICSANDBOX/pages/457704180/EBS-Conditional-Price-Increments
