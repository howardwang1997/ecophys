      - id
      - node_type
      - title
      - status
      - opened_at
      - closed_at
      - phase
      - terminal_gate
      - failure_codes
      - summary
      - evidence
      - artifacts
      - reusable_assets
      - reopen_conditions
      - forbidden_actions
