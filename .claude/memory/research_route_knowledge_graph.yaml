schema_version: 2

graph:
  id: ecophys_research_routes
  updated_at: "2026-08-26"
  scope:
    start_date: "2026-04-24"
    end_date: null
    granularity: route_level_decisions
    completeness: verified_terminal_routes_and_subroutes
    historical_backfill_complete: false
    notes:
      - This graph covers verified terminal route and independent subroute decisions from 2026-04-24 onward, plus active routes needed to preserve current lineage.
      - Historical backfill remains non-exhaustive; historical parked hypotheses, invalid runs, single ablations, transport failures, and routes without a formal terminal decision are excluded unless needed to preserve current lineage.
      - Cross-branch evidence is pinned to immutable commits and validated offline; a moving branch name is provenance, not the evidence identity.
      - Markdown memories remain narrative evidence; this file is the canonical machine-readable route registry for its declared scope.

schema:
  allowed_node_types:
    - research_route
    - research_subroute
  allowed_statuses:
    - candidate
    - active
    - parked
    - passed_closed
    - failed_closed
    - superseded
  allowed_edge_types:
    - next_selected_route
    - derived_from
    - supersedes
    - aggregates
    - blocks
  allowed_locator_availability:
    - present
    - missing_legacy
    - external
    - git_ref
  node:
    required_fields:
      - id
      - node_type
      - title
      - status
      - opened_at
      - closed_at
      - phase
      - terminal_gate
      - failure_codes
      - summary
      - evidence
      - artifacts
      - reusable_assets
      - reopen_conditions
      - forbidden_actions
  edge:
    required_fields:
      - id
      - source
      - type
      - target
      - rationale
      - evidence_refs
  locator:
    required_fields:
      - id
      - kind
      - availability
    availability_fields:
      present:
        - path
      missing_legacy:
        - path
        - note
      external:
        - uri
      git_ref:
        - ref
        - commit
        - path

nodes:
  - id: mace_lite_v1_architecture
    node_type: research_subroute
    title: MACE-lite v1 learned-potential architecture
    status: failed_closed
    opened_at: "2026-04-24"
    closed_at: "2026-04-24"
    phase: architecture_ablation
    terminal_gate: force_scale_and_stylized_fact_fidelity
    failure_codes:
      - zero_to_four_of_eleven_fidelity
      - force_magnitude_sixty_to_one_hundred_ninety_times_too_small
      - biased_knn_lost_long_range_pair_signal
    summary: MACE-lite v1 failed across eight ablations because nodewise readout over-smoothed the force and biased k-nearest-neighbour sparsification removed long-range pair information.
    evidence:
      - id: mace_v1_failure_memory
        kind: closure_memory
        availability: present
        path: .claude/memory/project_mace_lite_failure.md
    artifacts:
      - id: mace_v1_ablation_result
        kind: formal_result
        availability: present
        path: experiments/008_ecomd_v1_ablation/results/ablation_summary.md
      - id: mace_v1_force_probe_result
        kind: formal_result
        availability: present
        path: experiments/018_force_probe/results/force_magnitude_table.md
    reusable_assets:
      - force_magnitude_preflight
      - stochastic_pair_sampling_replacement
      - immutable_failed_architecture_fixture
    reopen_conditions:
      - A new learned-potential module must remove both diagnosed causes and pass a force-ratio smoke gate before any remote run.
    forbidden_actions:
      - Do not rerun the v1 architecture or edit it into a nominally new model.
      - Do not spend accelerator time before the force-magnitude preflight passes.

