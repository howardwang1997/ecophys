      - ar1_return_drift_contamination
      - stylized_fact_credit_invalid
    summary: The headline nine-of-eleven Tier 4.2 score was a best-seed result; the broad multiseed mean stayed near five and the return autocorrelation credit was contaminated by a structural AR(1) drift.
    evidence:
      - id: tier42_closure_memory
        kind: closure_memory
        availability: present
        path: .claude/memory/project_arch_state_2026-05-04.md
