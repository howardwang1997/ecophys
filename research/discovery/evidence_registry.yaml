  license: Primary documentation read only; no account-data, cross-party-join or derived-release rights inferred.
  role: Client loan transaction and historical movement reporting capabilities.
  limitation: No public complete cross-party instruction/substitution/notice/outcome panel or research rights established;
    historical records are not claimed absent.
