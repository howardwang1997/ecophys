  limitation: Already cited in Cycle18; new registry access record, not new independent work or verified account
    assignment.
- id: policy_resolution_lightspeed_faq_20260909
  kind: official_broker_documentation
  title: Lightspeed Intraday Trading FAQs
  uri: https://lightspeed.com/trading/intraday-trading-faqs
