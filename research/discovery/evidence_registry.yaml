    date.
- id: policy_resolution_lightspeed_margin_20260909
  kind: official_broker_documentation
  title: Lightspeed Margin Trading
  uri: https://lightspeed.com/trading/margin
  version: current_public_page_retrieved_20260909
  license: Primary documentation read only; no account-data, cross-party-join or derived-release rights inferred.
  role: Offered leverage can depend on platform, account and prior user history.
  limitation: No account-specific historical risk-policy series or assignment instrument supplied; advertised rates
    were not analyzed.
