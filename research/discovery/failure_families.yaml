schema_version: 1
families:
  - id: direct_prior_collision
    definition: A primary work already contains the central object, estimand, and claimed contribution.
    canonical_route_ids: [partial_order_hard_event_dynamics]
    mandatory_test: Map the proposed claim sentence-by-sentence to the closest primary work and isolate a non-cosmetic residual.
    reopen_evidence: A residual theorem, estimand, or empirical contract that is not a market-labelled specialization of the prior work.
  - id: standard_parent_reduction
    definition: The centerpiece is an instance or immediate corollary of a mature parent problem.
    canonical_route_ids: [market_native_reselection_20260825]
    mandatory_test: Give a formal reduction in both directions or a counterexample showing why the market mechanism escapes the parent class.
    reopen_evidence: A market-specific assumption that yields a theorem false in the parent class, with a matching boundary or lower bound.
  - id: observation_quotient_nonidentification
    definition: Observable market state merges latent states that imply different responses to the proposed intervention.
    canonical_route_ids: [observation_quotient_response]
    mandatory_test: Construct two observationally equivalent states with opposite or order-one different intervention responses.
    reopen_evidence: An externally anchored sufficient state, or a valid partial-identification result with honest abstention.
  - id: local_to_global_gap
    definition: Local influence, spectrum, topology, or first-order response does not control the global path law or failure event.
    canonical_route_ids: [market_physics_reselection_20260825]
    mandatory_test: Hold the proposed local statistic fixed while reversing the global outcome in a minimal market.
    reopen_evidence: A proved composition theorem with explicit assumptions and a matching failure construction outside them.
  - id: finite_size_scaling_false_positive
    definition: A finite crossover, slow mixture, heterogeneity, or conservation law is misread as a critical singularity.
    canonical_route_ids: [trajectory_space_liquidity_dpt]
    mandatory_test: Fit and falsify smooth-crossover and slow-regime-mixture controls under a frozen thermodynamic normalization.
    reopen_evidence: A declared limit order and a nonanalytic or universal statement with finite-size error control.
  - id: hard_event_incompatibility
    definition: Ties, priority, queue depletion, or transaction rounding invalidate a smooth or order-insensitive argument.
    canonical_route_ids: [partial_order_hard_event_dynamics]
    mandatory_test: Evaluate the claim at a tie or event-order reversal and under the protocol's exact action grammar.
    reopen_evidence: A theorem uniform at the hard boundary or an explicit set-valued formulation that survives exact semantics.
  - id: unitization_noninvariance
    definition: The physical object changes under equivalent units, event batching, labels, clocks, or transaction decompositions.
    canonical_route_ids: [market_native_reselection_20260825]
    mandatory_test: Apply at least two representation-preserving refinements and check whether the object and claim are invariant.
    reopen_evidence: A quotient or native object whose value and intervention meaning are preserved under the declared equivalences.
  - id: causal_field_contract_missing
    definition: Assignment, support, pre-state, outcomes, or interference units are not publicly and reproducibly observed.
    canonical_route_ids: [verification_liquidity]
    mandatory_test: Write a field-level schema contract and fail closed on every missing assignment or pre-state field before outcomes.
    reopen_evidence: Versioned, licensed data with the assignment, state, outcome, timing, and interference mapping frozen.
  - id: two_system_contract_missing
    definition: The same estimand cannot be implemented in two independently maintained systems.
    canonical_route_ids: [market_physics_reselection_20260825]
    mandatory_test: Pin release, license, lineage, state, intervention, observable, RNG, and output semantics for each system.
    reopen_evidence: Two distinct lineage groups with executable semantic fixtures for the same estimand.
  - id: cross_system_estimand_mismatch
    definition: Nominally similar systems change the dose, mechanism, population, or observation operator at the same time.
    canonical_route_ids: [program_trace_market_tom]
    mandatory_test: State a common intervention and observable mapping, then construct an apples-to-oranges control.
    reopen_evidence: A common causal estimand with frozen mappings and a predeclared allowed mismatch bound.
  - id: evaluation_contamination
    definition: Search, model pretraining, adaptive outcome access, best-seed choice, or evaluator reuse leaks confirmation evidence.
    canonical_route_ids: [tier42_stylized_fidelity_breakthrough_claim]
    mandatory_test: Separate exploration from confirmation by time, seed, simulator family, and evaluator; record every branch and test family.
    reopen_evidence: A prospective or procedurally fresh holdout with multiplicity control and immutable provenance.
  - id: simulator_oracle_trilemma
    definition: A fully known executable simulator is already an oracle; missing inputs cause non-identification; unknown future changes are unknowable.
    canonical_route_ids: [program_trace_market_tom]
    mandatory_test: Compare against an equal-cost direct rollout and state exactly which input is hidden without making the target unidentified.
    reopen_evidence: A decision-relevant query where the learned method has a frozen cost or access advantage and calibrated error over the oracle.
