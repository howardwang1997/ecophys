resolutions:
  - forecast_id: cycle12_price_time_commitment_full_t0
    resolved_at: "2026-08-26T04:08:16Z"
    outcome: false
    evidence_refs:
      - cycle12_ebs_cpi_official
      - cycle12_ebs_mbp_schema
      - cycle12_mrt_theory_primary
      - cycle12_latency_market_making_primary
      - cycle12_abides_official
      - cycle12_pams_official
    rationale: >-
      The frozen chi-rho formulation failed independent named gates. Its clean Brownian case is an
      ordinary first-passage reduction; matching both controls does not determine response under
      marked informed flow or matched-variance jump kernels; CPI use is state-gated and selected;
      public EBS MBP lacks individual order lifecycle and priority; and no two native physical-time
      simulator lineages or independent real price-time mechanism close the same-estimand contract.
      The false resolution follows the frozen rule and is unrelated to the 15% active-status brake.
