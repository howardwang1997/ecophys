    resolve_by: "2026-08-28T00:00:00Z"
    lower: 0.05
    point: 0.12
    upper: 0.25
    resolution_rule: >-
      Resolve true only if the frozen chi-rho formulation survives the fifteen-work exact-prior
      and analytic-twin audit, supplies a nontrivial result beyond barrier crossing and ordinary
