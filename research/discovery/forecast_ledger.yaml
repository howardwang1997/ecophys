      The frozen claim failed independent hard gates. Synthetic interventional consistency does not
      identify off-support participant adaptation in the real system; two field rule changes do not
      provide enough independent intervention-level replication for a general validity relation;
      learned and structural simulators lack a frozen common rule-action language; and the TSE,
      CME, SEC and pause assets do not jointly supply independent assignment, complete state,
      publication rights and same-estimand implementations. The false resolution follows the
      predeclared rule and is unrelated to the 15-percent active-status brake.
