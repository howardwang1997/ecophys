schema_version: 1
card_id: transportable_interventional_market_law_discovery
cutoff_date: "2026-08-25"
databases:
  - arXiv
  - Crossref
  - GitHub
  - OpenReview
  - official_project_pages
queries:
  - '"AI scientist" interactive scientific law discovery benchmark intervention abstention'
  - 'scientific discovery benchmark market simulator causal experiment hidden parameter'
  - 'cross simulator causal abstraction intervention map transportable law discovery'
  - 'LLM active causal discovery fresh SCM identifiability abstention benchmark'
  - 'market simulator scientific law discovery ABIDES PAMS cross environment response'
inclusion_rules:
  - Primary paper, official benchmark report, or official versioned repository.
  - Directly concerns interactive discovery, causal identification, falsification, causal abstraction, or transport.
  - For market specificity, contains a simulated market or a theorem that directly subsumes the proposed mapping.
exclusion_rules:
  - Static science exams without experiment choice or evidence iteration.
  - Proposal-only systems with no evaluable discovery or falsification component unless used only as background.
  - Community reimplementations when an official artifact exists.
  - Search-result snippets or secondary summaries as support for technical claims.
works:
  - id: petri_bench_market
    title: petri-bench
    year: 2026
    classification: direct
    directness: Exact collision with procedurally fresh causal experiments over a market simulator and objective process scoring.
    claim_overlap: Occupies hidden-parameter market discovery, contamination resistance, process audit, and simple experimental-design baselines.
    disposition: Broad MarketScienceBench formulation is closed; residual must discover cross-engine laws rather than identify a hidden slider.
    evidence_ref: petri_bench
    primary: true
  - id: newtonbench
    title: NewtonBench
    year: 2026
    classification: direct
    directness: Interactive law discovery with counterfactual law shifts and memorization resistance.
    claim_overlap: Occupies fresh simulated-world law discovery and held-out counterfactual evaluation.
    disposition: Residual requires independently implemented market engines plus law-or-certificate output.
    evidence_ref: newtonbench
    primary: true
  - id: causalab
    title: CausaLab
    year: 2026
    classification: direct
    directness: Active causal discovery over fresh SCMs with held-out mechanism transfer.
    claim_overlap: Occupies intervention choice, mechanism recovery, and cross-instance transfer.
    disposition: Residual cannot be merely active SCM recovery in market language.
    evidence_ref: causalab
    primary: true
  - id: causalds
    title: CausalDS
    year: 2026
    classification: direct
    directness: Treats identifiability, uncertainty, and correct abstention as first-class scored outcomes.
    claim_overlap: Directly occupies generic epistemic abstention in AI-scientist evaluation.
    disposition: Unresolved until a market-specific constructive certificate and selective finite-sample guarantee are separated.
    evidence_ref: causalds
    primary: true
  - id: causalgame
    title: CausalGame
    year: 2026
    classification: direct
    directness: Interactive experiments under confounding, selection, and measurement failures.
    claim_overlap: Occupies causal-thinking stress tests and mechanism reports under adversarial observation.
    disposition: Residual must be a market response law, not another causal-game benchmark.
    evidence_ref: causalgame
    primary: true
  - id: boxinggym
    title: BoxingGym
    year: 2025
    classification: direct
    directness: Automated experimental design and model discovery in generative probabilistic environments.
    claim_overlap: Occupies information-gain experiment selection and predictive model-discovery evaluation.
    disposition: Required baseline; a new method must improve selective law validity, not only predictive fit.
    evidence_ref: boxinggym
    primary: true
  - id: ai_newton
    title: AI-Newton
    year: 2025
    classification: direct
    directness: Builds structured concepts and general laws across multiple physical experiments.
    claim_overlap: Occupies symbolic cross-experiment physical-law construction inside a DSL.
    disposition: Residual requires heterogeneous market engines, interventions, and honest non-identification.
    evidence_ref: ai_newton_paper
    primary: true
  - id: causal_consistency
    title: Causal Consistency of Structural Equation Models
    year: 2017
    classification: direct
    directness: Formalizes exact state and intervention transformations that preserve causal effects.
    claim_overlap: Nearly identical to the proposed state-map/intervention-map commuting object.
    disposition: Unresolved; a stochastic-market finite-sample law-or-certificate theorem must exceed exact transformation.
    evidence_ref: causal_consistency
    primary: true
  - id: transportability
    title: External Validity from Do-Calculus to Transportability Across Populations
    year: 2014
    classification: direct
    directness: Gives graphical conditions and formulas for causal-effect transport across environments.
    claim_overlap: Occupies generic statements that an interventional response can transfer across systems.
    disposition: Residual needs unknown adapters and adaptive trajectory laws, not a standard transport formula.
    evidence_ref: transportability
    primary: true
  - id: multi_level_causal_embeddings
    title: Multi-Level Causal Embeddings
    year: 2026
    classification: direct
    directness: Embeds multiple detailed causal models into a common coarser model.
    claim_overlap: Directly approaches common-state construction across heterogeneous simulators.
    disposition: Unresolved until the market trajectory and selective-risk theorem is formalized.
    evidence_ref: multi_level_causal_embeddings
    primary: true
  - id: unsupervised_causal_abstractions
    title: Unsupervised Causal Abstractions Discovery
    year: 2026
    classification: direct
    directness: Learns high-level causal abstractions from low-level measurements with identifiability.
    claim_overlap: Directly approaches joint learning of a market macro-state map.
    disposition: Unresolved until adaptive agents, clocks, approximate adapters, and witness-producing abstention add a nontrivial theorem.
    evidence_ref: unsupervised_causal_abstractions
    primary: true
  - id: interventional_simulator_surrogates
    title: Interventionally Consistent Surrogates for Complex Simulation Models
    year: 2024
    classification: direct
    directness: Uses state and intervention maps to learn high-probability interventionally consistent surrogates for complex simulators.
    claim_overlap: Occupies the proposed simulator abstraction, intervention compiler, and interventional response-error object.
    disposition: Decisive collision; market vocabulary and a second simulator do not create a new general theorem.
    evidence_ref: interventional_simulator_surrogates
    primary: true
  - id: interventional_crl_sample_complexity
    title: Sample Complexity of Interventional Causal Representation Learning
    year: 2024
    classification: direct
    directness: Gives finite-sample probabilistic recovery guarantees with unknown latent representations and stochastic soft interventions.
    claim_overlap: Occupies finite-sample unknown-representation recovery as the proposed theorem's generic residual.
    disposition: Decisive module collision; a successor must exploit a market-native structure not present in general causal representation learning.
    evidence_ref: interventional_crl_sample_complexity
    primary: true
  - id: structural_causal_bandit_transportability
    title: On Transportability for Structural Causal Bandits
    year: 2026
    classification: direct
    directness: Combines heterogeneous source environments, causal transportability, and adaptive target interventions with sample-efficiency guarantees.
    claim_overlap: Occupies the transport-plus-adaptive-probing part of the proposed selective discovery theorem.
    disposition: Decisive module collision; market simulators alone do not distinguish the parent problem.
    evidence_ref: structural_causal_bandit_transportability
    primary: true
  - id: certified_interventional_fidelity
    title: "Certified Interventional Fidelity: Anytime-Valid, Adaptive Evaluation of Causal Claims in Mechanistic Interpretability"
    year: 2026
    classification: direct
    directness: Gives anytime-valid confidence sequences for a causal fidelity estimand under adaptive intervention sampling.
    claim_overlap: Occupies finite-sample false-claim control under adaptively selected interventions.
    disposition: Decisive module collision; the proposed risk guarantee reduces to this layer plus a confidence-set target diameter.
    evidence_ref: certified_interventional_fidelity
    primary: true
  - id: selective_conformal_interventions
    title: Partial Causal Structure Learning for Valid Selective Conformal Inference under Interventions
    year: 2026
    classification: direct
    directness: Learns the intervention invariance relations needed for selective finite-sample coverage and corrects coverage degradation.
    claim_overlap: Occupies unknown invariance structure plus selective intervention validity.
    disposition: Decisive module collision; adding dependent market trajectories is a concentration condition rather than a new law-or-witness principle.
    evidence_ref: selective_conformal_interventions
    primary: true
  - id: discoverphysics
    title: DiscoverPhysics
    year: 2026
    classification: adjacent
    directness: Interactive hidden-law discovery in procedurally altered N-body worlds.
    claim_overlap: Occupies experiment-history reasoning and held-out trajectory prediction in physics.
    disposition: Does not combine independent simulator lineages or causal abstention.
    evidence_ref: discover_physics
    primary: true
  - id: sde
    title: Evaluating Large Language Models in Scientific Discovery
    year: 2026
    classification: adjacent
    directness: Scenario-grounded questions and project-level propose-evaluate-refine loops.
    claim_overlap: Occupies multi-round evaluation against supplied computational oracles.
    disposition: Does not decide novelty or cross-engine causal invariance.
    evidence_ref: sde_primary
    primary: true
  - id: discoveryworld
    title: DiscoveryWorld
    year: 2024
    classification: adjacent
    directness: Interactive virtual discovery tasks with procedural progress and full histories.
    claim_overlap: Occupies long-horizon discovery interaction and task scorecards.
    disposition: Fixed worlds do not test cross-engine law transport.
    evidence_ref: discoveryworld
    primary: true
  - id: discoverybench
    title: DiscoveryBench
    year: 2025
    classification: adjacent
    directness: Data-driven hypothesis and workflow discovery over real and synthetic datasets.
    claim_overlap: Occupies open-form hypothesis scoring and statistical-semantic analysis.
    disposition: Published-target rediscovery and no active cross-engine interventions.
    evidence_ref: discoverybench
    primary: true
  - id: popper
    title: Automated Hypothesis Validation with Agentic Sequential Falsifications
    year: 2025
    classification: adjacent
    directness: Sequential falsification with formal Type-I error control.
    claim_overlap: Occupies generic agentic hypothesis falsification and evidence aggregation.
    disposition: Required confirmatory baseline; it does not select or transport market laws.
    evidence_ref: boxinggym_popper_adjacent
    primary: true
  - id: baby_aigs
    title: AIGS
    year: 2024
    classification: adjacent
    directness: Explicit full-process falsification agent.
    claim_overlap: Occupies the broad claim that an AI scientist should generate and falsify laws.
    disposition: Preliminary evidence does not provide an objective cross-engine guarantee.
    evidence_ref: baby_aigs
    primary: true
  - id: autodiscovery
    title: AutoDiscovery
    year: 2025
    classification: adjacent
    directness: Searches a hypothesis tree using belief change as an acquisition score.
    claim_overlap: Occupies open data-driven hypothesis search and branch allocation.
    disposition: Exploration baseline only because surprise and adaptive reuse do not confirm a law.
    evidence_ref: autodiscovery
    primary: true
  - id: ai_scientist_v2
    title: The AI Scientist-v2
    year: 2025
    classification: background
    directness: Progressive agentic experiment tree with branch abandonment and debugging.
    claim_overlap: Occupies workflow orchestration rather than the scientific estimand.
    disposition: Design reference only; custom license and unsafe code execution preclude vendoring.
    evidence_ref: ai_scientist_v2
    primary: true
  - id: science_agent_bench
    title: ScienceAgentBench
    year: 2025
    classification: background
    directness: Executable paper-derived scientific workflows with code, output, and cost scoring.
    claim_overlap: Establishes workflow and cost baselines.
    disposition: Does not perform fresh cross-engine law discovery.
    evidence_ref: science_agent_bench
    primary: true
unresolved_direct_collisions:
  - causalds
  - causal_consistency
  - multi_level_causal_embeddings
  - unsupervised_causal_abstractions
  - interventional_simulator_surrogates
  - interventional_crl_sample_complexity
  - structural_causal_bandit_transportability
  - certified_interventional_fidelity
  - selective_conformal_interventions
