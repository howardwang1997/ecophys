schema_version: pi-reexploration-directive-v1
decision_id: pi_topic_reexploration_directive_20260906
decision_kind: pi_directed_search_basis_reopening
decided_at: "2026-09-06T00:00:00Z"
authorized_by: PI
authorization_channel: interactive_chat
authorization_text: >-
  PI directive (2026-09-06, Chinese): "先暂停，重新探索市场模拟，ecomd等相关的选题，要求从
  科学性、创新性等各方面都站得住脚，并且在选题的时候要考虑数据、算力等，考虑清楚，要有
  清晰的规划" — pause the A-1 line and re-explore market-simulation/EcoMD-related topic
  selection, required to hold up on scientific soundness and novelty, with data and compute
  feasibility considered and a clear plan.
status: active
stage: D_minus_3_screening_reopened
scope:
  what_is_paused:
    - A-1 preparation (site selection, ethics filing, preregistration drafting). Paused by PI
      direction, NOT failed; the frozen thesis v2 / C2 fork / lab-asset-v3 assets remain frozen
      and intact; reopening A-1 requires a new PI machine decision.
  what_is_opened:
    - A new screening phase for market-simulation / EcoMD-related topics under a CHANGED SEARCH
      BASIS: methodology-first claims about market simulators as the object of study (training,
      constraints/forcing layers, identification, evaluation), where ground truth is available
      by construction — instead of the saturated market-law-truth frame that requires
      intervention truth assets. Rationale and candidate families are frozen in
      papers/proposal/ecomd_topic_reexploration_plan_2026-09-06.md.
  basis_of_reopening:
    - Protocol status "screening" (literature, source, schema, and theorem work only; no
      route-level decision) requires no trigger and remains legal under
      research/discovery/protocol.yaml.
    - No failed_closed route is reopened: the candidate families are new formulations with new
      estimands; provenance follows the protocol's scientific_revision rule (child cards, never
      overwrite prior evidence).
authorized_actions:
  - D-3 question framing per candidate family (native scientific object, intervention,
    observable, invariances, explicit nonclaims).
  - D-2 scenario/evidence maps: searched primary-work manifests, route-graph failure reuse,
    unresolved-collision lists.
  - D-1 hostile falsification for at most two surviving families per cycle limits.
  - Forecast-ledger entries for resolved forecasts.
forbidden_actions:
  - No topic-card creation, route activation, or status change beyond "screening" without
    passing the full activation gate (hostile T0 lower bound >= 0.15, 15 primary works, 2+
    killer tests survived, two independent simulator lineages with native contracts, real-data
    bridge qualified, contamination control, confirmation split, outcome-blind decision,
    explicit PI authorization).
  - No GPU use, simulator execution, market-data outcome access, data purchase, human subjects,
    outreach, or ethics filing during screening (D_minus_3/D_minus_2).
  - No reopening of failed_closed families; the pre-killed families in the reexploration plan
    stay dead unless a qualified trigger appears.
  - verification_liquidity holdout stays sealed until 2026-10-17 UTC.
  - Paper D is terminal; no manuscript changes under this decision.
stop_rules:
  - If both priority families die at D-2 (direct collision found), the reframed search closes
    and the result is recorded — no forced continuation, no label rescue.
  - Screening terminates without a card if no family passes D-1; the PI is then re-consulted
    with the evidence.
effective_until: screening_verdict_or_pi_revocation
