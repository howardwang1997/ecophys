authorized_actions:
  - Extend the local lab platform seed toward the A-3 Part 4 contract: full order lifecycle with
    client/server/matching timestamps, reason-coded rejections, pre/post best quotes, a full-book
    state hash per accepted action, and a replay prestate (endowments, induced-value draws,
    information schedule, initial book, rule configuration, RNG state, assignment key).
  - Build and run deterministic-replay verification and schema-conformance fixtures; freeze the
    exact schema as a versioned artifact at A-2 exit.
  - Run synthetic robot pilots (no human participants) on the local Mac CPU to exercise both rule
    arms under one arm-invariant grammar.
  - Record each engineering iteration, fixture result, and stop-rule evaluation append-only in the
    work log and a formal A-2 result document.
forbidden_actions:
  - No human participants, recruitment, outreach, site contact, or ethics filing (A-1 rung).
  - No outcome access to any real-market dataset; no data purchase; no confirmation-site contact.
  - No treatment-selection adjudication (separate bounded A-3 audit; this decision conformance-
    qualifies the arm-invariant grammar only).
  - No candidate harvesting, topic-card creation, or re-entry authorization; A-2 success does not
    reopen any closed route by itself.
  - No EcoMD integration, no simulator execution for scientific inference, no GPU use. Compute is
    local Mac CPU only.
stop_rules:
  - A-3 Part 8 rule 1 binds: platform conformance or deterministic replay failure after two
    engineering iterations terminates the asset build and is recorded in the decision history.
  - Any schema change that makes the tape grammar arm-dependent voids the iteration.
exit_criteria:
  - All A-3 Part 4 fields present in emitted tapes; deterministic replay reproduces every state
    hash on conformance fixtures and robot pilots; schema frozen as a versioned artifact; formal
    A-2 result written.
effective_until: a2_exit_or_stop_rule_terminal_or_pi_revocation
