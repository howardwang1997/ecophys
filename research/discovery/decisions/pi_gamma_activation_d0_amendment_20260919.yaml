scope_interpretation: >-
  Activation of the merged GAMMA-led reexploration program (route
  reexploration_merged_gamma_led_paper), answering the pending decision named in
  the goal_state live-track list and the 2026-09-16 route assessment: the
  2026-09-12 withhold ("PI pre-D0 decision withholds confirmation and training
  activation") is lifted. The D1 authorization chain
  (pi_reexploration_d1_authorization_20260906, execution-authorized prep to D0)
  resumes from its parked phase. The D0 outcome-blind freeze date is amended
  pre-hash from 2026-09-19 to 2026-10-09 by the mechanism the calendar proposal
  itself names (Annex B(j) + Section 1.3 path amendment, recorded before any
  hash is computed; lawful per the C-11 pre-freeze-erratum precedent): the
  freeze sha256 has not been computed, no [TO BE PINNED AT D0] field has been
  filled, and no outcome has been accessed, so the document remains lawfully
  amendable. The amendment edits all eight freeze-date pin sites inside prereg
  v2 (header freeze_date and freeze_policy; Section 1.2 version-table D0 row;
  Section 1.2 reference calendar; Section 1.3 R2 object path; Section 7
  archive-layout row; Annex A.10 item 10; Annex B(j)) and adds errata-register
  entry C-12 enumerating them; superseded historical documents (prereg v1,
  panel response, calendar proposal, regression-battery note) are records and
  are not edited. The same +20-day shift re-bases the campaign-event-anchored
  resolve_by dates of the package-bound forecast-ledger entries (prereg
  Section 9 binds the ledger into the preregistration package); the ledger's
  existing entries are prefix-protected by the discovery validator and cannot
  be edited in place, so the re-basing is recorded here (forecast_rebasing
  below) and in C-12, not in the ledger file. The activation carries prereg v2
  as-is: the Annex B(a)-(d) convention constants (bootstrap seeds, G9 stride,
  S3 seeds 20260974-76, 10-seed subsets) are ratified as pinned, no changes,
  closing the panel-response "PI-ratifiable at v2 review" item. The second
  clause of the authorization text restates and strengthens the
  compute-location rule for this program: NO experiment of any size runs on
  the MacBook — this supersedes the ops plan's Mac-legal dry-run/smoke
  classifications for pre-freeze items 9 and 10 (node-cleanup dry-runs,
  reflexive-policy N<=500 CPU smokes), which now execute on remote workers
  over ssh. The MacBook retains document authoring (including the
  analyzer-contract document itself), governance, git, and seconds-scale
  checks only. Execution context recorded at activation: the 2026-09-19 V100
  cold-data migration (v100bts / 100%->87%, v100ts /data 99%->86%) partially
  pre-discharges the D0-S1 node-cleanup concern; prereg v2 Section 8.3 makes
  >=40%-free nodes a STOP-class LAUNCH prerequisite (not optional headroom),
  and both training volumes are currently below it (v100bts /data ~32% free,
  v100ts /data ~14% free), so the physics-project bulk decision is required
  before campaign launch and executes at D0-S1 per the frozen calendar. Venue
  targeting per the PI 2026-09-18 directive (next target ICML 2027, market
  physics preferred): the merged GAMMA-led paper aims at ICML 2027 main track
  as "training identification through a discrete mechanism layer"; Paper D is
  reported submitted to ICLR 2027 by the PI on 2026-09-18.
