  second 200G data disk (vdc mounted /data2). Free space map: v100ts /data
  70G (14%) + /data2 19G (9%) + / 26G; v100bts /data 153G (32%) + /data2 82G
  (56%) + / 26G; cluster total 376G, fragmented. v100ts /data2 is occupied by
