  huggingface cache 43G) covered by the 2026-09-19 physics-bulk stand-down
  (pi_bulk_icloud_no_action_20260919). The ops plan's own working-set budget
  (ecomd_reexploration_d1_killer_tests_and_ops_2026-09-06.md line 183) is
  ~300-500 GB across both nodes (480 final checkpoints x 0.15-0.5 GB +
  corpora + logs).
scope_interpretation: >-
  (a) The directive answers the Section 8.3 STOP in advance under the gate's
  own "PI decision at that point" clause: launch is not to be blocked by any
  single volume's relative-free percentage. Frozen text is NOT amended; the
  gate still fires mechanically at D0-S1 and this record is the standing PI
  answer it reads.
  (b) Campaign storage spreads across the available data disks instead of
  depending on one: scratch volumes designated per node (v100ts /data +
  v100bts /data2 primary, v100bts /data secondary), with final locked
  checkpoints uploaded R2-canonically as runs complete (project workflow
  rule: workers stage immutable inputs from r2://ecophys/ and upload
  manifests/results afterward; ops line 186 requires retention until paper
  acceptance, which R2 satisfies) and the frozen disk-pressure rule
  (intermediates deleted first, only the 10-seed T4 drift subset retains
  30-min checkpoints) enforced locally. Peak local working set under this
  flow is in-flight scratch + active corpora + the T4 subset, well inside
  the 70G+82G+153G spread.
  (c) Physics bulk on any volume is NOT touched: the 2026-09-19 stand-down
  (pi_bulk_icloud_no_action_20260919) remains in force; this directive adds
  no authority to move or delete other projects' data, and no single-volume
  40% target is pursued on v100ts because reaching it would require exactly
  such movement.
  (d) If the PI instead prefers a fresh attached volume for v100ts (zero
  data movement, designation-only compliance), that is a console action on
  the PI side; this record does not assume it.
