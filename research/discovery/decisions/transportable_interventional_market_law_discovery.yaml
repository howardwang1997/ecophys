reopen_conditions:
  - Create a new descendant restricted to a finite or otherwise verifiable market-native model class; do not reopen this generic source-code formulation.
  - Prove a necessary-and-sufficient priority-and-clock criterion that is formally not a controlled SMDP homomorphism, causal abstraction, or transportability specialization.
  - Give polynomial law and separation certificates plus matching market-specific information upper and lower bounds, including nontrivial law coverage rather than validity by always abstaining.
  - Use two independent engines with native compatible physical clocks, action semantics, and isolated RNG namespaces, plus a qualified prospective real bridge.
  - Pass a fresh outcome-blind novelty and hostile-T0 audit with a conservative lower bound at or above fifteen percent.
