rationale: >-
  The generic law-or-witness theorem decomposes into established causal abstraction,
  transportability, confidence-set inversion, selective inference, Markov concentration,
  adaptive change-of-measure, rank, and probabilistic-bisimulation modules. Direct 2024--2026
  work also occupies interventional simulator surrogates, finite-sample causal representation,
  transportable causal bandits, adaptive fidelity certification, and selective intervention
  coverage. Independently, ABIDES and PAMS fail the strict same-estimand contract because
  their physical-clock domains differ and PAMS couples intervention presence to scheduler RNG
  consumption. No real bridge passed the state, intervention, identification, prospective,
  and publication-rights contract. The frozen generic formulation is therefore closed.
