schema_version: pi-reexploration-d1-authorization-v1
decision_id: pi_reexploration_d1_authorization_20260906
decision_kind: pi_blanket_authorization_of_pre_d0_decision_list
decided_at: "2026-09-06T00:00:00Z"
authorized_by: PI
authorization_channel: interactive_chat
authorization_text: >-
  PI (2026-09-06, Chinese): "全部授权" — blanket authorization of all ten PI decision items in
  papers/proposal/ecomd_reexploration_experiment_plan_2026-09-06.md section 11, presented to the
  PI in the Session-4 summary with items 1-3 flagged as decisive.
status: active
parent_decision: pi_topic_reexploration_directive_20260906
stage_at_decision: D_minus_2_complete_merge_gate_recorded
authorized_decisions:
  - id: D1_01_corpus_contract_F_exec
    content: >-
      Freeze F_exec (execution payloads + allocation_draw + pre/post BBO prices) as the through-M
      training corpus contract. Under F_full or F_exec+orders the mechanism fibers collapse
      toward points and T1-T3 lose their engine-grounded form.
  - id: D1_02_fiber_resampler
    content: >-
      Build the dual-hash-validated fiber resampler (without-replacement interleaving
      regeneration holding the aggregate tape fixed; acceptance = identical
      aggregate_state_hash sequence with differing state_hash) plus conformance tests BEFORE D0.
      Load-bearing for KT-A3, KT-M1 and the merged hostile-T0 lower bound (without it the merged
      lower bound is ~0.10 < 0.15 activation floor).
  - id: D1_03_fixture_enrichment
    content: >-
      Authorize lab-asset-v3 fixture enrichment as a schema-EXTENSION before D0: multi-order
      rationed touched levels and clock-straddling never-drawn orders. Constraint: the frozen
      a2_exit_20260905 bundle (manifest fea8a136...9581c) is NEVER mutated; enrichment lives in
      a new directory with its own manifest referencing the base bundle as parent. Current
      21-22-event fixtures cannot measure O-C, O-D or the S1a random-unit gates.
  - id: D1_04_two_stage_amendment
    content: >-
      Approve the two-stage amendment to contract v1 (recorded as C16 items 11-12): Stage 1
      confirmatory = blocks B1 (L1 x lab-asset) + B3 (L2 x lab-asset), 30 seeds; Stage 2
      conditional robustness = B2/B4 synthetic at preregistered first-15-seed subsets,
      directional robustness only, mechanical triggers only (never outcome-triggered).
  - id: D1_05_stage2_synthetic_members
    content: >-
      Confirm Stage-2 synthetic members: variant A garch_student_t5 (both lineages), variant B
      multiscale_logvol (L2-only), negative_jump_iid named-but-not-run; frozen series-to-request
      wrapper into the same engine (conservation/replay semantics preserved).
  - id: D1_06_k_variance_preflight
    content: >-
      Authorize the DGP-only, zero-GPU variance preflight to fix K within {4,8,16} before D0
      (immutable after), default K=8. Scope bound: CPU-only execution of the DGP engine and
      request-generation machinery for instrument calibration; no trained models, no cell
      endpoints, no outcome access, no market data.
  - id: D1_07_estimator_menu
    content: >-
      Confirm the through-M estimator menu: straight-through (pinned scale) primary and
      perturb-and-MAP (pinned noise) as the KT-A4 audit estimator, with the two-estimator retrain
      of the audit cell inside the compute envelope [AUTH at D0].
  - id: D1_08_d0_calendar_and_prereg_panel
    content: >-
      Adopt the reference calendar: theorem work complete ~2026-09-12, D0 outcome-blind freeze
      ~2026-09-19 (D0 to be confirmed at the prereg review), with an adversarial 3-reviewer panel
      pass on the preregistration text before freeze.
  - id: D1_09_node_cleanup_at_d0
    content: >-
      Authorize node cleanup op-session 1 AT D0: relocate the paper D deployment archive to
      r2://ecophys/paper_d_archive/ with manifest verification, target >= 40% free on both
      98%/96%-full V100 nodes. Execution scheduled at D0-S1; no GPU training before freeze.
  - id: D1_10_seed_namespaces
    content: >-
      Adopt seed namespaces 11000-11029 (L1) / 12000-12029 (L2), avoiding Paper D namespaces.
explicit_bounds:
  - >-
    This blanket authorization covers the ten pre-D0 planning/build/calibration decisions listed
    above. It does NOT waive the D0 outcome-blind freeze: GPU training, confirmatory simulation
    execution (Stage-1/Stage-2 cells), market-data access/purchase and the two-estimator audit
    retrain remain gated on D0 freeze plus their own explicit authorization steps ([AUTH] items
    in the experiment plan).
  - >-
    CPU-only execution authorized under this decision is strictly: the lab-asset-v3 engine and
    its schema-extension fixture generation (D1_03), the fiber-resampler conformance runs
    (D1_02), and the DGP-only K-variance preflight (D1_06). No GPU. No market data. No trained
    models. No outcome inspection.
  - verification_liquidity holdout stays sealed until 2026-10-17 UTC.
  - Paper D remains terminal; no manuscript changes.
  - No topic-card creation or route activation; the full activation gate still applies at D-1
    exit.
forbidden_actions:
  - Any GPU allocation for any purpose before D0 freeze.
  - Any confirmatory endpoint measurement, analyzer run, or outcome inspection before D0 freeze
    and both-worker completion.
  - Any mutation of the frozen a2_exit_20260905 bundle, schema_spec.json, or its manifest.
  - Any new confirmatory proposition after D0 freeze (post-freeze theory edits limited to
    finite-instance corollaries, constants polishing, enumeration vs preregistered targets).
stop_rules:
  - Inherited from the experiment plan section 12 risk register (22 items) without weakening;
    notably engine-law mismatch, S1a structure-lemma falsification and corpus-contract reversal
    are STOP-class.
  - If any [NOW] theorem item (KT-G1 R2 lemma, KT-G2 separation lemma) is REFUTED rather than
    proven, the corresponding REFRAME rule in the risk register fires and the PI is informed
    before any freeze.
effective_until: d0_freeze_or_pi_revocation
addenda:
  - addendum_id: D1_ADD_session1_followup_20260906
    decided_at: "2026-09-06T00:00:00Z"
    decided_by: PI
    authorization_channel: interactive_chat
    authorization_text: >-
      PI (2026-09-06, Chinese): "用需要算力多的那个，批准，确认，确认" — answering the four
      D0-freeze decision items surfaced by the D-1 execution session (session record
      papers/proposal/ecomd_reexploration_d1_session1_record_2026-09-06.md section 6).
    rulings:
      - id: D1_11_K_freeze_16
        item: K = 16 vs K = 8 (K-preflight conservative rule output none_in_set -> 16 vs the
          functional-statistic reading that clears K = 8)
        ruling: >-
          "用需要算力多的那个" — K = 16 FROZEN. Accepts ~+15% Stage-1 evaluation V100-h. Contract
          C2 amended (K = 16, k = 1..16) with C16 ledger item (11); gates G8/G10 updated to 16
          draw-records. K adjustment window CLOSED; K immutable through D0 and after.
        scope_note: >-
          alloc_proprata_dev_mean stays draw-dominated at every authorized K (0.196 at K=16) and
          carries an explicit draw-noise caveat in all reporting (contract C2(e)).
      - id: D1_12_resampler_criterion_ii_ratified
        item: fiber-resampler criterion-(ii) semantics (native-RNG-state-preservation vs literal
          raw-hash reading)
        ruling: >-
          "批准" — native-RNG-state-preservation semantics RATIFIED: criterion (ii) counts a
          resample as accepted only when the state_hash chain differs via an allocation-
          trajectory difference (native RNG-state accounting makes state-chain equality coincide
          with allocation-trajectory equality). The literal raw-hash reading (which would count
          rng-state-only differences as variation, making fifo/single-order pools trivially
          accepted and destroying the KT-A3 control) is REJECTED. The frozen prereg statement in
          scripts/lab_asset/fiber_resampler.py (sha256 703ca36e...2c4b) stands as written; no
          code change required.
      - id: D1_13_l2_build_scope_confirmed
        item: >-
          L2 build scope (~90% is a D0-window build: the recurrent fact-surrogate model
          itself, training loop, checkpoint format, seeding surface)
        ruling: >-
          "确认" — L2 build scope CONFIRMED as a pre-D0 build item so the D0 freeze is not a
          paper promise without an instrument. Build is CODE-ONLY under the existing CPU bounds:
          model architecture + training-loop hookup + checkpoint format (torch.load CPU-
          compatible) + seeding surface (RNG-tree namespaced), validated by CPU smoke (forward
          pass and a single synthetic-batch gradient step, no checkpoints persisted for reuse).
          Actual GPU training of L2 cells remains D0-gated exactly as in explicit_bounds.
      - id: D1_14_c3_kernel_sentence_tightened
        item: contract C3 kernel-sentence tightening (pro_rata is not an engine kernel)
        ruling: >-
          "确认" — C3 TIGHTENED: the engine kernel set is exactly {fifo, random_unit_within_price}
          (scripts/lab_asset/schema.py:22-24); pro_rata exists only as S3 exact-arithmetic in
          theorem/audit calculations and never executes in any cell. Contract text, gate G8, and
          C16 ledger item (12) updated accordingly.
    bounds_note: >-
      All rulings inherit this decision's explicit_bounds and forbidden_actions unchanged. The
      K=16 and C3 amendments are contract-text amendments executed BEFORE the D0 outcome-blind
      freeze (the contract is a D-1 candidate until freeze); no GPU, no confirmatory execution,
      no market data, no trained models result from this addendum.
  - addendum_id: D1_ADD_annexb_ratification_20260907
    decided_at: "2026-09-07T00:00:00Z"
    decided_by: PI
    authorization_channel: interactive_chat
    authorization_text: >-
      PI (2026-09-07, Chinese): "批准，然后继续改文章" — the first token ratifies the prereg v2
      Annex B convention constants (the only PI-pending item of the five freeze contingencies);
      the second directs continued paper-manuscript work (see session ledger 2026-09-07).
    rulings:
      - id: D1_15_annex_b_constants_ratified
        item: prereg v2 Annex B convention constants (the eight pinned analyst-choosable
          degrees of freedom)
        ruling: >-
          "批准" — RATIFIED as proposed in papers/proposal/ecomd_reexploration_prereg_v2_2026-09-06.md
          Annex B, including: S3 robustness-arm seeds 20260974/20260975/20260976; bootstrap seed
          derivation = sha256 over frozen (block, family) strings mod 2^63; G9 determinism-replay
          stride; reflexive + telemetry 10-seed subsets 11000-11009 / 12000-12009; and the
          remaining Annex B items as pinned in v2 (incl. B(e) s_ch branch and B(h) KT-A1 P1/P2/P3
          decision rule). prereg v2 is thereby THE freeze candidate; the only remaining pre-freeze
          items are the E-2 preflight re-run against the actual D0 corpus generator (caveat-only)
          and the freeze-mechanics execution on 2026-09-19.
      - id: D1_16_manuscript_directive
        item: continue paper-manuscript work pre-D0
        ruling: >-
          "继续改文章" — manuscript drafting for the merged GAMMA-led paper is directed and remains
          within the screening-stage paper-work bounds: theory sections (statements + proofs from
          the D-1 lemma writeups), related work (D-2 evidence-map adjudication only), and the
          preregistered-design method section may be drafted BEFORE D0; NO empirical-result
          sentences, NO outcome access, NO Paper D changes (Paper D stays terminal). Status labels
          (proven / proven_with_conditions / conjecture) carry over verbatim from prereg v2.
    bounds_note: >-
      Inherits explicit_bounds and forbidden_actions unchanged. Manuscript work adds no compute
      authorization: text/LaTeX only; the Mac heavy-compute ban (2026-09-06) applies to any
      workflow agents involved.
