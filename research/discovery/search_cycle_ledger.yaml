    notes: >-
      Cycle 16 returned to the core simulated-market problem and froze one F3 subject before its
      full audit. No exact primary work was found that uses a predeclared simulator-interventional
      score to predict multiple unseen real market-rule responses, but the formulation still failed.
      Synthetic intervention consistency does not identify off-support field adaptation; two rule
      changes create only two independent policy environments; learned and structural simulators do
      not share a frozen action language; and the TSE, CME, SEC and pause assets do not close one
      assignment, state, licence and same-estimand contract. The 10-percent full-T0 forecast resolved
      false with Brier 0.0100. Two all-negative full-T0 resolutions remain insufficient to
      recalibrate the provisional 15-percent active-status brake. No simulation, outcome access,
      data action, sandbox, outreach, EcoMD edit, purchase, or compute was authorized.
