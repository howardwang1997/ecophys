schema_version: ecophys-theory-graph/v1
as_of: "2026-08-14"
iteration: economic-world-model-lucas-test-v14
decision: V14_SCOUT_NO_DATA_UNLOCK

nodes:
  - id: src.controlled_world_models
    type: source
    title: On the Identifiability of Controlled World Models
    track: nmi
    claim: Joint latent-state and controlled-transition identification needs spectral separation and conditional action excitation; weak excitation amplifies counterfactual error.
    url: https://arxiv.org/abs/2607.22430
    primary: true
    evidence_level: preprint
  - id: src.policy_interventions
    type: source
    title: Causal Modeling of Policy Interventions From Sequences of Treatments and Outcomes
    track: shared
    claim: Sequential policy counterfactuals factorize under consistency, positivity, no unmeasured confounding and full mediation through actions.
    url: https://proceedings.mlr.press/v202/hizli23a.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.soft_intervention_crl
    type: source
    title: Causal Representation Learning from Multiple Distributions
    track: nmi
    claim: Multiple soft interventions identify latent causal structure up to a stated equivalence class and permit unseen combinatorial-intervention sampling under assumptions.
    url: https://arxiv.org/abs/2307.06250
    primary: true
    evidence_level: preprint
  - id: src.score_crl
    type: source
    title: Score-based Causal Representation Learning
    track: nmi
    claim: Pairs of sufficiently discrepant interventions can identify latent variables and causal graphs under stated transformation and regularity assumptions.
    url: https://www.jmlr.org/papers/v26/24-0194.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.psr
    type: source
    title: Predictive State Representations
    track: nmi
    claim: Action-conditional predictions can form a sufficient predictive state without recovering a hidden ontological state.
    url: https://proceedings.neurips.cc/paper_files/paper/2001/hash/1e4d36177d71bbb3558e43af9577d70e-Abstract.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.cross_mdp_bisimulation
    type: source
    title: Generalized Bisimulation Metrics for Cross-MDP Transfer
    track: nmi
    claim: Cross-MDP state aggregation and policy transfer can be controlled by a generalized bisimulation metric.
    url: https://proceedings.neurips.cc/paper_files/paper/2025/hash/458567910b6d21f438f22aa20c036723-Abstract-Conference.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.effect_invariance
    type: source
    title: Effect-Invariant Mechanisms for Policy Generalization
    track: nmi
    claim: Effect-invariance is sufficient for zero-shot policy generalization under explicit environment assumptions.
    url: https://www.jmlr.org/papers/v25/23-0802.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.causal_abstraction
    type: source
    title: Causal Abstraction with Arbitrary Mechanism Transformations
    track: nmi
    claim: Causal abstraction and intervention faithfulness formalize valid transformations between mechanisms at different levels.
    url: https://www.jmlr.org/papers/v26/23-0058.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.invariant_block_mdp
    type: source
    title: Invariant Causal Prediction for Block MDPs
    track: nmi
    claim: Environment interventions can identify invariant state abstractions and yield model and generalization bounds under block-MDP assumptions.
    url: https://arxiv.org/abs/2003.06016
    primary: true
    evidence_level: preprint
  - id: src.howm
    type: source
    title: Toward Compositional Generalization in Object-Oriented World Modeling
    track: nmi
    claim: MDP homomorphism and equivariance support lifting and compositional generalization to unseen object combinations.
    url: https://proceedings.mlr.press/v162/zhao22b.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.dsge_world_model
    type: source
    title: DSGE Models are Structured World Models
    track: shared
    claim: Structural factorization can re-compose under policy change whereas a reduced-form single-regime learner is unconstrained off path.
    url: https://arxiv.org/abs/2607.03144
    primary: true
    evidence_level: preprint
  - id: src.markov_response
    type: source
    title: Markovian Perturbation, Response and Fluctuation Dissipation Theorem
    track: shared
    claim: General Markov linear response depends on the perturbation family, with response formulas and equilibrium identities.
    url: https://arxiv.org/abs/0710.4394
    primary: true
    evidence_level: peer_reviewed
  - id: src.two_timescale_markov
    type: source
    title: Singularly Perturbed Markov Chains and Two-Time-Scale Reductions
    track: shared
    claim: Averaged generators and asymptotic expansions describe fast-slow Markov systems under singular perturbation.
    url: https://epubs.siam.org/doi/10.1137/S003613990139756X
    primary: true
    evidence_level: peer_reviewed
  - id: src.stochastic_pump
    type: source
    title: Unified Geometric Theory of Mesoscopic Stochastic Pumps
    track: shared
    claim: Cyclic parameter changes in memoryless stochastic kinetics can produce order- and path-dependent geometric responses.
    url: https://arxiv.org/abs/0705.2057
    primary: true
    evidence_level: peer_reviewed
  - id: src.interventional_lti
    type: source
    title: An Interventional Perspective on Identifiability in Gaussian LTI Systems
    track: nmi
    claim: Diverse multi-environment intervention signals can identify Gaussian LTI system parameters under diversity assumptions.
    url: https://proceedings.mlr.press/v236/rajendran24a.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.switching_dynamics_identifiability
    type: source
    title: On the Identifiability of Switching Dynamical Systems
    track: nmi
    claim: Switching dynamical systems admit latent and nonlinear-map identifiability up to affine transformations under explicit temporal and distributional assumptions.
    url: https://proceedings.mlr.press/v235/balsells-rodas24a.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.active_intervention_design
    type: source
    title: Active Learning for Optimal Intervention Design in Causal Models
    track: nmi
    claim: Bayesian causal acquisition functions, information-theoretic bounds and consistency results already support sequential intervention design.
    url: https://www.nature.com/articles/s42256-023-00719-0
    primary: true
    evidence_level: peer_reviewed
  - id: src.worldmodel_parameter_identifiability
    type: source
    title: What Can Latent World Models Know
    track: nmi
    claim: Controlled evidence indicates that available inputs and prediction targets govern which physical parameters a latent predictive representation retains.
    url: https://arxiv.org/abs/2607.27017
    primary: true
    evidence_level: preprint
  - id: src.sec_tick_pilot
    type: source
    title: SEC Tick Size Pilot Plan and Market Quality
    track: ncs
    claim: A controlled difference-in-differences study finds heterogeneous spread, depth, volatility and efficiency responses to a tick-size increase.
    url: https://www.sec.gov/about/divisions-offices/division-economic-risk-analysis/staff-papers-analyses/dera_wp_tick_size-market_quality
    primary: true
    evidence_level: regulator_study
  - id: src.tick_pilot_forward_reverse
    type: source
    title: When Does the Tick Size Help or Harm Market Quality
    track: ncs
    claim: Both imposition and conclusion of the US Tick Size Pilot have already been studied with depth-of-book data and heterogeneous spread strata.
    url: https://doi.org/10.1016/j.finmar.2025.101024
    primary: true
    evidence_level: peer_reviewed
  - id: src.economic_world_models
    type: source
    title: From Economic Agents to Agentic Economies
    track: shared
    claim: The economic-world-model blueprint motivates executable multiscale environments but does not itself establish an identifiability theorem or validated intervention mechanism.
    url: https://arxiv.org/abs/2608.06020
    primary: true
    evidence_level: preprint
  - id: src.masked_prediction_identifiability
    type: source
    title: Masked Prediction A Parameter Identifiability View
    track: nmi
    claim: Identifiability depends on the prediction target; pairwise HMM tasks and matrix powers can fail while a two-token tensor target identifies under stated assumptions.
    url: https://proceedings.neurips.cc/paper_files/paper/2022/hash/85dd09d356ca561169b2c03e43cf305e-Abstract-Conference.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.causal_states
    type: source
    title: Computational Mechanics Pattern and Prediction Structure and Simplicity
    track: nmi
    claim: Equality of future laws defines causal states, which form a unique minimal predictive representation.
    url: https://csc.ucdavis.edu/~cmg/compmech/pubs/cmppss.htm
    primary: true
    evidence_level: peer_reviewed
  - id: src.blackwell_experiments
    type: source
    title: Equivalent Comparisons of Experiments
    track: nmi
    claim: Universal informativeness of experiments is characterized by attainable decision performance and randomization or garbling.
    url: https://projecteuclid.org/journals/annals-of-mathematical-statistics/volume-24/issue-2/Equivalent-Comparisons-of-Experiments/10.1214/aoms/1177729032.full
    primary: true
    evidence_level: peer_reviewed
  - id: src.markov_perturbation_sensitivity
    type: source
    title: Sensitivity and Convergence of Uniformly Ergodic Markov Chains
    track: ncs
    claim: Iterated ergodicity coefficients bound finite-time transition perturbations and invariant-law sensitivity in uniformly ergodic chains.
    url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/26A9854BCB8D103B3A63A9B272616EC0/S0021900200001066a.pdf/sensitivity_and_convergence_of_uniformly_ergodic_markov_chains.pdf
    primary: true
    evidence_level: peer_reviewed
  - id: src.mixing_contraction_estimation
    type: source
    title: Mixing Time Estimation with Contraction Methods
    track: ncs
    claim: Generalized Dobrushin contraction controls nonreversible mixing and admits data-dependent confidence intervals from one trajectory.
    url: https://proceedings.mlr.press/v117/wolfer20a.html
    primary: true
    evidence_level: peer_reviewed
  - id: src.dynamic_event_studies
    type: source
    title: Revisiting Event-Study Designs
    track: ncs
    claim: Dynamic treatment effects by horizon require explicit estimands, no anticipation, parallel trends and robust handling of heterogeneous effects.
    url: https://academic.oup.com/restud/article/91/6/3253/7601390
    primary: true
    evidence_level: peer_reviewed
  - id: src.synthetic_control_guidance
    type: source
    title: Using Synthetic Controls Feasibility Data Requirements and Methodological Aspects
    track: ncs
    claim: Synthetic controls have explicit feasibility and data requirements and can fail without a credible donor design.
    url: https://www.aeaweb.org/articles?id=10.1257/jel.20191450
    primary: true
    evidence_level: peer_reviewed
  - id: src.model_discrepancy
    type: source
    title: Learning about Physical Parameters the Importance of Model Discrepancy
    track: ncs
    claim: Simulator discrepancy confounds calibration and physical parameters and can cause biased overconfident inference without meaningful structural priors.
    url: https://www.tonyohagan.co.uk/academic/pdf/simmach.pdf
    primary: true
    evidence_level: peer_reviewed
  - id: src.equilibrium_causal_twins
    type: source
    title: Equilibrium Causal Digital Twins Validation Transport and Identification Limits
    track: ncs
    claim: Finite experimental validation cannot identify arbitrary equilibrium counterfactuals without query-specific structural assumptions.
    url: https://arxiv.org/abs/2607.21667
    primary: true
    evidence_level: preprint
  - id: src.digital_twin_counterfactual
    type: source
    title: The Digital Twin Counterfactual Framework
    track: ncs
    claim: Twin fidelity is hierarchical and some joint counterfactual claims remain assumption-indexed even after observable-arm validation.
    url: https://arxiv.org/abs/2604.01325
    primary: true
    evidence_level: preprint
  - id: src.nmi_scope
    type: source
    title: Nature Machine Intelligence aims and scope
    track: nmi
    claim: NMI covers broadly transferable AI, machine learning, reinforcement learning and multi-agent methods.
    url: https://www.nature.com/natmachintell/submission-guidelines/about/aims
    primary: true
    evidence_level: official_venue
  - id: src.ncs_scope
    type: source
    title: Nature Computational Science aims and scope
    track: ncs
    claim: NCS covers fundamental computational methods and computational social science with substantive scientific insight.
    url: https://www.nature.com/natcomputsci/natcomputsci/natcomputsci/about/aims
    primary: true
    evidence_level: official_venue

  - id: kr.structural_policy_transport
    type: known_result
    title: Structural policy transport under modularity and overlap
    track: shared
    claim: Exact structural transitions can be replayed under a new policy or mechanism only when structural invariance and the relevant causal support assumptions hold.
  - id: kr.interventional_identifiability
    type: known_result
    title: Intervention diversity yields latent identifiability
    track: nmi
    claim: Multiple sufficiently diverse interventions can repair latent or transition non-identifiability through standard excitation, score or causal-representation conditions.
  - id: kr.predictive_equivalence
    type: known_result
    title: Predictive state and bisimulation equivalence
    track: nmi
    claim: A minimal intervention-relevant observable state is generally a predictive equivalence class rather than a uniquely identified hidden state.
  - id: kr.compositional_transport
    type: known_result
    title: Compositional intervention and world-model transport
    track: nmi
    claim: Intervention composition and structured world-model lifting are already supported by causal factorization, homomorphism and invariance results.
  - id: kr.fast_slow_response
    type: known_result
    title: Fast-slow averaging and perturbation response
    track: shared
    claim: Duhamel expansions, Markov response and singular perturbation already decompose fast and slow responses with approximation remainders.
  - id: kr.order_effect_without_adaptation
    type: known_result
    title: Order effects do not identify adaptation
    track: shared
    claim: Noncommuting frozen Markov operators or stochastic-pump geometric phases can create nonzero order effects without learned or adaptive behavior.
  - id: kr.event_layer_information_conservation
    type: known_result
    title: Event-layer mechanism information conservation
    track: both
    claim: If the next fast state is generated by a known mechanism whose residual noise is conditionally independent of the adaptive state, then it contains zero additional information about that state after conditioning on the observed mechanism inputs.
  - id: kr.markov_relaxation_envelope
    type: known_result
    title: Frozen Markov relaxation envelope
    track: ncs
    claim: After a mechanism returns to baseline, a frozen Markov model with Dobrushin contraction coefficient below one bounds every bounded-observable residual by a geometrically decaying envelope.
  - id: kr.target_task_identifiability
    type: known_result
    title: Prediction-target-dependent parameter identifiability
    track: nmi
    claim: Optimal prediction tasks induce parameter equivalence classes; changing target algebra or a task family can refine the class from nonidentifying to identifying under model assumptions.
  - id: kr.target_partition_refinement
    type: known_result
    title: Task-family partition refinement
    track: nmi
    claim: The equivalence relation induced by a union of prediction tasks is the intersection of the individual task-equivalence relations.
  - id: kr.blackwell_target_order
    type: known_result
    title: Blackwell order of target experiments
    track: nmi
    claim: Universal usefulness of one observed experiment or target over another is an established comparison by decision performance or garbling.
  - id: kr.dynamic_treatment_response
    type: known_result
    title: Dynamic causal response by event horizon
    track: ncs
    claim: Event studies already target treatment responses by horizon under explicit no-anticipation, parallel-trend and control assumptions.
  - id: kr.model_class_rejection
    type: known_result
    title: Model-class rejection does not label the omitted mechanism
    track: ncs
    claim: A response outside a validated simulator or mixing envelope rejects the declared class but cannot distinguish adaptation from fixed hidden state or discrepancy without structural restrictions.
  - id: kr.digital_twin_identification_limits
    type: known_result
    title: Finite digital-twin validation has query-specific identification limits
    track: ncs
    claim: Agreement over a finite validation design does not generally identify an untested counterfactual; structural assumptions or partial identification remain necessary.
  - id: kr.invgrad_g0_fail
    type: known_result
    title: Plan v4 invariant-gradient G0 failure
    track: ncs
    claim: The earlier invariant-gradient construction is a composition of mapped prior art and cannot be revived by renaming.
  - id: kr.entropy_tur_g0_fail
    type: known_result
    title: Entropy and TUR observability failure
    track: ncs
    claim: Anonymous partial L2 cannot identify total entropy production and the proposed entropy/TUR route is closed.

  - id: concept.exact_mechanism
    type: concept
    title: Exact or audited fast mechanism
    track: both
    claim: Exchange or environment transition rules are separated from learned behavior and carry explicit uncertainty when not exact.
  - id: concept.adaptive_predictive_state
    type: concept
    title: Adaptive predictive state
    track: both
    claim: The target is the smallest state sufficient for future observable behavior under a declared intervention family, not beliefs or identity.
  - id: concept.closed_intervention_loop
    type: concept
    title: Closed intervention loop and observable holonomy
    track: ncs
    claim: A forward-and-reverse mechanism sequence can test path dependence only after frozen dynamics, relaxation and confounding are controlled.
  - id: concept.target_conditioned_identifiability
    type: concept
    title: Prediction-target-conditioned identifiability
    track: nmi
    claim: Future NMI exploration should ask which adaptive quantities a declared prediction target can force a world model to retain, rather than assume all physical or behavioral state is learned.

  - id: cand.s1.action_lift
    type: candidate
    title: Action lift across singular mechanism changes
    track: nmi
    claim: Counterfactual action paths might remain transportable even when post-mechanism state-path measures are singular.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered as an action-space alternative to state-density-ratio transport.
        evidence: [concept.exact_mechanism]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Compared with sequential g-formula, structural re-composition and controlled-world-model support conditions.
        evidence: [src.policy_interventions, src.dsge_world_model, src.controlled_world_models]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_PRIOR_ART
        reason: Exact action replay is structural g-computation; singular state support does not remove policy invariance, state coverage or confounding requirements.
        evidence: [kr.structural_policy_transport, ce.action_lift_off_support]
  - id: cand.s2.single_environment_adaptation
    type: candidate
    title: Single-environment adaptive-response impossibility
    track: nmi
    claim: Pre-intervention observations from one environment do not identify arbitrary post-intervention adaptation.
    status: RETIRED_IDENTIFIABILITY
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered as a possible lower-bound theorem.
        evidence: [concept.adaptive_predictive_state]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Constructed observationally equivalent latent-update models and audited intervention-identifiability results.
        evidence: [src.score_crl, src.interventional_lti]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_IDENTIFIABILITY
        reason: The impossibility is a generic latent-state and intervention-support failure unless paired with a genuinely new constructive boundary.
        evidence: [kr.interventional_identifiability, ce.single_environment_equivalence]
  - id: cand.s3.fast_slow_decomposition
    type: candidate
    title: Fast-slow intervention response decomposition
    track: both
    claim: Immediate mechanical and delayed adaptive response might admit a controlled finite-timescale decomposition.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered from the multiscale Economic World Model architecture.
        evidence: [src.economic_world_models]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Reduced the proposed split to Markov perturbation and singular averaging forms.
        evidence: [src.markov_response, src.two_timescale_markov]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_PRIOR_ART
        reason: The decomposition is not new without a stronger remainder, weaker assumptions or a nonstandard observable identity.
        evidence: [kr.fast_slow_response, ce.standard_response_reduction]
  - id: cand.s4.predictive_quotient
    type: candidate
    title: Mechanism-conditioned predictive quotient
    track: nmi
    claim: A minimal observable state might suffice for arbitrary mechanism sequences without identifying agent beliefs.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered to respect anonymous-L2 non-identifiability.
        evidence: [concept.adaptive_predictive_state]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Compared with PSR, bisimulation, invariant block-MDP and causal-abstraction definitions.
        evidence: [src.psr, src.cross_mdp_bisimulation, src.invariant_block_mdp]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_PRIOR_ART
        reason: The quotient is a standard predictive or bisimulation equivalence unless a new intervention family changes the equivalence relation nontrivially.
        evidence: [kr.predictive_equivalence, ce.predictive_state_relabeling]
  - id: cand.s5.intervention_composition
    type: candidate
    title: Composition of unseen mechanism interventions
    track: nmi
    claim: Learned responses might compose across unseen combinations and sequences of exact rule changes.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered as a transferable world-model theorem candidate.
        evidence: [src.economic_world_models]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Audited soft-intervention composition, MDP homomorphism, effect invariance and structural re-composition.
        evidence: [src.soft_intervention_crl, src.howm, src.effect_invariance, src.dsge_world_model]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_PRIOR_ART
        reason: Composition alone is occupied; novelty would require a new adaptive-sequence obstruction or bound not present in these frameworks.
        evidence: [kr.compositional_transport, ce.composition_specialization]
  - id: cand.nmi.mechanism_excitation
    type: candidate
    title: Known-mechanism excitation margin for adaptive predictive state
    track: nmi
    claim: A family of known mechanism maps may create enough independent excitation to identify an adaptive predictive state that is non-identifiable in any single environment.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Created after retiring the generic single-environment impossibility candidate.
        evidence: [cand.s2.single_environment_adaptation, concept.exact_mechanism]
      - date: "2026-08-12"
        from: SCOUT
        to: FORMALIZING
        reason: Proposed a stacked mechanism-sensitive information or observability margin and a two-model witness.
        evidence: [po.mechanism_excitation_margin, ce.stacked_rank_is_generic]
      - date: "2026-08-12"
        from: FORMALIZING
        to: ATTACKING
        reason: Closest results already use conditional action excitation, intervention diversity and multi-environment system identification; non-equivalence remains unproved.
        evidence: [src.controlled_world_models, src.score_crl, src.interventional_lti]
      - date: "2026-08-12"
        from: ATTACKING
        to: ATTACKING
        reason: Experiment 144 confirmed that the simplest complementary-mechanism rank witness is exactly an ordinary stacked observability Gramian.
        evidence: [bench.exp144_negative_controls, ce.stacked_rank_is_generic]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_PRIOR_ART
        reason: Switching-system identifiability and active intervention design cover the remaining future-feedback route, while the exact fast mechanism contributes no same-event latent information conditional on its observed inputs.
        evidence: [src.switching_dynamics_identifiability, src.active_intervention_design, kr.event_layer_information_conservation]
  - id: cand.ncs.adaptation_holonomy
    type: candidate
    title: Relaxation-exceedance response after a closed mechanism loop
    track: ncs
    claim: A real response that remains outside every prospectively validated frozen-mechanism relaxation envelope may reveal persistent adaptive or omitted state under explicit controls and independent replication.
    status: RETIRED_IDENTIFIABILITY
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Created as an order-sensitive empirical mechanism rather than a generic fast-slow decomposition.
        evidence: [concept.closed_intervention_loop]
      - date: "2026-08-12"
        from: SCOUT
        to: FORMALIZING
        reason: Defined observed loop response minus frozen-behavior exact-mechanism response.
        evidence: [po.closed_loop_identification]
      - date: "2026-08-12"
        from: FORMALIZING
        to: ATTACKING
        reason: Noncommuting frozen dynamics and stochastic pumps defeat the naive certificate, while the Tick Size Pilot forward/reverse setting is already empirically occupied.
        evidence: [kr.order_effect_without_adaptation, src.tick_pilot_forward_reverse, ce.frozen_noncommuting_order]
      - date: "2026-08-12"
        from: ATTACKING
        to: ATTACKING
        reason: Experiment 144 verified a nonzero 0.075 swapped-order response from fixed row-stochastic operators with no adaptive state.
        evidence: [bench.exp144_negative_controls, ce.frozen_noncommuting_order]
      - date: "2026-08-12"
        from: ATTACKING
        to: ATTACKING
        reason: Narrowed the candidate from raw order effects to residual persistence beyond a frozen Markov contraction envelope; attribution still requires real controls and replication.
        evidence: [kr.markov_relaxation_envelope, po.closed_loop_identification]
      - date: "2026-08-12"
        from: ATTACKING
        to: RETIRED_IDENTIFIABILITY
        reason: Experiment 145 proved fixed hidden-state exceedance and arbitrary finite-path reproduction without adaptation; standard event-study and digital-twin discrepancy results leave the mechanism label unidentified, and registry v2 found no sealed replication.
        evidence: [bench.exp145_relaxation_negative_controls, kr.model_class_rejection, data.intervention_registry_v2]

  - id: cand.nmi.v2_target_completeness
    type: candidate
    title: Prediction-target completeness for adaptive parameters
    track: nmi
    claim: A declared future target family might force a predictive representation to retain an adaptive parameter omitted by easier targets.
    status: RETIRED_PRIOR_ART
    history:
      - date: "2026-08-12"
        to: SCOUT
        reason: Entered as v2 target-conditioned-identifiability primitive T1.
        evidence: [concept.target_conditioned_identifiability]
      - date: "2026-08-12"
        from: SCOUT
        to: ATTACKING
        reason: Compared directly with masked-prediction parameter identifiability and minimal predictive states.
        evidence: [src.masked_prediction_identifiability, src.causal_states]
      - date: "2026-08-12"
        from: ATTACKING
