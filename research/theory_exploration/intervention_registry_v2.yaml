  - id: nyse_floor_closure_2020
    rule: Temporary closure of the NYSE physical trading floor
    jurisdiction: United States
    venue: New York Stock Exchange
    mechanism_family: floor removal and all-electronic auction operation
    dates:
      announcement: {status: exact, date: "2020-03-21", source_ids: [sec_floor_closure]}
      implementation: {status: exact, date: "2020-03-23", source_ids: [sec_floor_closure]}
      end_or_reversal: {status: unresolved, date: null, note: Reopening was phased rather than a single restoration of the pre-closure mechanism., source_ids: [sec_floor_update]}
      transition: {status: not_single_date, date: null, note: Partial floor and DMM returns occurred in phases alongside temporary rule changes., source_ids: [sec_floor_update]}
    design:
      description: Abrupt shift to electronic auctions with other venues as nominal controls.
      treatment: NYSE floor-dependent functions and affected listed securities.
      control: Other venues remained subject to the same pandemic and extraordinary volatility.
      published_analysis: true
      independence: COVID-19 and multiple emergency market rules coincide exactly with the intervention.
    required_data:
      event_fields: [venue, symbol, timestamp, auction_message, quote, trade, dmm_participation, floor_status]
      depth: Auction imbalance feeds, full depth and cross-venue state.
      clock_precision: Native exchange sequence and nanosecond timestamps.
      identifiers: Listing venue, auction type, DMM assignment, floor status and rule version.
    access:
      public: Closure and rule documents are public.
      vendor: Auction and full-depth histories require licensed exchange products.
      licence: NYSE feed redistribution and research rights require review.
      records_opened: false
    risks: [COVID-19, extreme volatility, circuit breakers, emergency fiscal and monetary policy, phased reopening, concurrent auction-rule changes]
    role: reject
    rationale: The pandemic shock and bundled market changes dominate identification.
    sources:
      - id: sec_floor_closure
        url: https://www.sec.gov/newsroom/press-releases/2020-67
        accessed: "2026-08-12"
        primary: true
        supports: Announcement, closure date and temporary auction modifications.
      - id: sec_floor_update
        url: https://www.sec.gov/newsroom/speeches-statements/update-commissions-targeted-regulatory-relief-assist-market-participants-affected-covid-19
        accessed: "2026-08-12"
        primary: true
        supports: Phased reopening and expiration of temporary rules.
