  parent_model: Kaniel-Liu 2006 finite-date continuous-price equilibrium characterization.
  off_path_basis: Maintained continuous quote-updater and published characterization, not an independent extensive-form proof.
  prior: Symmetric centered density on [-1,1] for identities; uniform for the family exclusion and exact points.
  estimand: Aggregate gross informed cash-plus-terminal-inventory profit minus initial endowments.
  trade_size: 1
  fees: 0
  short_sales: allowed
  horizon: First public revelation; pending orders expire and later known-value completion is excluded.
  partition: Separate every arrival and disclosure event.
  M: Public conditional mean after current event, not a quote midpoint.
  T: Last transaction price carried through nontrade events.
  flow: Aggressor-signed executed quantity, distinct from resting inventory.
  no_order_history_retained: true
analytic_assets:
  - id: same_equilibrium_general_gap_decomposition
    status: elementary_accounting_identity
    notation:
      r: max(0,b)
      q: mu*p/2
      w_h: Probability of first history h in MB,MS,LB,LS,NO.
      m_h: Public posterior mean after h.
      x_h_y_h: Competitive continuation ask and bid.
      u_h_d_h: Conditional probabilities v>x_h and v<y_h.
    first_gap: D1=2*(1-mu)*(a*integral_c^1 g(v)dv-q*integral_r^c (v-b)g(v)dv).
    public_mark_gap: C_M-Omega=D1+p*sum_h w_h*G_h.
    G_h: (1-mu)*((x_h-m_h)*u_h+(m_h-y_h)*d_h)>=0.
    price_definition_correction: C_T-C_M=2*p*w_LB*m_LB*(1-mu)*(u_LB-d_LB).
    correction_sign_automatic: false
    transaction_lower_bound_b_nonpositive: C_T-Omega>=D1.
    transaction_lower_bound_b_positive: C_T-Omega>=D1-p*mu*ell*(1-mu)*b*F(b).
    all_cohorts_and_no_order_histories_included: true
  - id: uniform_nonnegative_limit_public_mark_exclusion
    status: elementary_equilibrium_corollary
    scope: Every feasible b>=0 in the uniform-prior published equilibrium characterization, unchanged M and horizon.
    definitions:
      e: 1-c
      d: c-b
    equations:
      - 2*mu*(1-ell)*a=(1-mu)*e*(e+2*q*d)
      - ell=d^2/((1+b)^2+2*mu*b/(1-mu))
      - D1=(1-mu)*(a*e-q*d^2/2)
    proof_cases:
      c_at_most_half: a>c/2, d<=c, q<1/2 imply D1/(1-mu)>c*(2-3*c)/4>0.
      c_at_least_half: Equilibrium implies mu*K<e for K=2*a*(1+c)/(1+b)^2-d. At a0=(c+b)/2, 4*a0*K0-d^2 is nonnegative at b=0 and increasing in b; hence K>0 and 4*a*K>=d^2. Then q*d^2/2<e*d^2/(4*K)<=e*a.
    conclusion: D1>0 and C_M>Omega throughout this feasible class.
    general_negative_b_included: false
    arbitrary_prior_included: false
    general_transaction_price_included: false
  - id: exact_noncentered_parameter_checks
    status: algebraic_parameter_substitution_not_solver_or_sweep
    fixed_mu: 1/3
    fixed_c: 1/2
    construction:
      Q: 1+3*b+b^2
      H: (c-b)^2 if b>=0; c^2-2*b*c if b<0.
      ell: H/Q
      a: 3/(4*(2-ell))
      q: (c-a)/(c-b)
      p: 6*q
      patient_completion_cost: q*Q
