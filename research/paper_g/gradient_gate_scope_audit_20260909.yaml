diagnostics:
- id: gaussian_population_gate_reduction
  epistemic_class: classical_paper_only_refined_poincare_and_whitening
  assumptions: X~N(mu,sigma^2*I),sigma>0;scalar f in Gaussian H1;finite function and weak-gradient second moments.
  definitions: m=E grad f,Vf=Var(f),Vg=E norm(grad f-m)^2.
  exact_inequality: Q=Vg+2*norm(m)^2-2*Vf/sigma^2>=0.
  proof: Subtract mean and linear Gaussian projection;apply refined spectral-gap2 inequality to orthogonal residual.
  hermite_deficit: Q=sum_{degree>=3}(degree-2)*coefficient_squared/sigma^2.
  null: Every polynomial of total degree<=2 has Q=0.
  positive: Normalized third Hermite polynomial has Vf=1,m=0,Vg=3/sigma^2,Q=1/sigma^2.
  outside_class: Indicator has zero ordinary derivative and negative substituted Q;not H1,so not a counterexample to the inequality.
  covariance_form: E[(grad f-m)^T*Sigma*(grad f-m)]+2*m^T*Sigma*m-2*Vf>=0 for positive-definite Sigma.
  source_comparison: Onoda population Eq32 with c in[0,1] follows from this classical bound;no near-quadratic assumption needed for that population inequality.
  scope: Does not certify finite-sample variances,unseen support,gradient MSE,mixture optimality or empirical performance.
- id: gaussian_smooth_missed_support
  epistemic_class: elementary_paper_only_integration_by_parts_and_two_function_coupling
  oracle: N fixed iid N(0,sigma^2) inputs,function values and exact first derivatives;functions fixed before sampling.
  functions: f0=0,f1=A*psi((x-r)/h),A>0,r>h>0,nonnegative nonzero smooth bump psi supported inside(-1,1).
  support_mass: p=P(X in(r-h,r+h)).
  matching_transcript_probability: (1-p)^N.
  true_smoothed_gradient_gap: d=E[f1'(X)]=E[X*f1(X)]/sigma^2>0.
  gate_null_transcript: Values,derivatives and empirical variances all zero outside support;stated scalar gate passes for any nonnegative floor.
  testing_bound: e0+e1>=(1-p)^N;max(e0,e1)>=(1-p)^N/2.
  necessary_sample_condition: N>=log(2*delta)/log(1-p) for both classification errors<=delta<1/2.
  fixed_gap_boundary: Fixed amplitude can give a shrinking gap as p shrinks;fixed nonzero gap requires growing amplitude or derivative bounds.
  exclusions: No claim about implemented mixture zero-denominator behavior,source experiment failure,adaptive targeted queries,known whole-function formulas or uniformly bounded classes.
comparison_contract:
  target: Derivative of a stated finite-horizon Gaussian-smoothed scalar return;not automatically unperturbed policy return or stationary response.
  state_action_noise: Freeze initial physical state,policy parameters,latent noise distribution,clipping/squashing map and physical intervention duration.
  accessible_information: Function/gradient/trajectory oracle and any complete formula or support information explicitly separated.
  sampling_cost: Declare all function,gradient,trajectory and targeted-support queries,precision and variance-estimation cost.
  regularity_tail_precision: Population H1 is sufficient for the inequality;finite-batch reliability additionally needs justified bounds and a stated error/failure-probability contract.
  baselines: Existing AoBG,DDCG,stepwise mixing and relevant sensitivity methods at matched target/access cost;retain estimator covariance and data-dependent weight selection.
  confirmation: Both controls are development;no untouched nonlinear-fluid confirmation or independent simulator replication qualified.
  stop_rule: No promotion from necessary population relation or passing empirical gate to a reliable finite-cost gradient theorem without the missing assumptions.
