next_intake_allocation:
  status: allocated_not_started
  scope: Unsaturated native scientific questions under existing authorization; no parked/saturated re-entry
    granted.
  first_lane: Primary-supported empirical intervention or new control asset with the exact observed treatment
    and response stated before inventing a different action.
  fallback_lane: Measurement or simulator method with a concrete construction and a named same-information
    baseline.
  raw_question_limit: 4
  quick_screen_limit: 2
  new_primary_work_limit: 6
  collision_screens_planned: 0
  full_audits_planned: 0
  diversity_rule: Seek empirical intervention candidates first. If a later twelve-program cycle is opened,
    retain existing two-measurement/two-intervention and at-most-six-theory targets. No weak quota filler.
  method_brief:
  - State the native target and serious alternatives, and what a null would resolve.
  - Write the strongest feasible baseline with its actual inputs and current cost.
  - For a method claim, specify the operation that changes information, approximation or computation and an
    explicit regime where it might help; a new theorem is not mandatory.
  - For an empirical claim, state the supported treatment contrast and scientific predictive consequence; an
    invented new architecture is not required.
  - Name the cheapest discriminating next result and a plausible archetype-appropriate truth source; a complete
    final data contract is not an F1 prerequisite.
  stop_rule: Stop when the primary parent directly settles the exact contribution, an exact failure is proved,
    or no complete native question can be formed within the intake cap. Record no-question intake honestly.
  preflight_rule: Do not perform a full source contract for every raw idea or force an archive into an unsupported
    shutdown/transfer target. Dataset existence and a counterexample are reusable assets, not automatic candidate
    status.
