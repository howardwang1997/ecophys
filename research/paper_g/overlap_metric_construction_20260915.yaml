analytic_controls:
- id: C1_continuum_projected_metric
  result: For normalized real u=(cos theta,sin theta), compression gives -c*d2 + c*(theta_prime)^2; polar-normalizing
    small positive scalar links removes a finite term.
  limit: Established Born-Huang geometry; not a new physical effect or an allegation about the linked-product
    implementation.
- id: C2_sinc_linked_product_limit
  result: Exact A_k=cos(a*k*h) gives c*(p^2+a^2); exact-nearest-link reconstruction cos(a*h)^abs(k) with the
    declared sinc kinetic gives c*p^2+2*c*a^2*log(2)+O(h^2). Two retained channels expose relative coherence.
  counter_control: Three-point kinetic uses only exact nearest links, so both generators agree. Rank-three
    direct landmark reconstruction also solves this special model.
  limit: Hand-derived compact-momentum projected-model limit. Not independently established novelty, full molecular
    truth, an observed paper failure, or proof of neural superiority.
proposed_learning_operation: Gauge-covariant kinetic-operator-action fitting of overlap factors, with declared
  packet distribution and acquisition cost; same-information landmarks/KRR receive the same objective.
decision: Keep g41 parked. A concrete retained-subspace/dense-kinetic stress family and direct linked-product
  comparator are now available; transfer/cost advantage remains unqualified.
next_step: Bounded contribution check must specify a transferable factor/residual structure and matched query/error
  comparison against kinetic-aware landmarks, KRR and linked products. Toy accuracy alone is insufficient;
  no routine citation expansion or execution.
