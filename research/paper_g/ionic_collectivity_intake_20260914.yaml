analytic_controls:
- id: C1_equal_self_diffusion_different_charge
  status: standard_Einstein_covariance_control_not_new_theorem
  construction: For equal mobile charges q in a fixed nonconducting host, sigma=lim E[|sum_i q Delta_r_i|^2]/(2*d*V*kBT*t),
    whereas sigma_NE uses sum_i q^2 E[|Delta_r_i|^2] in the numerator. At zero mean drift the difference is
    the sum of inter-ion displacement cross-covariances.
  exact_example: In one dimension let X1(t)=sqrt(2D)*W(t) and X2(t)=s*sqrt(2D)*W(t), s=+1 or -1. Both particles
    have self diffusivity D in either model, while the total-charge variance is 8*q^2*D*t or zero. Thus sigma/sigma_NE
    equals 2 or 0 with identical self diffusion.
  limitation: Gaussian statistical control, not a stable two-ion crystal model, new theory, measured failure,
    or source-specific ranking reversal. Multi-species transport needs the full charge-weighted current and
    an explicit frame.
- id: C2_periodic_loop_scope
  status: standard_lifted_displacement_identity_not_new_theorem
  construction: For a directed cycle in a periodic cell with lattice matrix A, retain a lifted displacement
    on every edge. The sum is A*w for integer winding vector w. Contractible cycles have w=0, while a geometrically
    closed cycle modulo the lattice can have w!=0 and transport charge.
  implication: Do not infer zero charge displacement from a closed graph label alone. Keep image offsets/unwrapped
    trajectories when defining events and long-time charge current.
  limitation: Elementary periodic bookkeeping, not a demonstrated defect in the directed-graph paper. Its published
    local closed-loop treatment is acknowledged; source code and winding handling were not audited.
decision: Generic collective-motion graph analysis, correlation-aware conductivity and ML-potential benchmarking
  have direct parents. No same-material causal fork or distinctive learning contribution formed. Do not advance
  an NE-to-GK metric substitution as a new method; no electrolyte-wide closure.
next_step: For any future ion-lattice mechanism intake, first qualify a same-material intervention separating
  framework dynamics from static geometry/ensemble and a concrete learning gain. The graph paper fixed-framework
  methods bundle constraints and thermostat/preparation changes; they are not by themselves a clean dynamics-only
  intervention. Do not harvest generic transport predictors again.
