- id: C1_total_modification_covariance
  result: Total covariance splits into between-conformer and within-conformer components; dose-dependent emission
    probabilities can change covariance at fixed conformer weights.
  limit: Standard identity, not a deconvolution failure or new theorem.
- id: C2_low_dose_mixture_coupling_match
  result: "Static-mixture covariance and sequential reaction-induced covariance both have leading d^2 terms.\
    \ Equal-weight rates a\xB1u,b\xB1v match the one-conformer sequential coefficient with eta=0,gamma=2uv/a."
  limit: Only first-order marginals and second-order covariance coefficient matched; no all-dose/full-distribution
    equivalence or RNA-specific calibration.
qualified_control_lead: Same 236-nt RRE construct, 2.5 versus 5.0 mM NMIA; DRACO-inferred cluster changes.
  This is a development lead, not independent population truth.
