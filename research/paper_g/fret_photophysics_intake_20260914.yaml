analytic_controls:
- id: C1_dynamic_event_selection
  status: standard_truncated_count_control_not_new_theorem
  construction: A fully observed symmetric two-state CTMC has rate k out of either state. Over fixed T, the
    transition count N is Poisson(kT). An oracle retains only windows with N>=1, with perfect precision for
    the event of realized dynamics. Then E[N/T | N>=1]=k/(1-exp(-kT)), which exceeds k.
  implication: Even perfect event classification need not preserve population kinetic estimation. All molecules
    in this toy have the same generator; a window with N=0 is not a separate static molecular species.
  correction: For a frozen acceptance rule S(y), selected-only likelihood is p_theta(y | S=1)=p_theta(y) 1[S(y)=1]/Z_theta,
    Z_theta=P_theta(S=1). If rejection counts are observed, their probability factors supply additional information;
    if all records are retained, the full-data likelihood is a required baseline.
  scope: Ordinary conditional likelihood/zero truncation, not a new ML contribution or an empirical failure
    of FENNEC. Real diffusion durations, noisy transitions and coupled photophysics require a specified model;
    no universal numerical bias prediction.
decision: Do not advance generic photon classification, continuous photon likelihood or selection-normalizer
  correction as a new contribution. Preserve one specific indexed same-system mechanism lead for a separately
  bounded primary audit; no domain-wide closure.
