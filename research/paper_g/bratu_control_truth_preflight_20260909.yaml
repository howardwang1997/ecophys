diagnostics:
- id: bratu_profile_fold_stability
  epistemic_class: classical_paper_only_bratu_and_sturm_liouville
  profile: U_theta(x)=2*log(cosh(theta)/cosh(theta*(1-2*x))).
  parameter: lambda(theta)=8*theta^2*sech(theta)^2;theta>0.
  fold: Unique positive theta_star with theta_star*tanh(theta_star)=1.
  principal_stability: sign(mu_1)=-sign(lambda_prime(theta)); derivative profile is a positive Dirichlet null mode at the fold.
  scope: Stationary profiles, branch labels, fold and principal linear-stability sign only; no dynamic or finite-amplitude control certificate.
- id: hold_vs_endpoint_actuation
  epistemic_class: elementary_paper_only_sampled_data_control
  exact_gain: D_tau=integral_0^tau exp(s*A)*B_c ds.
  endpoint_gain: tau*B_c; a different exact action if interpreted as an impulse.
  scalar_counterexample: r=a*tau=1,k=exp(r)/(tau*b); endpoint closed-loop multiplier0, held-input multiplier e*(2-e)<-1.
  nulls: a=0; approximation converges as a*tau approaches0.
  scope: No claim about source experiment instability; PDE Taylor expansion requires regularity and is not automatically mesh uniform.
