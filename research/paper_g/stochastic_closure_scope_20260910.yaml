diagnostics:
- id: matched_covariance_summaries_control
  epistemic_class: standard_paper_only_covariance_identity
  estimand: Var[integral_0^t F(s)ds | X(0)=0], stationary unobserved zero-mean Gaussian force.
  kernel_a: v*exp(-abs(h)/tau)
  kernel_b: v*(exp(-abs(h)/(2*tau))/3+2*exp(-2*abs(h)/tau)/3)
  matched:
  - physical_time
  - initial_observation
  - force_variance_v
  - integral_correlation_time_tau
  variance_identity: V(t)=2*integral_0^t (t-h)*C(h)dh; V_second_derivative(t)=2*C(t).
  value_a_at_tau: 2*exp(-1)*v*tau^2
  value_b_at_tau: (-1+8*exp(-1/2)/3+exp(-2)/3)*v*tau^2
  'null': Equal covariance on [0,t] gives equal variance at t.
  limitation: Both alternatives are stochastic, augmented dimensions differ, and no turbulent cascade is represented.
    Not a novelty or complexity result.
