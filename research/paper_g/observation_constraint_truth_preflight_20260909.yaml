diagnostics:
- id: incompressible_flow_planar_restriction_and_error_control
  epistemic_class: elementary_paper_only_navier_stokes_and_orthogonal_projection
  state: Periodic [0,2pi]^3 incompressible velocity U and pressure p;viscosity nu>0.
  exact_solution: a=A*exp(-2nu*t);U=(a*sin(x)*cos(z),0,-a*cos(x)*sin(z));p=a^2*(cos(2x)+cos(2z))/4.
  proof: divU=0;DeltaU=-2U;U_t=nu*DeltaU;U_dot_gradU=-gradp.
  observation: O retains first two components at z=0;OU=(a*sin(x),0);planar divergence=a*cos(x).
  missing_term: Normal component U_z is zero on the plane but its normal derivative is -a*cos(x);single-plane
    stereo does not supply that derivative.
  projection: P3U=U;P2OU=0;OP3U=OU for periodic orthogonal Helmholtz projections.
  loss: With normalized plane area,squared error from projecting noiseless OU is a^2/2.
  'null': True planar shear U=(B*exp(-nu*t)*sin(y),0,0) is preserved after restriction.
  generic_identity: norm(P*(v+e)-v)^2-norm(e)^2=norm(Q*v)^2-norm(Q*e)^2;Q=I-P;no zero-mean or independence
    needed.
  ambiguity: At a fixed time,the exact physical plane and zero field with matching measurement error produce
    the same observation;requires an explicit error model or additional reference.
  nearby_plane_control: '[U_z(h)-U_z(-h)]/(2h)=-a*cos(x)*sin(h)/h;within-family finite-spacing correction only.'
  noise_variance: Independent endpoint errors of variance sigma^2 give central-difference variance sigma^2/(2h^2).
  scope: Standard observation and projection geometry;no new method,benchmark result or general exact finite-spacing
    derivative.
