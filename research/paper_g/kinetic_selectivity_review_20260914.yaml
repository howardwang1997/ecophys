analytic_controls:
- id: R1_invertible_feature_scaling_probe_control
  result: For Var(eta)=1 and feature z=epsilon*eta, epsilon>0, minimizing E[(eta-w*z)^2]+lambda*w^2 gives prediction
    epsilon^2/(epsilon^2+lambda)*eta. The representation remains invertible for every epsilon>0 even while
    fixed-lambda prediction tends to zero. Standardization repairs this scaling example; not a universal probe
    failure or empirical pretraining diagnosis.
  new_theorem: false
- id: R2_affinity_validation_common_rate_blindness
  result: For true mutation changes a=b=0, fitted errors ahat=bhat=u yield dhat=bhat-ahat=0 but common kinetic
    coordinate etahat=(ahat+bhat)/2=u. Error covariance sigma^2*11^T has zero affinity-contrast variance and
    nonzero common-mode variance. Independent equilibrium KD still cannot validate both kinetic rates. Mutant-specific/common-rate
    errors are illustrative, not observed assay errors.
  new_theorem: false
