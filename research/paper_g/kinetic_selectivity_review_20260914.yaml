decision_basis: Current proposal remains a representation/readout comparison with stratified kinetics evaluation.
  No concrete scientific conclusion beyond existing mutant-rate prediction and benchmark analysis has been
  specified; matched kinetic uncertainty support also remains unresolved. Park rather than infer impossibility
  or measured failure.
support_requirements:
- Define predictive accessibility at a fixed model/sample/compute budget, not absolute absence of representation
  information.
- Separate uncertainty in affinity contrast from common kinetic scale; independent KD alone does not validate
  both rates.
- Freeze parent/mutant replicate IDs, raw-fit covariance or defensible independent kinetic measurements, censoring,
  construct/buffer/valency, and selection lifecycle before execution.
- Do not treat subset KinExA measurements as random independent confirmation of all designs, or shared fitted
  KD as independent matching.
- Full final contract is not a prerequisite to naming an F1 question; unresolved contribution is the primary
  reason not to escalate here.
