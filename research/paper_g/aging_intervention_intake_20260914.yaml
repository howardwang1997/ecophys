analytic_controls:
- id: C1_trapping_protection_coexistence
  assumptions: Dilute independent vacancies; unsaturated traps; fixed low-temperature trapping a and sink-loss
    lambda; negligible cold detrapping; initial free vacancy1,bound0,lost0. Standard idealized rate model,
    not fitted alloy kinetics.
  equations: df/dt=-(a+lambda)f; db/dt=a*f; dL/dt=lambda*f; f+b+L=1.
  solution: f=exp(-(a+lambda)t); b=a/(a+lambda)*(1-exp(-(a+lambda)t)). Untrapped reference f0=exp(-lambda*t).
  example: 'a=lambda=t=1: f=e^-2 < e^-1=f0, while f+b=(1+e^-2)/2 > e^-1; difference=(1-e^-1)^2/2 >0.'
  discriminator_scope: Complete rapid release at a subsequent high temperature, before appreciable sink loss,
    can expose the larger retained population. This is a specified limit, not a measured heat treatment or
    hardness prediction.
  new_theorem: false
source_comparison: Room-temperature immobilization, retained vacancy population during heating, and final mechanical
  formability are different observables and conditions. They are not opposite predictions for one controlled
  contrast.
unresolved: Quantitative protocol rankings and independently validated rates/observations remain unresolved
  here; coexistence does not identify the actual alloy mechanism or prove all thermal strategies predictable.
baseline_scope: A future specific mechanism question must include coupled trapping, release and sink loss with
  refitted parameters; a history-blind composition-only model is insufficient. A full method need not be new
  for an empirical contribution.
