diagnostics:
- id: canonical_generator_residual
  epistemic_class: standard_paper_only_generator_control
  hypotheses: Smooth confining U,full velocity support,unit mass,kB1,position-only deterministic error r,standard
    Langevin or Andersen bath at fixed T.
  identity: Lstar_r rho0=(r dot v)*rho0/T; unchanged canonical phase-space target iff r=0.
  limitation: Not a no-go for velocity-dependent forces,augmented samplers,changed targets or all thermostats;
    overdamped weighted-divergence condition differs.
- id: rotational_ou_joint_marginal_control
  epistemic_class: standard_paper_only_linear_diffusion_control
  hypotheses: dq=v dt,dv=[(-kI+aJ)q-gamma*v]dt+sqrt(2gamma*Tb)dW;k,gamma,Tb>0,a^2<gamma^2*k.
  identity: s=Tb/(k-a^2/gamma^2);Q=sI,V=ksI,C=-(a*s/gamma)J. Retuned Tb=Tstar*(1-a^2/(gamma^2*k)) matches separate
    marginals but current=2a*Tstar/(gamma*k).
  limitation: Retuning is a different bath intervention using analytic truth; full energy distribution not
    matched. Synthetic linear family, not learned-force outcome evidence.
- id: matched_rmse_different_response
  epistemic_class: standard_paper_only_observable_control
  hypotheses: Overdamped 2D harmonic reference U=k|q|^2/2,0<|a|<k;r_rot=aJq,r_grad=a*diag(1,-1)q.
  identity: Both reference-measure MSE=2a^2*T/k; rotational error preserves position law,gradient error gives
    covariance diag(T/(k-a),T/(k+a)).
  limitation: Same error magnitude does not match response; no preference for nonconservative trained models
    or new OOD theorem.
