proof_scope:
  state: Fixed mark100, nonbinding prefunding; q in {0,...,Q}, Q>=2, initial1; frozen S/E modes.
  customer_law: iid unknown nu in(0,1), p_b,p_s in[0,1]; no known positive side-frequency floor.
  feedback: Every request side after action; willingness observed only on matching legal wide quote via fill/nonfill.
  bias_certificate: Every candidate law, including endpoint nu, admits h(0)=0, |h(q+1)-h(q)|<=2; scalar optimal
    gain.
  planner: Exact maximum-gain model in shared rectangular confidence set with Bellman/local-bias constraints;
    compact existence only.
  epochs: Frozen intervals end at count doubling or the single mode change; K_T<=5+3floor(log2T); counts retained.
  model_error: 6 d_nu+4 nu W_b d_b+4(1-nu)W_s d_s; no Q multiplier.
  confidence: eta=(T+1)^(-2), L=log(6T/eta); three iid observed streams, all n<=T; total failure<=eta.
  expectation: Martingale expectation unconditional; bad-event loss<=13T eta; potentials<=2Q K_T.
  oracle_bridge: Original full finite-horizon dynamic value<=E sum mode gains+4Q.
  result: R_T<=min(3T,4Q+2Q K_T+(24+16sqrt2)sqrt(LT)+13T eta).
  excluded: Efficient planning, optimal Q law, Q-uniform lower bound, endogenous/repeated protection, binding
    cash or price risk.
