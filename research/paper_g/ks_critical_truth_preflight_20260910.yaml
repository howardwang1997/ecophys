diagnostics:
- id: classical_critical_mass_virial
  epistemic_class: classical_paper_only_control
  contract: R2, unscreened log kernel, no advection, finite centered second moment, sufficient regularity and
    decay.
  identity: J_prime=4*mu-chi*M/(2*pi); Mcrit=8*pi*mu/chi.
  supported_target: Upper bound on regular existence time for supercritical mass.
  excluded_target: Exact blowup time, critical-mass classification, softened or bounded-domain system.
- id: critical_translation_control
  epistemic_class: paper_only_development_scope_counterexample
  contract: R2, mu=chi=1, M=8*pi, unsmoothed kernel, smooth translation of q=1/[pi*(1+r^2)^2].
  identity: A[q]=0; L=1/T; KL(q(x-e1)||q)>=1/4; critical modulated free energy=0.
  supported_target: Obstruction to the unrestricted whole-space smooth-flow reading of the displayed energy
    domination and loss bound.
  excluded_target: Finite-second-moment virial class; exact finite Gaussian-prior KRnet representation; trained-model
    performance.
  novelty: Standard symmetry/energy mechanism; not a source-correction paper proposal.
- id: centered_virial_residual_action
  epistemic_class: paper_only_development_derivation_novelty_unqualified
  contract: Positive smooth normalized finite-moment hypothesis on [0,T], supercritical exact unscreened equation,
    integrable weighted velocity residual.
  identity: kappa=chi*M/(2*pi)-4*mu; tau_v=J0/kappa; Lshape=L-integral|m_prime|^2.
  bound: Lshape>=kappa*(log(T/tau_v)-1+tau_v/T) for T>tau_v; otherwise lower bound zero.
  proof: Complete square with b(t)=a/(1+a*t), b_prime=-b^2, integrate centered virial identity and optimize
    a>=0.
  excluded_target: Exact event time, full-PDE attainability/sharpness, finite-sample or softened-kernel certificate,
    new theorem priority.
