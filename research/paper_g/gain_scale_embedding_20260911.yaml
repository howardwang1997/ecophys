  limitation: Sufficient restriction, not all invertible models or transient dynamics; no parameter-dependent
    observation map.
truth_contract:
  estimands: Original equilibrium gain-arm Y observations, structural Phi/K and correctly transformed physical
    response targets. Solvability and statistical identification are distinct.
  assignment_interference: Known fixed-gain arms and common primitive-noise law; no field assignment or actuator
    validation. Shared-noise counterfactual coupling is retained only when stipulated by the model.
  lifecycle_replay: Invertible D coordinate map; zero gains retain Y via deterministic relay. Fixed M,c over
    the bounded parameter/gain class; no within-arm time-dependent transient transfer.
  rights_ethics_release: One official primary PDF privately cached and three pages rendered; no code/data/outreach/publication
    authorization or redistribution.
