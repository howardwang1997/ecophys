  claim: The relay Y=Phi U+LE,U=DY retains all original Y observations for every D, including zero gains.
  limitation: Augmented law is singular; generic full-density/faithfulness/independent-node-noise learning
    assumptions do not automatically transfer.
- id: gain_scale_contractive_subclass
  epistemic_class: standard_paper_only_uniform_block_norm_bound
  result_ref: papers/proposal/ecomd_paper_g_gain_scale_embedding_2026-09-11.md
  claim: For fixed gain boundM and class bound M||Phi||p<=r_bar<1, one fixed r_bar<c<1 embeds the relay in
