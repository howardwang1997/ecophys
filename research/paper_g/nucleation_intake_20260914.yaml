analytic_controls:
- id: C1_winner_conditioning
  assumptions: Independent exponential latent induction times Ti with constant rates lambda_i>0; first event
    defines observed winner I and time T. No growth delay or phase replacement.
  equations: P(I=i)=lambda_i/Lambda; f(T=t,I=i)=lambda_i*exp(-Lambda*t); T|I=i~Exp(Lambda), Lambda=sum lambda_i.
  example: 'lambda1=1,lambda2=0.01: mean observed winning time for either class=1/1.01, while isolated mean
    time of class2=100.'
  scope: Standard competing-risk control already represented in the 2017 parent. Winner-only mean is not isolated
    rate. Joint winner proportions plus total survival can identify rates under the stated assumptions; no
    universal nonidentifiability claim.
- id: C2_visibility_delay
  assumptions: Ideal known bubble collapse at20 microseconds, first visible crystal at30 microseconds; nonnegative
    uncalibrated delay G between nucleation and visibility.
  equation: T_visible=T_nucleus+G.
  example: Pre-collapse nucleation at5 plus delay25 and post-collapse nucleation at25 plus delay5 give the
    same visible time30.
  scope: Timing alone does not assign interface-versus-collapse causality. A calibrated growth/detection bound
    can distinguish timing in suitable cases; causal attribution still needs an appropriate intervention. Hypothetical
    values, not data or a full optical/mechanistic model.
unresolved_source_fork:
  native_object: Laser-triggered nucleation in a specified supersaturated salt solution.
  rivals:
  - Bubble-interface concentration increase initiates nuclei.
  - Bubble-collapse pressure waves initiate nuclei.
  source_ref: https://journals.aps.org/prresearch/pdf/10.1103/kr3g-67gz
  why_existing_pressure_result_not_decisive: Both pathways can predict more nucleation from larger bubbles;
    yield suppression alone does not distinguish them.
  missing_discriminator: An admissible matched intervention separating interface enrichment from collapse forcing,
    or independently calibrated nucleus-timing observation. Neither qualified here.
  ml_increment: 'Unspecified: image recognition or standard time-to-event fitting alone is insufficient. No
    claim that ML is necessary or the mechanism universally resolved.'
  candidate_harvest_authorized: false
next_preflight_scope:
  purpose: Verify whether the named CsCl public imaging resource supplies an observation or control that can
    separate the source-defined bubble pathways.
  allowed: Metadata/readme and published methods only; at most two additional primary works, no outcomes.
  required_fields:
  - laser/camera synchronization
  - nucleation-to-visibility lag calibration
  - complete event/negative selection
  - bubble inside solution versus external oil
  - independent experimental units
  - same-solute controlled perturbation
  - rights and confirmation partition
  stop_rule: Stop if the resource only supplies selected visible-event illustrations without a discriminating
    observation; do not train a classifier or count a new topic from source availability alone.
