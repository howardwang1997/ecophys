diagnostics:
- id: A_exact_delivery
  epistemic_class: elementary_paper_only_linear_response_derivation
  time_unit: Arbitrary consistent units; not a physical calibration.
  carbon_response: R(t)=1/2+(1/2)*exp(-t)
  forcing_target: m(t)=exp(-3*t/4)
  temperature_response: h(t)=exp(-2*t)
  initial_removal: 1
  allowed_actions: Initial divisible contracts with arbitrary finite maturities and unbounded aggregate maturity support; deterministic aggregate delivery.
  forbidden_actions: Short holdings, additional removals, default and immediate time-zero release.
  stock: S(t)=2*exp(-t/2)-exp(-3*t/4)
  release_density: f(t)=exp(-t/2)-(3/4)*exp(-3*t/4)
  release_mass: 1
  expected_duration: '8/3'
  forcing_identity: B=R-R*f, B_hat=s*R_hat*S_hat=1/(s+3/4)
  exact_temperature_match: h*B=h*m
  convexity_check: S_second_derivative_at_zero=-1/16; no positive mixture of constant-rate exponential stocks can equal this S.
  limitation: Elementary inverse-response construction. Finite individual duration does not imply a common finite expiry; no real availability or approximation error floor established.
- id: B_hard_expiry
  epistemic_class: elementary_paper_only_linear_response_derivation
  matched_state: Same R, m, h, initial quantity and no-top-up rule as A.
  changed_constraint: Release maturity U lies in [0,T] for a fixed finite T.
  after_expiry: B(t)=(1/2)*exp(-t)*(1-E[exp(U)]) for t>T.
  sign: Strictly negative if Pr(U>0)>0; zero for immediate release. Target m(t) is strictly positive.
  result: No entire-path exact forcing or temperature replication in the declared hard-expiry class.
  limitation: No finite-window impossibility, field effect, calibrated magnitude, replacement-contract result or nonlinear-climate conclusion.
