diagnostics:
- id: invariant_shear_held_force
  epistemic_class: elementary_paper_only_continuum_solution
  domain: Periodic square [0,2*pi]^2; density1; incompressible momentum equation.
  family: u=(sum(c_k*sin(k*y)),0); k in {4,5,6,7}; nu in [1/200,1/40]; abs(c_k(0))<=1; abs(a_k)<=1/2; tau in [0,10].
  background: b_4=1, other b_k=0; momentum forcing coefficients b_k+a_k held during interval.
  exact_response: c_k(tau)=r_k*c_k(0)+g_k*(b_k+a_k), r_k=exp(-nu*k^2*tau),g_k=(1-r_k)/(nu*k^2).
  action_derivative: diagonal g_k; positive for positive tau;zero at tau=0.
  equal_impulse_comparison: Initial velocity reset J gives r_k*J; held body force J/tau gives g_k*J/tau.
  scope_boundary: Nonlinear advection vanishes in this invariant family; no nonlinear or chaotic response qualification.
- id: shear_state_dependent_fluid_power
  epistemic_class: elementary_paper_only_orthogonality_and_energy_accounting
  energy: spatial_mean(abs(u)^2)/2=sum(c_k^2)/4.
  total_power: sum((b_k+a_k)*c_k)/2.
  dissipation: nu*sum(k^2*c_k^2)/2.
  energy_balance: dE/dt=total_power-dissipation.
  control_only_power: sum(a_k*c_k)/2.
  sign_control: Opposite nonzero shear coefficients reverse one-mode control power at fixed action norm and initial speed/energy.
  null: Zero corresponding shear coefficient gives zero instantaneous control power despite nonzero action.
  finite_energy_response: sum(d_k*g_k*a_k)/2+sum(g_k^2*a_k^2)/4, d_k=r_k*c_k(0)+g_k*b_k.
  observation_boundary: Instantaneous speed ambiguity is not identical full observation histories; signed state may be recovered from additional information.
  cost_boundary: Fluid power is not electrical actuator consumption; an action regularizer need not claim physical power.
