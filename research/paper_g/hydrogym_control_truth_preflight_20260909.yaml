  untouched_confirmation: Selected source and analytic controls are development; no untouched whole-source confirmation partition qualified or accessed.
  independent_replication: No independent same-estimand nonlinear solver truth or empirical replication; source backends and paper versions are not automatic independent lineages.
  cost_precision: Seven text downloads and algebra only;zero solver steps; no runtime, gradient-cost, training-budget or GPU-compatibility qualification.
  baseline_contract: Same target, initial state, action law, observable, precision and access budget; direct solver sensitivities, finite differences and established sensitivity or policy methods as applicable.
  stop_rules:
  - Require explicit code/config/archive identity and continuum conformance before truth claims.
  - Keep momentum body forcing, vorticity forcing and instantaneous velocity resets distinct.
  - Match physical duration, not just action count or nominal episode time.
  - Keep endpoint state and trajectory-averaged magnitude observations distinct.
  - Do not substitute action regularization for a stated physical power estimand.
  - Do not infer identical legal histories from an instantaneous speed sign ambiguity.
  - Do not promote the invariant linear shear family to nonlinear or chaotic response truth.
  - Do not equate backend count or paper versions with independent replication.
  - Do not promote generic differentiable control or source conformance work to a new scientific contribution.
