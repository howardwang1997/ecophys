  state_clock_conditioning: Freeze initial-state law,full or partial observation,physical horizon,control timing and ensemble/time averaging;keep climatological and coupled boundary histories distinct.
  reference_access: Dedicated perturbation-ensemble access cannot be silently equated with archived scenario-only data.
  rights_and_release: Article reading only;selected CC-BY-4.0 primary texts;code/data rights and immutable release identity not audited.
  untouched_confirmation: No untouched whole-source confirmation partition or independent same-target reference qualified or accessed.
  cost_precision: Paper reading and one exact fixture only;no simulation,reference-label cost,field precision or training/inference budget certified.
