diagnostics:
- id: conservative_two_compartment_component_truth
  epistemic_class: elementary_paper_only_linear_exchange_and_treatment_support
  native_state: Nonnegative tracer masses x,y with x+y=1;initial x=y=1/2.
  controls: u,v in [0,1] externally set exchange-rate controls;gamma>0 fixed.
  family: m_lambda=1/2+u/8+v/8+lambda*u*(1-v);lambda in {-1/8,0,1/8}.
  dynamics: x_dot=gamma*m_lambda*y-gamma*(1-m_lambda)*x;y_dot=-x_dot.
  positivity_proof: Bilinear interpolation of four corner m values in [1/2,3/4];nonnegative exchange rates and inward boundary derivatives.
  held_response: R_lambda(u,v;t)=(1-exp(-gamma*t))*(u/8+v/8+lambda*u*(1-v)).
  identical_reference_paths: Baseline(0,0) and joint-control(1,1) paths,including arbitrary switching between these endpoints,agree for all lambda.
  interaction: I_lambda=R11-R10-R01+R00=-(1-exp(-gamma*t))*lambda.
  positive_negative_null: At positive t,lambda=-1/8 gives positive interaction,+1/8 negative,0 additive;at t=0 all zero.
  within_family_single_probe: R10/g-1/8=lambda for t>0,g=1-exp(-gamma*t),known gamma and fixed additive coefficient.
  within_family_joint_dose_probe: R_half_half-R11/2=g*lambda/4;also cancels arbitrary additive coefficients within the same bilinear family.
  probe_scope: One-probe sufficiency is parametric only;unrestricted response surfaces can match joint doses and differ at individual corners.
  interpretation: Perfect total-response matching and conservation do not identify unobserved component interactions;standard off-support reduction,not novel theorem or measured model failure.
comparison_contract:
  targets:
  - total_response_between_two_boundary_regimes
  - single_component_response_with_other_controls_held_fixed
  - mixed_control_interaction
