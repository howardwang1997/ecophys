diagnostics:
- id: A_resolved_energy_sign_twin
  epistemic_class: elementary_paper_only_full_PDE_instantaneous_derivative
  system: Periodic viscous Burgers on[0,2*pi], nu>0; initial u=a*sin(x)+b*sin(2*x), a!=0.
  normalization: norm(u)^2=(1/pi)*integral(u^2); E=norm(u)^2/2; P retains first sine mode.
  derivatives_at_zero: a_dot=a*b/2-nu*a; b_dot=-a^2/2-4*nu*b.
  energy_derivatives_at_zero: E_P_dot=a^2*(b/2-nu); E_dot=-nu*(a^2+4*b^2).
  matched_pair: b=+B versus-B, B>2*nu; same resolved field, momentum, SGS energy, full energy and full dissipation; opposite resolved-energy derivative signs.
  competent_control: Signed b distinguishes this pair; full state supplies exact PDE response; established augmented closures permit exchange.
  limit: Instantaneous full-PDE identity, not a truncated rollout or collision under the source's actual signed transform T.
- id: B_conditional_mean_invariant
  epistemic_class: elementary_paper_only_conditional_expectation_geometry
  assumptions: Supplied information O; norm(Y)=r(O) almost surely; finite second moment; m=E[Y|O], Sigma=Cov(Y|O).
  energy_identity: r^2=norm(m)^2+trace(Sigma).
  risk_identity: E[norm(Y-z)^2|O]=trace(Sigma)+norm(z-m)^2.
  equality_constraint_excess: Minimum extra squared risk under norm(z)=r is(r-norm(m))^2.
  isotropic_scattering_control: Y=r*S with S uniform unit sphere and r>0 gives m=0; mean risk r^2; any constrained deterministic prediction risk2*r^2.
  sampling_control: Independent correct sample also has risk2*r^2; distributional prediction requires a proper distributional score, not a claim to beat the mean in squared error.
  nulls: Sigma=0 eliminates conflict; convex norm upper bound contains m; affine AY=c(O) implies A*m=c(O).
  limit: No refutation of PaperD affine constraints or all energy inequalities; no new uncertainty method.
- id: C_global_vs_local_entropy
  epistemic_class: elementary_paper_only_distributional_weak_solution
  system: Inviscid Burgers on periodic(-pi,pi); stationary u=+1 on(-pi,0), u=-1 on(0,pi).
  weak_solution: u^2/2 is constant; mass0 and all spatial entropy integrals constant.
  local_entropy_pair: eta=u^2/2; q=u^3/3.
  entropy_residual: (2/3)*delta_pi-(2/3)*delta_0 on the circle; nonnegative test localized near seam detects positive residual.
  competent_control: Standard local entropy admissibility rejects the expansion jump; wPINNs and entropy-admissible numerical solvers are existing baselines.
  limit: No omitted boundary flux; no claim of failure in an entropy-trained model or a novel local entropy method.
