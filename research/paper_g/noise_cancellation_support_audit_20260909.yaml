  reference_access: Repeated same-start trajectories need not cover the query state;new-state reset access is a separate capability,even when clean labels are absent.
  rights_and_release: Public article reading only;code and data release terms not qualified;no redistribution of article figures.
  untouched_confirmation: None qualified or accessed;selected source reading and paper controls are development evidence.
  cost_precision: One exact support/projection diagnostic only;sample-mean variance is elementary within the fixture,no novel cost guarantee or training budget certified.
  stop_rules:
