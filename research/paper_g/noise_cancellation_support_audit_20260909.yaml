diagnostics:
- id: bounded_noise_support_and_regression_projection
  epistemic_class: elementary_paper_only_support_nonidentification_and_linear_algebra
  state: Y in [-2,2];Y0=1;fully observed discrete-time scalar process.
  family: f_theta(y)=theta*(1-y^2);theta in {-1/4,0,+1/4}.
  training: Y_next=f_theta(Y)+nu;independent equiprobable signs nu with conditional mean zero given the past.
  validity: For all Y in [-2,2],abs(f_theta(Y))<=3/4;all noisy updates stay in [-7/4,7/4].
  identical_training_law: Every state after initialization is an independent sign;all theta induce the same entire path law at epsilon=1 for every training length.
  target: Noise-free rollout from the same initial state has Y1=0,Y2=theta.
  risk_statement: A common estimator at zero has max absolute error over the positive and negative alternatives at least1/4 under a common transcript;maximum expected absolute risk also at least1/4.
  stability: Noise-free trajectories enter [0,1/4] or [-1/4,0],with derivative magnitude at most1/8.
  exact_features: phi=(1,y,y^2);w_theta=(theta,0,-theta);X*w_theta=0 but phi(0)^T*w_theta=theta.
  regression_identity: f-phiT*w_hat=(f-phiT*w_star)+phiT*(I-Xplus*X)*w_star-phiT*Xplus*r-epsilon*phiT*Xplus*v.
  error_bound: delta*(1+norm1(phiT*Xplus))+abs(phiT*(I-Xplus*X)*w_star)+epsilon*abs(phiT*Xplus*v).
  identifying_condition: Query feature in the row space or coefficient in identified subspace eliminates the unobserved component;full column rank is sufficient but not necessary.
  noise_limit_condition: Stable Gram/excitation and suitable martingale convergence;zero innovation mean alone is insufficient,especially with growing feature dimension.
  resolving_query: Reset at zero under the same noise;Z=theta+nu. Repeated independent reset sample mean has expectation theta and variance1/N;one additional query type completes the quadratic design rank.
  discrete_support_caveat: Exact known Rademacher law and the stipulated discrete alternatives permit stronger individual-observation identification;variance1/N is not a minimax lower bound or a necessity claim.
  interpretation: Classical support/rank obstruction and ordinary labelled augmentation;not a new impossibility theorem,bifurcation result,or benchmark replication.
comparison_contract:
