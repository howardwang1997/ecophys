diagnostics:
- id: linear_feedback_independent_replay
  epistemic_class: elementary_paper_only_stationary_ito_covariance_balance
  assumptions: a,b,k,sigma>0;q=b*k;r=a+q;stable bi-infinite stationary processes;independent Brownian B and W.
  plant: dX=(-a*X+b*U)*dt+sigma*dW;feedback U=-k*X.
  replay: dZ=-r*Z*dt+sigma*dB;U_R=-k*Z;dY=(-a*Y-q*Z)*dt+sigma*dW.
  feedback_variance: V=sigma^2/(2*r).
  action_law: Both centered stationary Gaussian with covariance k^2*V*exp(-r*abs(t-s)).
  replay_covariance: C=-q*V/(a+r).
  replay_variance: V_R=sigma^2/(2*a)+q^2*V/(a*(a+r)).
  ordering: V<V0<V_R;V0=sigma^2/(2*a).
  exact_gap: V_R-V=q*sigma^2/(a*(a+r)).
  cross_power: E[X*U]=-k*V;E[Y*U_R]=k*q*V/(a+r);multiply by b for the abstract plant energy input.
  scope: Classical linear feedback benefit;no learned-policy novelty,nonlinear mechanism or measured wind-tunnel effect claimed.
- id: disturbance_coupling_and_replay_null
  epistemic_class: elementary_paper_only_covariance_and_pathwise_uniqueness
  coupling: d<B,W>=rho*dt;rho in [-1,1].
  covariance: C_rho=(-q*V+rho*sigma^2)/(a+r).
  gap: V_R_rho-V=q*sigma^2*(1-rho)/(a*(a+r)).
  stationary_null: rho=1 gives Y=Z in stationary law and zero gap.
  finite_time_null: Same initial state and same driving disturbance with the identical feedback-generated tape give identical state paths.
  no_control_null: k=0 gives identical policies and state laws.
  scope: Matching action marginal laws leaves state-action and disturbance-action coupling unspecified.
