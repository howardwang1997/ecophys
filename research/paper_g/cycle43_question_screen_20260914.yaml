  archetype: measurement_method
  source_lane: market_native_action_or_constraint
  scientific_domain: synaptic_physiology
  native_object: Labelled inputs to a recorded postsynaptic cell with fixed preparation, opsin/expression,
    illumination, clamp, pulse power and initial recovery history.
  action: Assign input-specific burst/recovery histories and target subsets, potentially with concurrent pulses.
  response: Per-input protocol-conditioned evoked-current response on frozen untouched histories; intrinsic
    release parameters require stronger truth.
  rivals:
    H1: History-coded multiplexing produces distinguishable response signatures and improves response estimation
      per total cost.
    H0: Uncertain arrival/release and overlapping waveforms exhaust gains; capable interleaved single-target
      schedules and ordinary dynamic demixing suffice.
  discriminator: Matched-cost frontier for held-out single-input history response error and interval coverage,
    with equal observation/prior rights and optimized interleaved active single-target comparators.
  positive_value: Establish a validated efficient many-input dynamic measurement regime with a specific mechanism.
  null_value: Determine when ordinary scheduling suffices and which extra observation is needed for mechanistic
    identifiability; null is not automatic venue readiness.
  closest_closed_route: null
  substantive_difference: Native labelled synaptic history design, not generic calibration transfer or learned-MC
    policy relabeling.
  screen_status: deferred
  decision_stage: F1
