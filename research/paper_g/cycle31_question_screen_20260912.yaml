- id: g31_transient_energy_gain
  archetype: measurement_method
  source_lane: cross_domain_theorem_with_market_specific_obstruction
  native_object: Finite-time perturbation kinetic-energy amplification about a fixed incompressible shear-flow base
    state.
  action: A small divergence-free initial velocity perturbation with fixed physical energy.
  response: Maximal energy gain at a fixed physical lead time, with amplitude and refinement limits kept separate.
  rivals:
    H1: Stable long-rollout surrogate accuracy also retains the physically available transient amplification.
    H0: Incremental contraction or spectral regularization suppresses shear-production amplification despite stable-looking
      rollouts.
  discriminator: Matched-state comparison of the reference and surrogate finite-time energy-gain operators against
    a classical nonnormal reference.
  positive_value: Quantify a physically consequential response blind spot and a calibration requirement for stability
    claims.
  null_value: Establish that the tested stabilization preserves a demanding perturbation response; constrain claims
    of a generic tradeoff.
  closest_closed_route: paper_g_physical_history_impulse_response
