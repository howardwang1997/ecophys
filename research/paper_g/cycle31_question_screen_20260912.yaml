- id: g31_thermal_budget_intervention
  archetype: empirical_intervention
  source_lane: market_native_action_or_constraint
  native_object: Heat transport in a physically controlled Rayleigh-Benard cell with distributed lower-wall heating.
  action: Redistribute boundary heating while matching either total supplied heat or mean boundary temperature under
    an explicitly chosen experimental protocol.
  response: Heat flux and temperature difference jointly, with the physical power budget retained.
  rivals:
    H1: A controller's reported transfer improvement survives an equal-input-power intervention.
    H0: The advantage depends on the boundary-condition or power constraint used in evaluation.
  discriminator: A lawful physical intervention that separates heat throughput from temperature-drop reduction at
    the same input power.
  positive_value: Determine an experimentally meaningful transfer target for a learned controller.
  null_value: Establish that a claimed benefit is conditional on its original boundary contract.
  closest_closed_route: paper_g_physical_history_impulse_response
  substantive_difference: Physical thermal boundary assignment and energy-budget response, not surrogate history
    or solver differentiation.
  screen_status: quick_closed
  decision_stage: F1
  decision_reason: Equal-power stationary heat throughput is fixed by balance; temperature drop or resistance is
    the useful endpoint. Two inspected anchors are DNS rather than the frozen physical assignment.
