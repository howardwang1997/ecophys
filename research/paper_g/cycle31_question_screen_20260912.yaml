- id: g31_resolved_energy_backscatter
  archetype: theory_mechanism
  source_lane: cross_domain_theorem_with_market_specific_obstruction
  native_object: Resolved kinetic energy of an unforced spectrally truncated Navier-Stokes field with exchange across
    the cutoff.
  action: Change the unresolved triad phase at fixed modal energies, cutoff and viscosity.
  response: Instantaneous resolved-energy production and compatibility with a pathwise dissipation constraint on
    a closure.
  rivals:
    H1: Unforced full-field dissipation licenses enforcing monotone resolved energy for every coarse state.
    H0: Transfer from unresolved modes can increase resolved energy while total energy still decreases.
  discriminator: One legal energy-exchanging Fourier triad at matched spectrum with opposite interscale-transfer
    signs.
  positive_value: Delimit which energy inequalities a coarse neural closure may legally enforce.
  null_value: Identify the additional conditions under which a dissipative closure restriction is physically valid.
  closest_closed_route: paper_g_numerical_teacher_continuum_ranking
