- id: g31_actuator_reflection_intervention
  archetype: empirical_intervention
  source_lane: market_native_action_or_constraint
  native_object: Physical opposed-jet or paired-flap actuation of a nominally reflection-symmetric cylinder wake.
  action: Randomized sign reversal of the command under a reflection-balanced initial ensemble and fixed amplitude
    and timing.
  response: Even drag and odd lift response components with measured actuator output and wake phase.
  rivals:
    H1: Persistent reversal residual comes from actuator or plant asymmetry missing from the nominal simulator.
    H0: The residual disappears when initial-phase imbalance and command-to-actuation differences are controlled.
  discriminator: A physical randomized command-reversal design with pre-state/phase and actuator calibration sufficient
    for the stated ensemble response.
  positive_value: Identify a bounded simulator-to-hardware symmetry mismatch relevant to control transfer.
  null_value: Validate the symmetry-based transfer assumption for the tested physical intervention.
  closest_closed_route: paper_g_physical_history_impulse_response
  substantive_difference: Ensemble physical symmetry intervention with actuator calibration; no hidden-state reconstruction
    or synthetic field-reset claim.
  screen_status: quick_closed
  decision_stage: F1
  decision_reason: Physical reflection is not automatically command negation. Selected physical abstracts do not
    establish the required calibrated odd actuation and reflection-balanced randomized assignment.
