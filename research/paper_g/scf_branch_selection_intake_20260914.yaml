analytic_controls:
- name: Stationarity is not global branch selection
  status: standard_control_not_new_theorem
  statement: For two admissible self-consistent fixed points P_a and P_b of the same fixed electronic approximation,
    R(P_a)=R(P_b)=0 can coexist with E(P_a)<E(P_b). If the chosen SCF map preserves both points, a trajectory-gradient
    loss is zero for either constant trajectory.
  scope: Conditional control only. DIIS history, occupation rules and admissible spin space must be specified;
    not every stationary excited determinant is a fixed point of an Aufbau solver.
  implication: Residual tolerance or local stability alone is not a global energy certificate. This does not
    establish that any reviewed ML model selects an undesired branch.
