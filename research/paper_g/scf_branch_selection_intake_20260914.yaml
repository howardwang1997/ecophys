findings:
- Generic SCF acceleration and learned fixed-point inference have direct learning parents.
- Classical multiple-solution search is established; residual versus target-state selection is not itself a
  new contribution.
- TRIP50 provides a concrete triplet initialization-comparison lead and strong classical alternatives.
- A converged density at a different functional can be a useful initializer, but using a target-validated branch
  to select that density spends target information.
- Within-functional solution quality and higher-level thermochemical accuracy require separate response definitions.
decision: Do not escalate generic learned SCF initialization or a residual-versus-energy observation. Retain
  TRIP50 as a bounded source lead for a specific branch-selection cost comparison; no family closure or candidate
  status.
next_step: Audit TRIP50 published methods and supplement descriptions for exact same-geometry/functional/charge/spin
  branch pairs and initializer selection costs. Determine whether a target-outcome-blind operation remains
  beyond fixed classical guesses, density transfer and metadynamics. Stop if only a generic learned search
  ranking is specified.
comparison_contract:
- Fix nuclear geometry, basis, functional, charge, electron number, spin constraints and occupation rules.
- Separate orbital stability within the admissible ansatz from changes of ansatz or multiplicity.
- Use within-approximation branch energy/identity for selection; correlated thermochemical references answer
  a different question.
- Count initialization, every search attempt, Fock builds, stability checks, reference-functional solves, inference
  and training amortization.
- Allow strong classical guesses and density-transfer baselines; target-validated initializer selection is
  not free.
- A best-found state is not automatically a certified global minimum; define ties and unresolved reference
  cases prospectively.
reading_depth: Four retained works at unequal depth, not four full reviews. Indexed incidental hits and the
  earlier TRIP50 preprint are not additional independent lineages.
