analytic_controls:
- id: C1_common_clock_rescaling
  result: For fixed length-specific state spaces, energy landscapes and extension maps, with Q_n=k0*L_n and
    dwell tau_n, each propagator is exp(k0*L_n*tau_n). Simultaneously scaling k0 by alpha and every dwell by
    1/alpha preserves all length-indexed propagated distributions.
  scope: Standard kinetic-clock control, already consistent with DrTransformer discussion. Measured physical
    dwell times break this ambiguity. It does not show that arbitrary pulse protocols, known-clock data, or
    all observables are equivalent.
  new_theorem: false
findings:
- Generic cotranscriptional and pause-aware kinetic prediction already have direct computational parents.
- Existing ML first-passage-time approximation has target-condition simulation context; it is a different information
  contract from predicting a new pause intervention.
- Linked-multipoint chemical probing links a population preparation and subsequent chase but does not pair
  individual molecules across measurements.
- A fixed-sequence physical-time pause intervention panel was not established from the selected sources; proposed
  future protocol extensions were not promoted to existing datasets.
decision: Retain the photoreversible release-and-probe asset lineage. Stop generic pause-aware modelling or
  few-sample CDF acceleration claims. No distinct supported learning contribution is yet formed; no broad RNA-family
  closure.
next_step: Before generating another RNA candidate, read the primary single-molecule SRP refolding reference
  cited by TECprobe-LM (Fukuda et al., reference 18) and determine its pause/control, force and timing scope.
  This is a bounded source-qualification follow-up, not experiment or data-access authorization.
required_comparators:
- DrTransformer or a pseudoknot-capable kinetic parent as appropriate, with matched physical clock and RNA
  availability
- Sequence-only or equilibrium models as diagnostic baselines, not the sole competitors
- Data-assisted R2D2 only with its target-reactivity information explicitly counted
- KinPFN only for a distribution-estimation subtask with matched context samples, not claimed zero-shot pause
  control
