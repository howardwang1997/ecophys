diagnostics:
- id: radial_kernel_moment_correction
  epistemic_class: standard_paper_only_virial_symmetrization
  identity: g_delta=2*pi*r*K_delta_prime; C_delta=E[1-g_delta(|X-Y|)]; J_prime=-kappa+c*C_delta.
  distinction: Force softening gives D in [0,1]; written potential multiplication adds a logarithmic derivative
    term.
  written_potential_range: D_delta in [-d,1+d], d=abs(log(delta/ell))/2+1/4.
  limitation: Specified mathematical kernel only; no executed-source or full-solution error claim.
- id: bounded_pair_sampling
  epistemic_class: standard_paper_only_concentration_control
  contract: Fixed pointwise generator, fixed kernel and evaluation protocol, n fresh independent pairs.
  bound: abs(C_hat-C)<=R_delta*sqrt(log(2/alpha)/(2*n)) with probability at least 1-alpha.
  cost: 2*n generated samples and n pair evaluations; no measured runtime.
  limitation: One interacting cloud is not iid; resampled empirical law is not continuum truth; no adaptive
    or uniform-time coverage.
- id: softened_persistence_necessary_bound
  epistemic_class: paper_only_development_scalar_bound
  identity: L_delta_shape+c*B*C_delta_b>=-a*J0+kappa*B; B=log(1+a*T).
  consequence: Upper C bound U gives L_delta_shape>=max(0,-a*J0+kappa*B-c*B*U).
  limitation: No upper bound on full velocity residual or vector kernel bias; not a sufficient accuracy certificate.
- id: isotrace_anisotropic_density_control
  epistemic_class: standard_paper_only_moment_nonidentification
  contract: Centered smooth radial reference before singularity, finite J; S=diag(sqrt(1+eta),sqrt(1-eta)),
    eta(0)=0, abs(eta)<1.
  identity: Pushforward preserves initial density,mass,center,J and scalar virial law; covariance eigenvalue
    gap becomes abs(eta)*J.
  limitation: Not a trained-model result and no claim of matched softened pair correction or failure of every
    richer test family.
