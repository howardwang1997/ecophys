analytic_controls:
- id: R1_fixed_pulse_vs_record_information
  result: Two-input linear Gaussian fixed-design inverse Fisher gives per-input variance >=sigma^2/n_i at fixed
    pulse counts. Three-pattern four-pulse design costs fewer records but has 4/3 variance penalty versus four
    isolated records. Local Schur complement extends the conditional nuisance comparison, not a universal information
    ordering or timing-feasibility claim.
  new_theorem: false
- id: R2_interleaved_recovery_schedule
  result: For independent time-homogeneous inputs with period Delta>=2w and compact occupancy w, offset trains
    by Delta/2 preserve own histories while sharing a single-target instrument. Startup offset remains; dense
    bursts, real tails and coupled/drifting states are outside this exact toy.
  new_theorem: false
decision_basis: No concrete history-design information/cost regime beyond known dynamic models, capable interleaved
  design and physical parallel mapping; matched dynamic reference unqualified. Restricted controls do not prove
  impossibility, and empirical learning benefits remain eligible.
