analytic_controls:
- name: Chirality-preserving pool coupling makes ee correlation nonunique
  status: standard_constructive_control_not_new_theorem
  construction: An active enantiomer pair A_R,A_S exchanges rapidly with an off-cycle pair X_R,X_S, with X_R=q
    A_R and X_S=q A_S for the same positive q. Then ee_X=ee_A. If mirror catalysts have equal turnover magnitude
    and opposite intrinsic selectivity epsilon under the compared steady conditions, ee_product=epsilon ee_A=epsilon
    ee_X.
  implication: Both an active and an off-cycle measured pool can correlate linearly with product ee. Changing
    total loading or feed ee does not resolve the assignment if it preserves the same symmetric relation.
  scope: An explicit admissible generic limiting model, not a proposed alternative mechanism for the retained
    copper reaction. Requires independent differential perturbation, kinetic evidence or state-specific evidence
    for identification; the copper work already uses additional modalities.
findings:
- Nonlinear ee shape is not unique to catalyst aggregation; classical cascade and competition models already
  cover relevant alternatives.
- Catalyst concentration and reaction-order discrimination are already proposed in the cascade parent.
- Linear species-ee/product-ee correlation alone does not uniquely locate turnover-active species; coupled
  off-cycle pools supply a standard counterexample.
- The copper source supports its mechanism with several modalities, not correlation alone; no empirical refutation
  established.
- QMS preparation and reaction progress are different observation protocols.
- Few-example selectivity prediction has an ML parent that includes catalyst loading, but its target is not
  signed mechanism identification.
decision: No same-native-object unresolved mechanism fork or distinctive learning contribution established.
  Stop generic NLE curve diagnosis as a new formulation; retain explicit intervention and measurement distinctions.
  No asymmetric-catalysis-wide closure.
next_step: Seek a concrete question with an independent discriminating observation rather than relabeling existing
  concentration/ee diagnostics or a generic mechanism classifier.
comparison_contract:
- Keep substrate, reaction network, catalyst nuclearity and ligand coordination separate.
- Match catalyst loading, ligand ee, ligand/metal ratio, conversion, time and substrate concentration.
- Do not identify an active intermediate from ee correlation alone.
- Qualify isotope-labelled ligand equivalence and ion-response assumptions for QMS.
- Do not treat diluted pre-coordination QMS as automatically identical to reaction-state speciation.
- Distinguish high-selectivity classification from signed ee surface prediction and mechanistic identification.
reading_depth: Four works at unequal selected-reading depth; no full supplement/model neighborhood. Other indexed
  papers are discovery leads only.
