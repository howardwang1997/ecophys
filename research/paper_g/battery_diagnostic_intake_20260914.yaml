analytic_controls:
- id: C1_diagonal_generator_reduction
  result: For A=-diag(softplus(theta_i)), 1^T exp(At) v0=sum_i v0_i exp(-d_i t). Same sampled least-squares
    objective as joint positive-rate multi-exponential fitting, with identical amplitude/offset constraints.
  scope: Exact arithmetic/function class; does not establish optimizer or finite-precision performance equivalence,
    or refute general non-diagonal LGNs.
  new_theorem: false
- id: C2_stability_not_identifiability
  result: For d>epsilon>0 and positive half amplitudes, f_epsilon(t)=exp(-d t)cosh(epsilon t). On [0,T], 0<=f_epsilon-f_0<=exp(-d
    t)*(epsilon*t)^2*cosh(epsilon*T)/2. At epsilon=0 rate separation has zero first derivative and coincident
    amplitudes are not separately identifiable.
  scope: Elementary close-mode sensitivity control; not measured noise, empirical algorithm failure, or proof
    of nonidentifiability of all distinct finite exponential mixtures.
  new_theorem: false
findings:
- Generic rapid diagnostic inference and degradation-mode validation already have direct parents.
- Battery LGN diagonal parameterization reduces to positive-rate exponential fitting; appropriate baseline
  must share constraints and initialization information.
- EIS reconstruction includes a learned map on other cells, distinct from fitting a pulse without paired training
  labels.
- Published effective-mode/window dependence must be acknowledged rather than presented as newly discovered.
- A diagnostic schedule intervention and independent latent mechanism reference were not qualified; no universal
  dataset-absence claim.
required_comparators:
- Joint positive-rate exponential fitting with matched order, offset, amplitudes, window and weighting
- Same warm-start/history information and fair optimization budget
- Direct pulse-to-EIS baseline with identical paired training cells
- Full conditioning and physical endpoint scope appropriate to the claimed target
decision: Stop generic learned-stable-relaxation/rapid-diagnostic intake. Preserve exact reduction and paired-source
