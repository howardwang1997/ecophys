diagnostics:
- id: kinetic_finite_path_entropy
  epistemic_class: standard_paper_only_girsanov_specialization
  hypotheses: Common initial law and fixed unconstrained unit-mass Langevin bath; perturbation (0,r) in noise
    range; well-posed nonexplosive laws and valid exponential martingale.
  identity: KL(P1_H||P0_H)=E1 integral_0^H |r|^2/(4*gamma*Tb)dt; <=H*R^2/(4*gamma*Tb) for |r|<=R.
  limitation: No force-component separation, generic training-RMSE substitution, spectral-tail control or finite-sample
    confidence guarantee.
- id: bounded_response_and_uncapped_tail
  epistemic_class: standard_paper_only_information_control
  hypotheses: Finite-horizon path KL K; fixed hitting target and censoring horizon H.
  identity: Hit probability error<=min(1,sqrt(K/2)); capped mean-time error<=H*min(1,sqrt(K/2)). Times H+1
    and H+L have identical caps and different uncapped means.
  limitation: Capped times are controls, not replacements for velocity-correlation spectrum or infinite-time
    diffusion. Unbounded velocity products require moments and spectral tails require decay bounds.
- id: matched_integrator_support
  epistemic_class: standard_paper_only_splitting_parent_instantiation
  hypotheses: One-dimensional unit-mass BAOAB/ABOBA, fixed pre-state,h>0,gamma>0,Tb>0; F0=-k*q,F1=F0+epsilon*tanh(q),k>0,epsilon!=0.
  identity: 'BAOAB: vprime+v-2*(qprime-q)/h=h*(F(qprime)-F(q))/2; common transitions require qprime=q, a zero-probability
    event. ABOBA common line qprime=q+h*(v+vprime)/2 with Gaussian conditional KL h^2*(1+c)^2*r(qmid)^2/[8*Tb*(1-c^2)],c=exp(-gamma*h).'
  limitation: Known integrator-support mechanism; two conservative forces, no new nonconservative effect or
    actual checkpoint/implementation claim. Discrete-kernel exactness is not continuum-response exactness.
- id: bath_quadratic_variation
  epistemic_class: standard_paper_only_path_law_control
  hypotheses: Full continuous velocity paths for constant standard unit-mass Langevin baths.
  identity: '[v_i,v_j]_H=2*gamma*Tb*H*delta_ij; different gamma*Tb implies singular full path laws.'
  limitation: Equal noise covariance only removes this obstruction; friction integrability and finite sampled
    transition laws still need separate analysis.
