findings:
- Physical time and force are explicit parts of the retained SRP estimand.
- Preservation of main trajectory shape after duration normalization can coexist with changing dwell times.
- Different RNA objects and different response summaries are not opposite results for one intervention.
- Published vectorial pre-folding mimic is useful within its own preparation protocol; transport to RNAP pause
  timing needs additional support.
- A difference in reported sequence length or pause coordinate alone does not establish a sequence or site
  mismatch; full alignment is needed.
decision: No matched primary disagreement or distinct learning advantage established. End this generic RNA
  pause-prediction source chain; retain assay-specific controls without closing RNA research.
