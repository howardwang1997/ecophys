diagnostics:
- id: paired_moments_and_relaxation_time
  epistemic_class: elementary_paper_only_statistics_and_stable_flow_control
  paired_mean_bound: norm(mean(X)-mean(Y),2)<=RMSE.
  paired_std_bound: norm(std_population(X)-std_population(Y),2)<=RMSE via column norms and the centering projection.
  flow_twin: x_dot=-epsilon*x versus x_dot=epsilon*(1-x),x0=0,epsilon>0.
  finite_window: State discrepancy<=epsilon*T; exact equal drift derivatives.
  long_run: Physical measures delta0 and delta1 have coordinate W1 distance1.
  conservation: Add y=1-x; both flows preserve the nonnegative unit simplex.
  scope: A varying-relaxation-rate family defeats a uniform conclusion, not a fixed-margin or uniformly hyperbolic theorem.
- id: sampled_ou_actuation_alias
  epistemic_class: classical_paper_only_system_aliasing_and_linear_sde
  generator: A_k=-gamma*I+(2*pi*k/tau)*J;J=[[0,-1],[1,0]],gamma,sigma,tau>0.
  observations: Full state at integer multiples of the same physical tau; identical sampled kernels and all sampled path laws under a common initial law.
  mean_map: exp(tau*A_k)=exp(-gamma*tau)*I.
  noise_covariance: sigma^2*(1-exp(-2*gamma*tau))/(2*gamma)*I.
  held_gain: (1-exp(-gamma*tau))*(gamma*I+omega_k*J)/(gamma^2+omega_k^2).
  discriminator: Same held physical force in coordinate1 has a nonzero coordinate2 response for k!=0 but zero for k=0.
  null: Grid-time instantaneous resets have identical subsequent sampled responses for every k.
  scope: Does not establish aliasing in the published triad or a failure of the cycle29 instantaneous-reset control; generator frequency assumptions and intervention timing matter.
