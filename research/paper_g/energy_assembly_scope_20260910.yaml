diagnostics:
- id: boundary_curvature_diffusion_trial_control
  epistemic_class: standard_paper_only_variational_calculus
  hypotheses: Unit interval harmonic field xU; epsilon,omega>0; boundary-exact q=xU+epsilon sin(omega U) sin(pi
    x); exact spatial integration.
  identity: E_q=U^2/2+pi^2 epsilon^2 sin^2(omega U)/4; E_q_second=1+pi^2 epsilon^2 omega^2 cos(2 omega U)/2.
  null_result: Every global minimizer under boundary load f remains within pi epsilon/sqrt(2) of f, despite
    possible negative local curvature.
  limitation: Omega changes the representation, not physics. No learned-model result or physical instability;
    solver convergence and global approximation are separate estimands.
- id: boundary_linear_lift_gram_and_condensation_control
  epistemic_class: standard_paper_only_static_condensation
  hypotheses: Fixed self-adjoint quadratic physical K>=0 with K_ii>0; zero volume forcing, exact trace, linear
    interior lift R U.
  identity: S_hat=[I;R]^T K[I;R]=S+(R-R*)^T K_ii(R-R*)>=S; R*=-K_ii^(-1)K_ib.
  null_result: An energy need not be learned directly to retain convexity; geometry dependence may be nonlinear
    while the boundary map remains linear.
  limitation: Null modes require reproduction by the lift; forcing needs affine terms; no fast algorithm, cost
    parity, nonlinear-physics or continuum guarantee.
