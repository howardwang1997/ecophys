source_verdicts:
  neural_emulator_superiority: Direct trained-emulator and benchmark-fidelity parent; specific regimes, not universal; selected advection has analytic truth, Burgers uses a more converged discrete reference.
  deepfdm: Different competing methods, coefficient and input laws, and reference contract; no matched negative teacher-superiority test.
  chonknoris: Known residual and learned inverse iteration; selected benchmark errors use numerical Newton-Kantorovich references, not a certified continuum error.
  predicting_change: Changed derivative labels and numerical integration; does not supply a universal teacher-fidelity lower bound or a matched contradiction.
scope_correction: Published trained-model existence is established elsewhere; repository-specific prevalence and independently frozen broader regimes remain unresolved.
diagnostics:
- id: projection_teacher_risk
  epistemic_class: elementary_paper_only_approximation_theory
  assumptions: H=L2(mu;Y),v=u+delta,closed linear hypothesis subspace with orthogonal projection P; population squared loss.
  identity: norm(P*v-u)^2-norm(v-u)^2=norm((I-P)*u)^2-norm((I-P)*delta)^2.
  null: P=I gives equality.
  limit: No finite-sample, nonlinear-architecture, optimizer or rollout prediction.
- id: rollout_exact_fit_and_defect
  epistemic_class: elementary_paper_only_induction_and_lipschitz_bound
  exact_control: F=T on all teacher states reachable from the initial support through the declared horizon implies identical rollouts.
  approximate_control: Uniform teacher-state defect eta and Lipschitz F with constant L on both trajectory regions give norm(F^t(x)-T^t(x))<=eta*sum_(j=0)^(t-1)L^j.
  limit: Equal initial laws or small average one-step training loss alone do not establish full reachable-state coverage or uniform constants.
