questions:
- id: G23-01
  route_id: paper_g_swing_cost_recovery_broad
  archetype: theory_mechanism
  source_lane: market_native_action_or_constraint
  native_object: Common transaction NAV for predetermined gross fund share subscriptions and redemptions.
  rivals:
  - Properly calibrated net-flow charges protect stayers despite an opposite-side benefit.
  - That benefit necessarily prevents complete cost recovery.
  discriminator: Balance assets and shares under the same realized cost and exact price rule.
  positive_value: Establish the conditional cost-neutrality rule.
  null_value: Identify the missing charges or binding policy constraint.
  minimal_truth: Share versus amount orders, pre-cost NAV, actual cost under induced execution, all cash flows and price rule.
  source_refs: [cycle23_sec_swing_2016, cycle23_roncalli_liquidity_part3]
  diagnostic_refs: [A_net_cost_accounting]
  stage: F1
  disposition: deduplicated
  terminal_gate: direct_primary_collision_at_f1
- id: G23-02
  route_id: paper_g_swing_accounting_volatility_broad
  archetype: measurement_method
  source_lane: market_native_action_or_constraint
  native_object: Published fund NAV returns under a signed swing factor.
  rivals:
  - Extra quoted-price variance represents additional underlying portfolio variation.
  - The pricing factor can account for it without that underlying variation.
  discriminator: Return decomposition and admissible same-price factorization paths.
  positive_value: Validate separation of economic-value variation from accounting variation.
  null_value: Specify the additional pricing-factor record and narrower estimand needed.
  minimal_truth: Swung and unswung valuation clocks and exact factor; a causal policy effect additionally needs counterfactual portfolio assignment.
  source_refs: [cycle23_bis_lewrick_schanz, cycle23_roncalli_liquidity_part3]
  diagnostic_refs: [B_price_factorization]
  stage: F1
  disposition: deduplicated
  terminal_gate: direct_primary_collision_at_f1
- id: G23-03
  route_id: paper_g_swing_liquidity_provision_broad
  archetype: theory_mechanism
  source_lane: market_native_action_or_constraint
  native_object: Contract payment divided by direct-liquidation value at fixed portfolio, fundamentals and outflow.
  rivals:
  - Swing pricing must improve this conditional liquidity-provision index.
  - Incorporating liquidation costs lowers it in some solvent states.
  discriminator: Evaluate the published two payment rules on one feasible frozen state.
  positive_value: Establish the conditional contract benefit before portfolio and run responses.
  null_value: Delimit that benefit and distinguish endogenous from fixed-state comparisons.
  minimal_truth: Exact payment contract, portfolio, liquidation discount, outflow and value benchmark; equilibrium claims require optimality and selection.
  source_refs: [cycle23_ma_xiao_zeng, cycle23_bis_lewrick_schanz, cycle23_diamond_dybvig_context]
  diagnostic_refs: [C_conditional_lpi]
  stage: F1
