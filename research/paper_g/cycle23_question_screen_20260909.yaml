  archetype: empirical_intervention
  source_lane: market_native_action_or_constraint
  native_object: Investor withdrawals during stress under an assigned exact fund-pricing rule.
  rivals:
  - Cost-sensitive redemption pricing reduces first-mover-driven withdrawals.
  - Selection and common stress explain the apparent reduction.
