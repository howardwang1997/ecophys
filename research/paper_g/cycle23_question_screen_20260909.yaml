diagnostics:
- id: A_net_cost_accounting
  epistemic_class: elementary_paper_only_accounting
  identity: p_after = p + (n*delta - C)/(N+n), n=S-R
  neutrality_condition: n*delta=C
  assumptions: Predetermined share quantities, one positive transaction price, positive remaining shares, no other cash flows; cost evaluated under induced execution.
  fixture: {N: 100, p: 100, R: 20, S: 10, C: 20}
  gross_denominator_rule: {transaction_price: 99, net_cost_retained: 10, stayer_nav: '899/9'}
  net_denominator_rule: {transaction_price: 98, net_cost_retained: 20, stayer_nav: '100'}
  interpretation: Subscriber benefit can coexist with complete net cost recovery; the two denominator rules are different treatments.
  limitation: Not a current legal rule, equilibrium policy, unknown-cost solution or original theorem.
- id: B_price_factorization
  epistemic_class: elementary_paper_only_measurement_guardrail
  identity: rP=rV+Delta(log(1+s))
  observed_P: [100, 99, 100]
  toy_factor_magnitude_limit: '0.02'
  common_flow_direction: net_redemption
  path_A: {s: ['-0.01', '-0.01', '-0.01'], V: 'P/0.99'}
  path_B: {s: ['-0.01', '-0.0199', '-0.01'], V: 'constant 100/0.99'}
  interpretation: Same published prices and flow direction with different underlying returns.
  limitation: Different unobserved value/cost paths; no same-full-state equilibrium or current legal-cap claim; no new latent recovery route.
