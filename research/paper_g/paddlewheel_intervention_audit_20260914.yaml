analytic_controls:
- id: C1_classical_mass_intervention_scope
  status: standard_canonical_momentum_integral_not_new_theorem
  construction: For unconstrained classical H_M(q,p)=U(q)+p^T M^{-1}p/2, fixed positive coordinate-independent
    mass matrix M, fixed temperature and same coordinate measure, integrating momenta gives rho_M(q) proportional
    to exp(-beta U(q)); the factor det(M)^(1/2) cancels on normalization.
  implication: Changing physical framework masses at fixed U can preserve the canonical configurational ensemble
    while changing dynamics. Freezing coordinates instead conditions/restricts the coordinate ensemble and
    is not the same intervention.
  limitation: Does not apply unchanged to nuclear quantum equilibrium, coordinate-dependent mass/constraints,
    an unrelaxed glass preparation, or finite trajectories failing to sample the ensemble. A barostat cell
    inertia is not a framework atomic mass. No material-specific mass-control asset verified.
- id: C2_gate_speed_first_passage
  status: standard_two_state_first_passage_control_not_new_theorem
  construction: Before absorption, a gate switches C<->O at rate gamma in each direction, so its unabsorbed
    stationary open probability is 1/2 for any gamma. A crossing occurs at rate k only in O. Backward equations
    give T_C=1/gamma+T_O and T_O=1/(gamma+k)+gamma*T_C/(gamma+k), hence T_O=2/k and T_C=2/k+1/gamma. Starting
    from the gate equilibrium mixture gives E[T]=2/k+1/(2*gamma).
  implication: A kinetic intervention changes first-passage time without changing the stationary gate distribution
    and without any explicit propulsive rotation. Mass/clock sensitivity alone does not select a unique mechanism.
  limitation: A minimal Markov first-passage control, not a conductivity formula, physical isotope prediction
    or demonstrated microscopic model of a named electrolyte. gamma is a tunable gate rate, not an asserted
    function of atomic mass.
decision: The named dispute is real, but mechanism labels, angle/event definitions and glass preparation differ.
  No matched intervention prediction and distinctive learning task formed. Generic event classification has
  a direct parent; a mass-response contrast alone is not a mechanism identifier. No broad electrolyte closure.
next_step: Stop the current generic paddlewheel/classification source chain. Revisit only with explicit competing
  predictions for the same material, preparation and physical intervention plus a concrete learning gain beyond
  quaternion event analysis and trajectory transport models. The mass-only control is not yet a qualified truth
  asset.
comparison_contract:
- Distinguish full symmetry rotation, libration and quasipermanent occupancy-linked reorientation without assuming
  a single universal angle cutoff.
- The 2024 primary analyzes several angle thresholds; the 2025 comment is not proof of a 120-degree-only analysis.
- Match glass density, preparation, phase, temperature and event denominator before using disagreement as a
  fork.
- Separate correlation/timing, relaxed migration barriers, dynamic first passage and collective charge conductivity.
- Physical framework masses, auxiliary cell inertia and frozen coordinates are different interventions.
- Classical equilibrium mass invariance does not guarantee matched finite-time glass ensembles.
- A change in kinetic response under a distribution-preserving perturbation does not by itself distinguish
  momentum transfer from passive gating.
