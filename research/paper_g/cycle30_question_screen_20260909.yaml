diagnostics:
- id: A_upwind_ranking_control
  epistemic_class: elementary_paper_only_valid_numerical_scheme
  system: Periodic advection; lambda=c*dt/h in(0,1]; band-limited initial fields resolved on all grids.
  multiplier: g=1-lambda+lambda*exp(-i*k*h); abs(g)^2=1-4*lambda*(1-lambda)*sin(k*h/2)^2.
  modified_equation_diffusion: c*h*(1-lambda)/2 to leading order.
  ranking: Prediction u+alpha*delta has teacher loss(alpha-1)^2*norm(delta)^2 and continuum loss alpha^2*norm(delta)^2.
  nulls: Constant mode; lambda=1 exact shift at step times; consistent refinement at fixed physical time.
  limit: Stipulated predictors, not trained-model results; no source error asserted for PDEBench.
- id: B_shared_reference_bias_twin
  epistemic_class: elementary_paper_only_squared_loss_identity
  identity: D_v-D_u=-2*inner(a-b,delta), with v=u+delta.
  bound: abs(D_v-D_u)<=2*norm(a-b)*epsilon if norm(delta)<=epsilon is certified.
  twin: a=1,b=-1,v1=v2=0,u=+epsilon or-epsilon gives opposite D_u=-4*u despite identical references.
  null: inner(a-b,delta)=0 leaves pairwise ranking unchanged.
  limit: Bound-crossing interval is inconclusive, not proof of a reversal; separate statistical and selection uncertainty.
- id: C_noisy_truth_identity
  epistemic_class: elementary_paper_only_conditional_expectation
  assumptions: Frozen predictions; fresh oracle conditional mean u; finite covariance Sigma.
  estimator: norm(a)^2-norm(b)^2-2*inner(a-b,Y).
  variance: 4*(a-b)^T*Sigma*(a-b).
  residual_bias: If conditional mean is u+beta, bias is-2*inner(a-b,beta); more walks do not necessarily remove beta.
  limit: No novel debiasing theorem or qualified finite-cost unbiased WoS oracle.
