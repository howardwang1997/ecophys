analytic_controls:
- id: C1_stable_enrichment_not_error_upper_bound
  assumptions: Known finite connected reversible network; each undirected edge counted once. Conductances A-x=x-B=1,
    A-y=y-B=M>0, A-z=w>0. Trial boundary values A0,B1.
  calculation: Exact committor x=y=1/2,z=0, capacity C=(1+M)/2. Trial x=1/2,y=0,z=theta has E=1/2+M+w*theta^2.
    Strict enrichment from theta fixed0 to theta free[0,1] leaves optimum unchanged, yet E-C=M/2.
  dual_control: Unit flow only along A-x-B has dissipation2 and lower capacity bound L=1/2. Valid full-graph
    upper U=M+1/2 gives gap M. Omitting the y branch from U instead gives a reduced-network quantity, not a
    full-network upper bound.
  scope: Standard exact counterexample to generic stopping inference, not an observed neural-model failure,
    new theorem or molecular result.
- id: C2_clock_information
  assumptions: Finite irreducible reversible continuous-time chain with generator Q, stationary law pi; scalar
    c>0.
  calculation: Q and cQ have identical pi, committor and embedded jump-chain transition probabilities; capacities
    scale by c and hitting times by1/c.
  scope: Geometry or untimed jump sequences alone do not fix physical rates. Does not apply to identical fully
    timed paths; Reactive Flux Matching uses time information and weighted ensemble, so this is not a refutation
    of that work.
unresolved: Finite-budget globally valid integration and unit-flow construction in a specified molecular dynamics
  model; distinct learning advantage versus classical solvers and established adaptive rate methods.
scope_of_bounds: Exact full-target functionals with admissible boundary/flow constraints bound model capacity.
  Sample estimates need justified integration uncertainty and support. Physical rate additionally needs a valid
  clock and specified population/initial-law convention; capacity is not universally inverse MFPT.
baseline_scope: Finite network linear solver and classical primal/dual estimators; molecular learned-current/committor
  plus weighted ensemble or established rate sampler. Neural parameterization alone is not a contribution.
