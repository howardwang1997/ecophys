diagnostics:
- id: A_goal_error_product_bound
  epistemic_class: elementary_paper_only_weak_equation_identity
  assumptions: V=H_0^1; symmetric uniformly elliptic diffusion; f in L2; fixed conforming predictions; valid constants and continuous integrals.
  target: D(u)=C-J(u), C=norm(m1)^2-norm(m2)^2, J(w)=2*inner(m1-m2,w) in continuum L2.
  adjoint: B(w,z)=J(w); R_v(w)=ell(w)-B(v,w).
  identity: D(u)-[C-J(v)-R_v(z_tilde)]=-B(u-v,z-z_tilde).
  radius: Certified primal and dual energy-error bounds E_p*E_d; add certified center-integration error.
  majorant: E_p=norm(kappa^(-1/2)*(q-kappa*grad(v)))+C_F/sqrt(kappa0)*norm(f+div(q)); q in H(div).
  dual_majorant: Same construction with z_tilde, dual flux and load2*(m1-m2).
  nulls: Exact primal or exact adjoint removes remainder; identical predictions tie.
  limits: Existing DWR/functional-error method; no Galerkin orthogonality assumed; no universal cost gain or nonlinear extension.
- id: B_energy_vs_L2_rank_twin
  epistemic_class: elementary_paper_only_Poisson_metric_control
  system: -u''=sin(x) on(0,pi), zero boundary; u=sin(x); integral normalization2/pi.
  predictions: m1=u+0.5*sin(3*x); m2=u+sin(x).
  L2_squared_errors: [0.25, 1.0]
  energy_squared_errors: [2.25, 1.0]
  energy_difference: B(m1,m1)-B(m2,m2)-2*ell(m1-m2), computable from PDE data.
  limit: Energy-risk ordering is a different target and cannot replace L2 ordering.
- id: C_finite_node_integration_control
  epistemic_class: elementary_paper_only_quadrature_counterexample
  system: -u''=f on(0,1), zero boundary; prescribed finite nodes x_i; f(x)=product_i(x-x_i)^2.
  approximation: v=0,q=0; sampled f^2 vanishes at nodes but integral is positive and u nonzero.
  null: A frozen finite polynomial/band-limited family with a sufficiently exact integration rule.
  limit: Unrestricted-function control, not a failure under an actual paper's fixed function class or protocol.
