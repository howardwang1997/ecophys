analytic_controls:
- id: C1_target_and_sampling_decomposition
  status: standard_expectation_and_error_identity_not_new_theorem
  construction: For fixed protocol theta=(V,D,rho,h), let B(theta)=integral E_D[h(path)|z,V] rho(dz), where
    h specifies product assignment, horizon and censoring. Then B_hat_N(theta)-B(theta_ref)=[B_hat_N(theta)-B(theta)]+[B(theta)-B(theta_ref)].
  implication: Increasing independent trajectories shrinks sampling error for a fixed protocol; it does not
    identify incoming preparation, physical dynamics or reference discrepancy. With correlated trajectories
    the effective sample size also matters.
  limitation: Bookkeeping identity, not a new estimator, chemical result or proof that a published surrogate
    is inaccurate.
- id: C2_equal_kinetic_history_opposite_exit
  status: standard_exact_free_flight_information_loss_control_not_new_theorem
  construction: Unit-mass free particle, V=0, q(0)=(0,0), p(0)=(u,+v) or (u,-v), u,v,L>0. At first crossing
    x=L, y=+vL/u or -vL/u. Both trajectories have identical constant total kinetic energy (u^2+v^2)/2, but
    the sign(y) channel differs. Mixtures with any weight alpha retain the same energy history while the positive-channel
    fraction is alpha.
  implication: Total kinetic-energy histories alone cannot certify a branching distribution; directional phase
    information is lost.
  limitation: Free-flight two-exit control, not a chemically realistic PTSB surface, thermal incoming ensemble,
    new theorem or measured failure of the 2024 model.
decision: Do not advance generic momentum-aware branching prediction or trajectory acceleration as a new topic.
  Direct parents exist; different reactions or incoming preparations do not establish a matched unresolved
  fork. No chemistry-wide closure.
next_step: Require a specific same-reaction intervention separating surface, incoming preparation and propagation
  effects, plus a concrete learning increment beyond existing phase classifiers and force surrogates. Direct-versus-thermalized
  protonation is already discussed by the 2023 parent; merely renaming it is insufficient.
comparison_contract:
- Freeze reaction, isotope/mass, potential surface, incoming preparation and initial measure.
- Separate classical, QCT, ring-polymer and nonadiabatic targets; temperature alone does not make protocols
  interchangeable.
- Specify channel assignment, termination horizon, recrossing and unresolved-trajectory denominator.
- Retain geometry/VRAI, kinetic-energy/RMCF, initial-phase classifiers and force-surrogate parents.
- Separate finite-trajectory precision from protocol accuracy; do not infer failure from an aggregate validation
  observable alone.
- Experimental isotope effects constraining transition-state geometry are not complete phase-space ground truth.
