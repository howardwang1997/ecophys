  independent_replication: No payload or scientific execution; legacy checkpoint output capability is documented
    only, and exact independent physical response is unqualified.
  cost: Archive sizes and one advertised checkpoint size pinned; projection,reference-force,decorrelated-response
    and verification compute cost unqualified.
  stop_rules: No pure-component claim from head subtraction; no new method from stationary mean work,local
    reference-dependent maps,Hodge projection or more model names.
