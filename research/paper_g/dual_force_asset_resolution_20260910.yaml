diagnostics:
- id: dual_head_projection_identity
  epistemic_class: standard_paper_only_hilbert_space_control
  hypotheses: Fixed L2(mu) domain and boundaries,orthogonal gradient projection P; conservative head F_C in
    range(P).
  identity: P(F_D-F_C)=PF_D-F_C; P[F_C+lambda(F_D-F_C)]=(1-lambda)F_C+lambda*PF_D.
  limitation: Pure residual intervention requires F_C=PF_D; shared heads do not imply it. Countercontrol is
    not a measured checkpoint property.
- id: stationary_work_energy_balance
  epistemic_class: standard_paper_only_chain_rule_and_ito_control
  hypotheses: Unit-mass unconstrained inertial Langevin,d velocity dimensions,single fixed bath T,friction
    gamma,smooth single-valued potential,stationary integrable energy.
  identity: W_Uplusphi-W_U=phi(q_t)-phi(q_0); mean[(F_D+gradU)dotv]=gamma*(mean|v|^2-d*T).
  limitation: Mean work adds no independent information to kinetic-temperature excess for this bath. No direct
    GLE/global-rescaling/multiple-bath or discretized-trajectory transfer.
- id: local_work_reference_dependence
  epistemic_class: standard_paper_only_reference_control
  hypotheses: Prior stable rotational OU control, E[qvT]=-(a*s/gamma)J; reference shift phi=b*q1*q2.
  identity: Mean coordinate1 residual work shifts by -b*a*s/gamma,coordinate2 by +b*a*s/gamma; total unchanged.
  limitation: Only arbitrary reference-head residual-work allocation is affected; no objection to independently
    specified physical bath heat or current-based entropy methods.
truth_contract:
  estimands: Pure learned-force component effect on a specified independent physical response; total mean work
    is a separate limited diagnostic.
  assignment_interference: Freeze force,projection measure/domain/boundary; component switch and thermostat
    change are distinct. Shared-head switch is not pure by default.
  lifecycle_replay: Complete potential/force,masses,domain,boundaries,bath law,initial/stationary state,physical-time
    response and all input/model versions before any execution.
  rights_ethics_release: Two declared CC-BY4 archive records and BSD3 model-repository label; only metadata,preview
    inventory and one README fetched; embedded component/runtime rights not audited.
  untouched_confirmation: Absent. Published splits and examples are development-visible, not pristine Paper
