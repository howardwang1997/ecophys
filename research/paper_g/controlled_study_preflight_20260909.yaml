- id: B_release_noise_ITT_identity
  epistemic_class: exploratory_paper_only_estimand_check
  conditions: Z randomized, consistency, specified no-interference condition, random subsample independent of Z and potential outcomes; hypothetical additive release Ystar=Y+eta.
  identity: E[Ystar|Z=1,S=1]-E[Ystar|Z=0,S=1]=tau_S+E[eta|Z=1,S=1]-E[eta|Z=0,S=1].
  mean_preservation_condition: Equal conditional noise means across treatment arms.
  nonimplications: Mean preservation does not certify variance, coverage, nonlinear responses or mediation.
  limit: Standard expectation identity; metadata does not establish the required noise law or differential privacy, nor an additive transformation of every released field.
