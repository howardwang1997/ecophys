questions:
- id: G25-01
  route_id: paper_g_coissuer_redemption_residency_insulation
  archetype: theory_mechanism
  source_lane: market_native_action_or_constraint
  native_object: Fungible coissued coin with region-specific direct redemption and lawful own-account resale.
  rivals:
  - Initial regional token holdings bound regional redemption requests under eligibility restrictions.
  - Eligible buyers import redeemable claims through funded resale, while funding and reserve arrival constrain execution.
  discriminator: Hold eligibility fixed and trace a funded resale followed by redemption requests and horizon cash payments.
  positive_value: Qualify a regional ownership-based protection bound.
  null_value: Identify the funding and transfer states needed for a cash-pressure statement.
  minimal_truth: Ownership and eligibility, compliant sale, buyer cash, request amounts, issuer cash, reserve arrival and payment horizon.
  source_refs: [cycle25_cepr_mci, cycle25_circle_whitepaper, cycle25_circle_redemption]
  diagnostic_refs: [A_funded_resale]
  stage: F1
  disposition: quick_closed
  terminal_gate: direct_prior_redemption_routing_and_elementary_cash_accounting
  interpretation_limit: No equilibrium, welfare, legal enforceability opinion, default prediction or refutation of the full policy argument.
- id: G25-02
  route_id: paper_g_treasury_buyback_ceiling_inventory_relief_novelty
  archetype: empirical_intervention
  source_lane: market_native_action_or_constraint
  native_object: Announced increase in nominal long-end Treasury buyback operation ceilings.
  rivals:
  - A binding ceiling releases additional dealer inventory when raised.
  - A slack ceiling leaves purchases unchanged; other observed changes may reflect expectations or selection.
  discriminator: Establish a purchase first stage under a fixed acceptable-offer schedule before designing a causal contrast.
  positive_value: A first stage would justify further intervention-specific design work.
  null_value: Avoid mistaking policy capacity for realized purchase dose while preserving expectation effects as distinct.
  minimal_truth: Announcement and operation timing, cap, acceptable offers, acceptance rules, actual purchases, pre-state and assignment.
  source_refs: [cycle25_treasury_announcement, cycle25_zhou_buyback]
  diagnostic_refs: [B_capacity_first_stage]
  stage: F1
  disposition: quick_closed
  terminal_gate: direct_prior_inventory_relief_and_unestablished_purchase_first_stage
  interpretation_limit: No causal design qualified or outcome read; no conclusion that all buyback studies or announcement effects are impossible.
diagnostics:
- id: A_funded_resale
  epistemic_class: elementary_paper_only_accounting_derivation
  assumptions: Single batch; fixed offered price and quantity; compliant eligible own-account buyers; no credit, cash recycling, other cash flows or asset sales; par value one.
  purchase_bound: q_max=min(X,K/p)
  requests: L+q for a chosen feasible q
  payments: min(L+q,B+R) under maximal feasible cash service
  pending: max(L+q-B-R,0)
  example: {X: 100, p: '0.99', K: 99, L: 10, B: 30, q: 100, requests: 110}
  reserve_arrival_twins:
  - {R: 0, payments: 30, pending: 80}
  - {R: 80, payments: 110, pending: 0}
  limitation: Purchase feasibility is not a rational equilibrium choice; pending requests are not proof of insolvency. No actual issuer cash state estimated.
- id: B_capacity_first_stage
  epistemic_class: elementary_paper_only_acceptance_derivation
  assumptions: Hypothetical fixed acceptable-offer quantity A and full acceptance up to ceiling M; not the complete Treasury pricing rule.
  purchases: Q(M)=min(M,A)
  cap_example_billions: [2, 4]
  purchase_change: 0 if A<=2; A-2 if 2<A<4; 2 if A>=4
  slack_example: {A: 1, Q_old: 1, Q_new: 1, change: 0}
  limitation: Official new cap is at least4; actual offers and purchases not read. Zero contemporaneous first stage does not rule out expectation effects.
