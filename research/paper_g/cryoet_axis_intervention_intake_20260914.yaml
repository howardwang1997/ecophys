analytic_controls:
- id: C1_two_axis_support
  status: standard_finite_dimensional_inverse_problem_control_not_new_theorem
  construction: For Fourier masks M_A,M_B and volume x, y_A=M_A F x and y_B=M_B F x. If F h is supported where
    both masks vanish, x and x+h have identical paired observations. A sufficiently small real perturbation
    about a strictly positive discretized volume can preserve positivity.
  implication: A second axis tests newly observed support, not the joint missing region. Artificially rotating
    a fixed masked volume does not constitute another physical observation of the same x.
  scope: Ideal finite-grid mask model. No universal nonuniqueness claim for continuous compact-support tomography
    with exact noiseless continuum angles; no biologically qualified membrane-connectivity twin constructed.
- id: C2_frame_thinning_history
  status: standard_acquisition_control_not_new_result
  construction: Let specimen state at cumulative delivered dose D be x(D). A retained frame at D_j observes
    P_j x(D_j)+noise. Discarding other frames leaves D_j unchanged. In the scalar example x(D)=x0 exp(-kD),
    half-frame retention does not replace D_j by D_j/2.
  implication: Match both retained count budget and delivered exposure history for acquisition-policy claims.
    A static specimen k=0 is the exact null; genuine equal delivered-dose schedules or a validated damage model
    are separate comparators.
  scope: Does not estimate damage magnitude or reverse the cited experimental ranking. The source itself discusses
    accumulated dose; this is not a claim of an unreported implementation error.
