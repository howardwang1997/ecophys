analytic_controls:
- id: C1_affine_mutation_null
  result: At fixed pressure, buffer and composition, using unfolding free energy and constant unfolding heat
    capacities, delta-delta-G(T)=a+b*(T-T0)+c*((T-T0)-T*log(T/T0)), where c=delta-delta-Cp. Thus second derivative=-c/T.
    Rejecting a constant offset does not isolate a heat-capacity effect because b can differ at c=0.
  scope: Elementary Gibbs-Helmholtz consequence under equilibrium two-state interpretation. Does not identify
    microscopic origin or prove empirical model failure.
  new_theorem: false
- id: C2_equal_reference_and_melting_point
  result: For distinct positive T0 and Tm, let q(T)=(T-T0)-T*log(T/T0) and r(T)=q(T)-q(Tm)*(T-T0)/(Tm-T0).
    Then r(T0)=r(Tm)=0 and r_second(T)=-1/T. Adding epsilon*r to an admissible constant-Cp stability curve
    preserves its reference free energy and zero at Tm while changing Cp by epsilon.
  scope: For sufficiently small perturbations in an interior admissible family, this is a standard nonuniqueness
    control. It preserves the named root, not every root or all physical constraints for arbitrary epsilon.
    No claim that complete thermograms contain no information.
  new_theorem: false
findings:
- Full curve prediction already has a direct parent; replacing its predictor by a generic protein language
  model is not a specified scientific increment.
- The constant-offset versus curvature fork needs an affine entropy-shift control.
- Comparative mutations already provide evidence for unfolded-state heat-capacity contributions in RNase H;
  the basic mechanism cannot be claimed new.
- Published high-throughput fluorescence screening supplies an assay-specific target; equilibrium Cp coverage
  is not established by the existence of melting curves.
required_comparators:
- Existing full-curve predictor with matched structural and organism information
- Temperature-independent mutant offset and affine-in-temperature mutant effect
- Appropriate sequence/structure predictors at equal training information
- For any mechanism claim, direct thermodynamic constraints beyond a successful temperature prediction
