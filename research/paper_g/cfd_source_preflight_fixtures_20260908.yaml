- id: final_notification_observation_loss
  class: Future-period intended plans in [0,C] with no additional private-history restrictions.
  capacity: 100
  common_final_fpn: 40
  histories:
  - before_auction: 100
    after_auction: 0
    final: 40
    immediate_revision: -100
  - before_auction: 0
    after_auction: 100
    final: 40
    immediate_revision: 100
  general_result: Conditional on identical final public records, immediate revision remains in [-C,C].
  construction: For any d in [-C,C], before=max(-d,0), after=max(d,0); later converge to the common final FPN.
