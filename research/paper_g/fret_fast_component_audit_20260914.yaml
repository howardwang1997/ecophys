analytic_controls:
- id: C1_mean_invariance_not_dynamic_invariance
  status: standard_stationary_two_state_control_not_new_theorem
  construction: Let a two-state signal take values e0,e1, with rates k01=a*s(I), k10=b*s(I), a,b,s(I)>0. Its
    stationary mean is (b*e0+a*e1)/(a+b), independent of illumination I, whereas its covariance is [a*b/(a+b)^2]*(e1-e0)^2*exp(-(a+b)*s(I)*tau).
  scope: Generic common-rate-factor counterexample; not the calibrated Alexa photophysical model. Flat mean
    response is insufficient to certify absence of illumination-dependent correlation dynamics. No prediction
    that the actual dye pair obeys this scaling.
qualified_lead: Published within-study photophysics-versus-local-DNA-motion interpretation ambiguity is real;
  not a matched cross-paper contradictory result.
comparison_scope:
- Holliday-junction Alexa488/594 versus historical Atto532/647N comparison changes dyes.
- Authors report qualitative MgCl2 insensitivity then share fast time and offset in a global fit; fitted equality
  alone is not independent invariance evidence.
- Fixed-distance photophysical simulation is not a directly measured static-Holliday-junction reference.
- 2015 direct acceptor excitation control is on labelled polyproline; native substrate and illumination must
  be matched before transferring predictions.
- Suppression of triplets by power/dye/additive changes is already proposed in the 2025 source.
decision: Stop this bounded chain with the physical ambiguity retained, but without a qualified discriminator
  or distinctive ML operation beyond full photon models, joint fits and existing excitation controls. No domain-wide
  closure or terminal route claim.
next_step: Require a concrete same-Holliday-junction model contrast and illumination/control prediction, or
  a newly qualified corresponding control asset, before expanding this source chain. Generic classifier, power
  sweep, latent-state augmentation or selection correction is insufficient by itself.
reading_depth: Two newly retained primary lineages. Selected main PDF prose/methods and RSC main HTML; no full
  supplement/model proof or figure pixel audit. The 2025 work was only a discovery lead in the previous intake.
