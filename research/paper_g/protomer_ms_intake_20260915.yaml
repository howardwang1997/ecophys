analytic_controls:
- name: normalized_protomer_ratio_conversion_depletion_ambiguity
  assumptions: Two channels, equal initial populations, equal known response factors; one observation time;
    illustrative algebra only.
  conversion: N=q, O=1-q, total=1 for 0<q<=1/2 after N-to-O conversion.
  depletion: N=b/2, O=1/2, b=q/(1-q); normalized N fraction again q, but total=(1+b)/2.
  discriminator: Calibrated absolute ion balance or independently resolved cluster channel separates this pair
    when q<1/2. Unknown transmission/detection factors must be controlled.
  limit: Standard normalization ambiguity, not a new theorem, actual assay failure, or authorization to reopen
    generic calibration-transfer work.
decision: Do not advance generic protomer-aware spectral prediction or ratio-based conversion inference as
  original. Multiple-protomer forward modeling and physically discriminating solvent controls already exist;
  a distinct learned cross-intervention prediction has not been formed.
next_step: A substantive follow-up must qualify paired, mobility-selected precursor/cluster/product observations
  under the same intervention and identify a predictive gain beyond ordinary mixture/kinetic fitting and capable
  collision-energy-conditioned predictors. More protomer examples alone are not a trigger. No broad mass-spectrometry
  closure.
