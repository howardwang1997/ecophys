diagnostics:
- id: A_dynamic_transport_goal_identity
  epistemic_class: elementary_paper_only_transport_duality
  system: Periodic u_t+c*u_x=f with known constant c; v spatially smooth and piecewise smooth in time.
  residual_and_jumps: r=v_t+c*v_x-f; j_k=v(t_k+)-v(t_k-); e=u-v.
  adjoint: z(t,x)=g(x+c*(T-t)).
  identity: inner(e(T),g)=inner(e(0),z(0))-integral(inner(r,z))-sum_k(inner(j_k,z(t_k))).
  L2_norm_bound: norm(e(T))<=norm(e(0))+integral(norm(r))+sum_k(norm(j_k)).
  target: Use g=2*(m1-m2) for continuum L2 risk difference; bounded observations need the adjoint observation load.
  limits: Include spatial interface terms for discontinuous reconstructions and certified integration errors; existing Duhamel/adjoint method, not new contribution.
- id: B_initial_observation_twins
  epistemic_class: elementary_paper_only_sampling_and_transport
  point_twin: On unit circle,h=1/N,x_j=j*h,w=sin(2*pi*x/h); initial samples0 but shifted samples-sin(2*pi*c*T/h).
  cell_average_twin: w=+a_j on first half of cell j,-a_j on second half; initial cell averages0, shift h/2 yields(a_j-a_(j-1))/2.
  nulls: Grid-aligned shifts; correctly resolved frozen band-limited initial family for point observations.
  limits: No assertion that both twins belong to the actual released generator family; preserve initial state and observation target.
- id: C_L1_to_pairwise_L2_risk
  epistemic_class: elementary_paper_only_dual_norm_bound
  bound: abs(D(v)-D(u))<=2*norm(m1-m2,infinity)*norm(v-u,1) for bounded fixed predictions.
  implication: An L1 truth bound can control the original squared-L2 ranking; lack of computable constants and state/domain mismatch are separate blockers.
  limits: Selected one-dimensional theorem does not supply a ready absolute radius for two-dimensional depth-only shallow water.
