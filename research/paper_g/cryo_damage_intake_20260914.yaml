analytic_controls:
- id: C1_mixed_decay_extrapolation
  assumptions: Ideal positive scalar signal from two equally weighted populations; dose D dimensionless, independent
    first-order losses k1=ln2,k2=ln4. No phases, motion, CTF or noise. Not a full cryoEM forward model.
  equation: S(D)=0.5*2^(-D)+0.5*4^(-D); S(0)=1,S(1)=3/8,S(2)=5/32.
  fit: Single exponential A*exp(-kD) fitted exactly at D1=1,D2=2 yields A=S(1)^2/S(2)=9/10, although true S(0)=1.
  general_scope: log of a positive exponential mixture is convex; positive-dose secant extrapolation need not
    recover the intercept. Additional low-dose observations or justified kinetic restrictions can resolve this
    toy; no universal impossibility.
  limitation: Elementary model-misspecification control only. Does not establish that the 2020 method uses
    only two points, that actual data follow this mixture, or that a neural model solves it. Multiexponential
    and hierarchical fits are ordinary required baselines.
unresolved: A defined site-level pre-irradiation estimand with comparable independent truth and a concrete
  gain over existing extrapolation/kinetic fits; no claim that all resources are absent.
reference_scope: Lowest-dose frame, extrapolated map, refined atomic series, crystallized XFEL structure and
  redox spectroscopy are different reference objects. Same-movie dose windows share particles and do not form
  independent replication. Global resolution is not local chemical-state truth.
baseline_scope: Frame restriction, existing zero-dose extrapolation, multiexponential or hierarchical damage
  fits. The 2026 Bayesian preprint requires primary-method verification before a detailed method comparison.
