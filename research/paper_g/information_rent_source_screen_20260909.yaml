five_part_contract:
  native_state: 'One finite equilibrium: terminal value/signals, designated informed cohort, endowments,
    fees, information sets, price grid, priority, order lifetime, full cash/inventory state.'
  legal_action: Market and limit orders within the frozen grammar; any restricted-order comparison has
    its own equilibrium.
  response: Expected cash-plus-terminal-inventory profit of the designated informed cohort, with initial
    endowments removed and explicit fees separated.
  measurement: C_pi=E sum_k Delta P_k Delta Y_k. Fix price observable, signing, units, partition and horizon;
    submitted order volume is not execution or latent cohort flow.
  rival_prediction: The proposed profit bound holds in the class or a fully qualified equilibrium violates
    it.
  truth: Exact equilibrium and accounting needed; current statistical/quotation-tape diagnostics are not
    that truth asset.
target_distinctions:
- Gross expected informed profit is not automatically incremental information value.
- Incremental signal value needs an explicit uninformed baseline.
- Signal willingness-to-pay, social value and management fees are different objects.
- Comparing different market grammars without a shared target is not a primary model disagreement.
