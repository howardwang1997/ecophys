diagnostics:
- id: C_action_direction_span
  epistemic_class: elementary_paper_only_linear_algebra
  consistent_embedding: H(z)=(A^(-1)*z,z)
  composite: F_alpha(H(z))=A*z for every alpha.
  consistent_derivative: D(F_alpha o H)*b=A*b.
  pulse_derivative: D*F_alpha*(0,b)=(1-alpha)*A*b for P*b=0.
  general_boundary: Exact derivatives on a subspace identify a target direction only if it belongs to that span, absent additional structural assumptions.
  source_attribution_limit: Explicit interface comparison; no claim that uninspected SC-NO code differentiates through the entire history.
- id: D_target_conditioned_nuisance
  epistemic_class: elementary_paper_only_objective_identification
  assumptions: Invertible A, zero-mean unforced histories, Y=A*x, N=y.
  nuisance: N=A^(-2)*Y; optimal target-conditioned squared nuisance prediction risk is zero.
  embedding: E_alpha(y,x)=(1-alpha)*x+alpha*A*y equals x on support.
  objective_boundary: Same on-support encoder distribution, decoder and covariance produce equal supervised, adversarial and bottleneck terms across alpha.
  limit: Does not imply zero stochastic supervised loss or bad optimizer selection; no differential-entropy argument.
- id: E_standard_augmentation_null
  epistemic_class: elementary_paper_only_population_loss
  legal_action: Earlier y fixed; current x becomes x+b; target becomes A*(x+b); P*b=0.
  loss: L_pulse(alpha)=alpha^2*E[norm(b)^2].
  condition: 0<E[norm(b)^2]<infinity.
  minimum: Unique alpha=0 in the specified scalar family, with perfect unforced forecasts and conservation retained.
  limit: General matrix defects require sufficient excitation rank; no finite-sample or trained-model claim.
