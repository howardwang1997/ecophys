  mathematical_replay_available: true
  executable_conformance_qualified: false
  immutable_release_and_code_config_container_hashes_qualified: false
  rights_ethics_release: Primary reading and internal independent algebra only; no participants or third-party code/data reuse; future release rights unqualified.
  untouched_confirmation: Both controls are development assets; whole-family independent confirmation not frozen or accessed.
  independent_replication: No executed or independently governed same-estimand replication; cited theorem plus hand calculation is not two empirical lineages.
  cost_precision: Exact mathematical identities under stated assumptions; implementation precision, integration errors and training cost not qualified or budgeted.
  stop_rules:
  - Do not swap inviscid and positive-viscosity targets.
  - Do not equate point samples, stored-sample averages and true cell averages.
  - Do not drop singular mass or replace fixed physical test functions with adaptive coordinates.
  - Do not replace front displacement with a fixed additive state pulse.
  - Do not promote weak first-order zero to no finite response or an L1 derivative.
  - Do not promote one method no-interaction restriction to a literature-wide gap.
  - Do not claim independent confirmation or novel methods from classical controls.
