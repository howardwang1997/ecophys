diagnostics:
- id: moving_ramp_weak_response
  epistemic_class: classical_paper_only_entropy_solution_and_measure_derivative
  domain: Real line; inviscid entropy Burgers; a in [1/2,3/2], t in [0,4].
  initial_state: a*x*indicator_[0,1](x).
  exact_state: a*x/(1+a*t)*indicator_[0,sqrt(1+a*t)](x).
  regular_derivative: x/(1+a*t)^2 on [0,sqrt(1+a*t)].
  shock_derivative_weight: a*t/(2*(1+a*t)) at sqrt(1+a*t).
  mass_control: Mass a/2 conserved along each trajectory; its derivative is 1/2.
  null: Shock derivative weight zero at t=0.
  positive: Shock derivative weight positive for a,t>0.
  observations: Fixed point values, true cell integrals and fixed smooth pairings are distinct targets.
  cell_component_norm: Shock weight divided by sqrt(h) in the cell-weighted discrete L2 norm, away from a cell-boundary crossing.
  scope: Known family; no repository outcome, viscous-target or numerical-executable failure inferred.
- id: compact_mass_preserving_shock_merger
  epistemic_class: elementary_paper_only_rankine_hugoniot_interaction_control
  domain: Real line; inviscid entropy Burgers; abs(p)<1/4,0<t<=4.
  initial_state: 0 below -10;2 on (-10,-1+p);1 on (-1+p,1-p);0 above 1-p.
  total_mass: 20
  common_rarefaction: (x+10)/t on [-10,-10+2*t].
  pre_merger_fronts: -1+p+1.5*t and 1-p+0.5*t.
  collision_time: 2-2*p
  post_merger_front: t, independent of p.
  at_nominal_collision: At t=2,p<0, difference is -1 on [2+p,2] and +1 on [2,2-p]; zero everywhere for p>=0.
  finite_norms: At t=2,p<0, L1=2*abs(p) and L2_squared=2*abs(p).
  smooth_response: Absolute paired response <= Lip(phi)*p^2; weak first derivative zero from both sides.
  exact_moment: With fixed compact phi equal to x near 2, response at t=2 is p^2 for p<0 and zero for p>=0.
  strong_boundary: No L1 first derivative at collision; weak zero is not an o(abs(p)) state approximation.
  later_null: For fixed 2<t<=4 and abs(p)<min(1/4,(t-2)/2), entire states coincide.
  intervention_boundary: Mass-preserving initial front displacement is not the cycle29 fixed additive L2 pulse.
truth_asset_contract:
  supported_estimands: Exact states, prescribed strong finite-difference norms and fixed smooth-observable parameter responses in the two scalar families.
  assignment_interference: Deterministic family parameters; separate trajectories; fixed entropy PDE and physical clock; shared rarefaction bounded away from merger fronts until t=4.
  lifecycle_replay_fields:
  - family_id
  - initial_parameter_and_profile
  - domain_and_entropy_flux
  - viscosity_flag
  - observation_time_and_collision_order
  - front_and_rarefaction_state
