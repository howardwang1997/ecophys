analytic_controls:
- id: C1_reread_precision_vs_shared_offset
  status: standard_random_effects_variance_control_not_new_theorem
  construction: Let R repeated observations from one molecule/pore satisfy Y_r=mu_s+B+epsilon_r, with Var(B)=tau^2,
    independent epsilon_r of variance sigma^2, and B shared across repeats. Then Var(mean(Y))=tau^2+sigma^2/R.
    Under Gaussian B and noise, equal-prior discrimination of two means separated by delta has error Phi[-delta/(2*sqrt(tau^2+sigma^2/R))].
  implication: Repeated readings suppress independent noise but not an unobserved shared offset. More events
    are not automatically more independent measurement units.
  limitation: Illustrative scalar random-effects model only; no actual pore offset distribution, failure of
    published consensus performance, new estimator or generic calibration-transfer candidate claimed. A measured
    per-pore reference can remove a shared nuisance under additional assumptions.
decision: Generic motor-aware inference, consensus rereading, charge-dependent read-frame modeling and cleavage-stage
  graph decoding have direct parents. tPAL is a real new assay capability, but no distinctive scientific/learning
  question formed. No nanopore-wide closure.
next_step: Stop generic decoder/classifier expansion. Any future tPAL follow-up needs a specific sequence-context
  or cleavage-stage ambiguity with a matched physical control and useful gain beyond its classifier/graph decoder,
  while respecting grouped measurement units. Do not reopen saturated generic calibration-transfer under a
  nanopore label.
comparison_contract:
- Separate finite-library variant identification, PTM localization and de novo sequence reconstruction.
- DNA motor state models are relevant inference parents but do not specify peptide current/stretching physics.
- Separate helicase-driven translocation from N-terminal coordination of a tethered peptide undergoing chemical
  cleavage.
- tPAL already uses multivoltage classification and stage-wise overlap graphs; those operations are not new.
- State pore/molecule/experiment versus event-level sampling units and distinguish classifier tests from independent
  sequence-assembly measurements.
- Preserve current-only, force/stretch and cleavage-stage targets; a resolved current stage is not automatically
  a calibrated amino-acid label.
- Training data locator is not a complete raw-assay or untouched-confirmation contract.
