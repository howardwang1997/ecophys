  immutable_version: Unqualified mutable master branch.
  supported_estimand_family: Conditional risk for frozen resolved field or BZ; separately specified full joint-path score.
  unsupported_estimand: Physical actuation response without a full-state lift and reset contract.
  assignment_interference: Observation map, sensor noise and actual observed-history provision must be assigned explicitly; deterministic paired truth if later authorized.
  event_lifecycle: Full fine state, PDE parameters, boundary conditions, clock, P, sensor RNG, actual true observations, generated feedback, recurrent initialization and target times.
  rights_ethics_release: Repository MIT text is documented; exact implementation/dependency and generated-data release contract not qualified; no participants or field contact.
  untouched_confirmation: Prospective disjoint trajectory/seed and observation partitions must be frozen before outcomes; none qualified yet. Existing PaperD is development for any new hypothesis.
  independent_replication: No second independently maintained nonlinear solver or real-system bridge qualified; a fork is not automatically an independent lineage.
  cost: Current scientific compute0; future solver, observation, training, recurrent storage and inference budgets separately unqualified.
  stop_rules: Stop on mismatched information budgets, absent immutable replay or rights, missing confirmation, or reduction to direct memory/filtering/score parents.
