diagnostics:
- id: A_exact_equilibrium
  epistemic_class: elementary_paper_only_equilibrium_derivation
  budgets: [1, 1]
  values: [[10, 0], [0, 10]]
  seller_costs: [1, 2]
  demand: Buyer i maximizes 1+u_i*x_i-p*x_i subject to nonnegativity and spending<=1.
  separate_caps: ['1/2', '1/2']
  separate_equilibrium: {prices: [2, 2], quantities: ['1/2', '1/2']}
  shared_constraint: y1+y2<=1
  equilibrium_root: lambda^2+lambda-1=0, lambda>0
  shared_prices: ['(1+sqrt(5))/2', '(3+sqrt(5))/2']
  shared_quantities: ['(sqrt(5)-1)/2', '(3-sqrt(5))/2']
  uniqueness: Positive net price implies full supply; absent-good and value-threshold cases cannot clear; both buyers spend one and the scalar root is unique.
  positive_boundary: With equal costs (1,1), the shared-cap equilibrium prices (2,2) and quantities (1/2,1/2) are rational.
  interpretation: Rational inputs do not imply rational-coordinate output under the joint cap; exact algebraic representation remains finite.
- id: B_rational_approximation
  epistemic_class: elementary_paper_only_equilibrium_certificate
  scalar_function: H(z)=1/(1+z)+1/(2+z)
  initial_bracket: '[1/2,1]'
  endpoint_values: ['16/15', '5/6']
  rational_prices: p=(1+l,2+l), l<=lambda_star<=u
  rational_allocation: x_ii=1/(p_i*H(l)), x_ij=0 for i!=j
  exact_properties: Total issuance1, clearing, seller optimality and spending1/H(l)<=1 for each buyer.
  buyer_regret: R_i=(10/p_i-1)*(1-1/H(l))
  derivative_bound: '|H_prime(z)|<=136/225 on [1/2,1]'
  regret_bound: R_i<4*(u-l)
  price_error_bound: '|p_i-p_i_star|<=u-l'
  after_k_steps: Interval width2^(-k-1); O(k)-bit rational intermediates for this fixed fixture.
  parent_program: max log(y1)+log(y2)-y1-2*y2 subject to positive y and y1+y2<=1.
