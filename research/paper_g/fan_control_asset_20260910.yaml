    Four documentation/metadata files only; no outcomes, hardware operation or publication.
  untouched_confirmation: No untouched whole-run partition or sampling/assignment protocol qualified; no data
    rows accessed.
  independent_replication: Pressure and converted velocity files are one measurement lineage, not independent
    velocity truth. Article/repository/dataset hosts are not independent experimental replications.
  cost: Only public metadata/documentation reading cost incurred. Hardware, acquisition, calibration, model
    training and confirmation precision/cost unqualified.
  stop_rules: Stop generic physical-mixing and sensor-calibration claims at direct parents. Without complete
    intervention/measurement lineage, do not use the asset as dynamic or independent physical truth; no harvesting
    without qualified trigger.
