analytic_controls:
- id: C1_planar_blind_dissipative_channel
  status: standard_polynomial_invariant_control_not_new_theorem
  construction: Let D be the symmetric rate-of-deformation tensor for a 3D incompressible fluid. To any fixed
    objective base model add Delta_tau=2*eta*a*(det(D)/r_star^3)^2*D, eta>0, a>=0, r_star>0 with units inverse
    time. This added parallel stress is symmetric, objective and trace-free. Its instantaneous dissipation
    is 2*eta*a*(det(D)/r_star^3)^2*tr(D^2)>=0.
  planar_null: For any embedded planar incompressible flow D has eigenvalues (d,-d,0), so the correction is
    identically zero for every rate and history. Additional shear stress/normal stress measurements cannot
    identify a through this correction; a rotated planar experiment also has determinant zero.
  native_discriminator: For uniaxial extension D=diag(-e/2,-e/2,e), det(D)=e^3/4. The correction to (tau_zz-tau_xx)/e
    is 3*eta*a*e^6/(16*r_star^6), nonzero for e!=0 and a>0. One known nonzero rate and a known base identify
    a in this one-parameter family, not an arbitrary constitutive function.
  limitation: A constructed objective dissipative additive channel, not a new material mechanism, full thermodynamic/stability
    theorem, observed model failure or distinct ML method. The published invariant-blindness parent already
    covers the generic obstruction.
decision: 'Stop generic shear-to-extension transfer, shear-only identifiability warning and mixed-flow augmentation:
