- id: conservative_target_split
  epistemic_class: standard_paper_only_generator_identity
  hypotheses: F_C=-grad U; fast F_S and correction F_L=F_C-F_S; fixed masses and bath.
  identity: B_S+B_L=B_C, while finite-step composition still depends on the split,ordering and step sizes.
  limitation: Hybrid success does not identify uncorrected F_S dynamics or establish exact continuum response.
- id: mass_matrix_spectral_control
  epistemic_class: standard_paper_only_harmonic_control
  hypotheses: Constant positive masses and fixed potential; two harmonic coordinates with k_i>0 and fixed m1+m2.
  identity: Canonical position law does not depend on constant M; omega_i^2=k_i/m_i changes under mass repartition.
  limitation: A spectral matching control, not a refutation of reported water diffusion or a new molecular
    mechanism.
- id: einstein_vacf_bridge
  epistemic_class: standard_paper_only_stationary_second_moment_identity
  hypotheses: Zero-mean stationary velocity,finite second moments,unwrapped positions; absolute correlation
    integrability for infinite-time limit.
  identity: E|q(H)-q(0)|^2=2 integral_0^H(H-t)C(t)dt; D_H=(1/d)integral_0^H(1-t/H)C(t)dt -> (1/d)integral_0^infinity
    C(t)dt.
  limitation: Finite fitted MSD slopes need not equal endpoint D_H; wrapping,drift,coordinates,preparation
    and lag windows require explicit matching.
