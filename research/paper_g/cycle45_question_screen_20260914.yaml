killer_controls:
- id: C1_isoaffinity_common_rate_mode
  result: 'For 1:1 binding scale kon and koff by c>0. KD is unchanged, but relaxation at concentration C scales
    by c: kon*C+koff. Mutation log-rate differences a=b=log(c), d=0. This is a standard kinetic identity, not
    evidence of realizable mutations or a new theorem.'
- id: C2_pooled_parent_signal_without_mutation_skill
  result: Let y_gm=mu_g+epsilon_gm with independent centered terms and predictor yhat=mu_g. Corr(y,yhat)=sqrt(Var(mu)/(Var(mu)+Var(epsilon)))
    approaches1 with between-parent variance, although all within-parent predictions are zero after centering.
    This is an illustrative null, not a measured failure of any source model.
