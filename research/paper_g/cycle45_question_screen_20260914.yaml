questions:
- id: g45_antibody_mutation_kinetic_selectivity
  archetype: empirical_intervention
  source_lane: market_native_action_or_constraint
  scientific_domain: antigen_antibody_mutation_kinetics
  native_object: Parent-mutant protein pair in a fixed binding assay with explicit antigen, construct/valency,
    temperature, buffer, surface loading, fitting model and measurement window.
  action: Experimentally substituted residues or designed sequence relative to the registered parent; evaluate
    mutation effects rather than pooled absolute rates.
  response: Paired changes a=log(kon_mut/kon_parent), b=log(koff_mut/koff_parent); d=log(KD_mut/KD_parent)=b-a
    under the same 1:1 kinetic model. Primary claim remains protocol-conditioned kinetics.
  rivals:
    H1: Affinity-pretrained representations retain mutation-sensitive information about common kinetic shifts
      a approximately b beyond affinity changes and parent identity.
    H0: Their apparent kinetic predictive value is exhausted by affinity and between-parent variation; ordinary
      raw-embedding or existing mutation-kinetics predictors suffice for within-parent changes.
  discriminator: Frozen family/mutation holdout comparison of joint rate-change prediction, plus independently
    defined near-isoaffinity strata with measurable common kinetic shifts. Match supervision, parent-reference
    availability and total fitting budget. Compare frozen affinity representations, raw representations, fine-tuning,
    direct hotspot predictors and affinity/parent diagnostic nulls.
  positive_value: Determine whether equilibrium-trained representations support kinetic-selective mutation
    screening and which representation training retains that capability.
  null_value: Delimit affinity-pretraining transfer and avoid claiming kinetic engineering ability from pooled
    affinity-correlated scores; null alone is not conference readiness.
  closest_closed_route: g33_protein_assay_epistasis
  substantive_difference: Observed mutation-induced rate changes with a specific representation-transfer question,
    not latent phenotype/readout decomposition, probability recalibration or small-panel acquisition/population
    transfer. Existing calibration and generic learned-MC guards unchanged.
  screen_status: deferred
  decision_stage: F1
  decision_reason: Native intervention and plausible kinetic references exist; standard controls show the requested
    response is not fixed by affinity or pooled accuracy. Retain provisionally for bounded contribution/support
    review, not a validated novelty or performance claim.
