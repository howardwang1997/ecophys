claim_controls:
- No first kinetics predictor, no new two-head parameterization claim.
- 'Do not use KD computed from the same fitted rates as an independent affinity match: shared fit errors can
  induce conditional effects.'
- Separate sequence-only deployment baselines from oracle-affinity diagnostic controls; no test mutant labels
  as deployment inputs.
- Published prospective data are already viewed literature; new use is retrospective development until an untouched
  confirmation partition is established.
- Protocol-fitted rates and finite-exposure response are not intrinsic barrier or clinical-effect truth.
- Complete valid-reference metadata and distinct scientific conclusion remain unqualified; ordinary residual
  reporting alone leads to parking.
