diagnostics:
- id: convex_conservative_affinity_and_smooth_pde_control
  epistemic_class: elementary_paper_only_positive_functional_and_generator_algebra
  domain: Convex subset of L1 or finite vectors with strictly positive mass weights.
  exact_result: Pointwise convexity plus exact integral conservation makes every Jensen gap nonnegative with zero integral, hence the map is affine.
  approximate_result: If each triple mass defect<=epsilon_M and negative Jensen-gap L1 mass<=epsilon_C, full gap L1<=2*epsilon_M+2*epsilon_C.
  approximation_bound: For target Jensen-gap norm d and maximum error E on the same triple,E>=d/2-epsilon_M-epsilon_C.
  native_pde: Smooth periodic Burgers with viscosity nu>=0,initial states c+a*sin(x),c-a*sin(x),c>a>0,and their midpoint c.
  generator_gap: -a^2*sin(x)*cos(x).
  finite_time_scope: On a sufficiently short classical-solution interval,gap=-a^2*t*sin(x)*cos(x)+O(t^2),with L1 norm2*a^2*t+O(t^2) per period.
  null: Linear heat and advection have zero Jensen gap.
  exclusions: Not a novel or statistical theorem; no full-time bound,no shock dependence,no assertion about actual learned models.
- id: payoff_density_and_mean_projection_control
  epistemic_class: elementary_paper_only_order_duality_and_projection_algebra
  envelope: Pointwise max of identity and swap maps sends (1,0) to (1,1);constant-preserving,convex and monotone,not sum-preserving.
  interpretation: Valid one-step payoff optimization; does not establish every continuous-time assumption.
  duality: Fixed row-stochastic K acts on payoffs;transpose acts on densities;nonlinear payoff-selected policy supplies no payoff-independent linear adjoint.
  projection: G(z)+(mean(z)-mean(G(z)))*ones.
  projection_null: On the unit simplex,G(z)=(z1^2,0) gives ((1+z1^2)/2,(1-z1^2)/2);positive and conservative but not input-convex.
  repository_scope: Selected project_pde_output source only; no code execution,checkpoint or outcome access.
