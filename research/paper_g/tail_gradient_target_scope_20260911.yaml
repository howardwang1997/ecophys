  result_ref: papers/proposal/ecomd_paper_g_tail_gradient_target_scope_2026-09-11.md
  claim: Fixed-k Hill is 2-Lipschitz in log samples; integrable local path bounds and no ties at the target
    permit differentiation of its expectation.
  limitation: Allows dependent finite samples, not arbitrary support changes, adaptive k or reciprocal moments.
- id: tail_gradient_pareto_moments
  epistemic_class: standard_paper_only_exponential_order_statistic_moments
  result_ref: papers/proposal/ecomd_paper_g_tail_gradient_target_scope_2026-09-11.md
  claim: Exact iid Pareto gives H=gamma S/k with S~Gamma(k,1); reciprocal parameterization introduces classical
    inverse-Gamma moment and bias factors.
  limitation: No correction for general tails or dependent trajectories.
- id: tail_gradient_mixture_target
  epistemic_class: standard_paper_only_inverse_cdf_finite_threshold_counterexample
  result_ref: papers/proposal/ecomd_paper_g_tail_gradient_target_scope_2026-09-11.md
  claim: Interior survival (1-w)x^-2+w x^-1 has constant asymptotic gamma=1 but strictly positive finite-Hill
    gradient, with fixed ranks and valid dominated interchange.
  limitation: Target mismatch, not gradient computation failure or practical EcoMD evidence; no eventual inconsistency
    claim.
- id: tail_gradient_crossover_coverage
  epistemic_class: standard_paper_only_exceedance_count_bound
  result_ref: papers/proposal/ecomd_paper_g_tail_gradient_target_scope_2026-09-11.md
  claim: For w<1/2, x_c=(1-w)/w and p_c=2w^2/(1-w); probability Hill threshold exceeds x_c is at most n p_c/(k+1).
  limitation: Hill threshold coverage only, not a minimax or all-algorithm sample-complexity lower bound.
