diagnostics:
- id: A_generated_and_executed_laws
  epistemic_class: elementary_paper_only_probability_identity
  assumptions: Fixed full initial state, open-loop behavior action law mu, true conditional trajectory kernel K, perfect joint model, finite positive normalizer.
  generated_law: q_gen(da,du)=mu(da)*K(du|a)*exp(-W(u,a))/Z.
  action_law: q_A(da)=mu(da)*E_K[exp(-W(U,a))|a]/Z.
  executed_law: q_exec(da,du)=q_A(da)*K(du|a).
  equality_condition: For q_A-almost every a, exp(-W(U,a)) is K-almost surely constant.
  deterministic_null: K=delta_S(a) and exact model imply q_gen=q_exec.
  limit: Model sampling noise is not physical noise; partial state and feedback require explicitly different conditioning contracts.
- id: B_safe_action_four_atom_control
  epistemic_class: elementary_paper_only_exact_normalization_and_KL_minimization
  plant: A in {0,-2}, uniform behavior; U=A+xi, fresh independent fair xi in {-1,1}; unsafe U>0.
  cost: W=beta*1{U>0}+lambda*A^2, beta and lambda nonnegative.
  abbreviations: b=exp(-beta); h=exp(-4*lambda); D=1+b+2*h.
  generated_risk: b/D.
  executed_risk: (1+b)/(2*D).
  limit_fixed_lambda: As beta grows, generated risk tends0 while executed risk tends1/(2*(1+2*h)).
  competent_baseline: Minimize E_nuK W+KL(nu||mu), giving nu*(a) proportional to mu(a)*exp(-E_K[W|a]).
  baseline_risk: exp(-beta/2)/(2*(exp(-beta/2)+h)), tending0 at fixed lambda.
  boundary: Safe action exists; exact known physical law; no model error or numerical experiment. Established control-as-inference example, not a new optimizer or source-paper empirical failure.
- id: C_executed_policy_calibration
  epistemic_class: elementary_paper_only_Radon_Nikodym_identity_and_existing_coverage_contract
  assumptions: Fixed open-loop policies, X=(initial state, action sequence), calibration p_X*K, independent target q_X*K, q_X absolutely continuous with respect to p_X.
  correct_weight: d(q_X*K)/d(p_X*K)=dq_X/dp_X(X).
  conformal_contract: Independently trained fixed predictor; residual probability masses proportional to weights; include target weight at infinity.
  feedback_boundary: With common initial and environment law, trajectory ratio is product of conditional target/behavior action probabilities; support and sampling/dependence conditions still required.
  limit: Joint generated ratio need not equal execution ratio; environment shift, adaptive calibration reuse, controller selection and accepted-only deployment require their own validity contract.
truth_asset_preflight:
  source: Official SafeDiffCon repository README/directory metadata and DiffPhyCon evaluation description.
  verified_capability: Documented Burgers, smoke and tokamak control tasks and training/evaluation entry points; published numerical execution of control signals.
  inspection_level: Papers and README metadata; no implementation, raw data or checkpoint qualification.
  immutable_version: Paper versions recorded; repository main is mutable and unpinned.
  supported_estimand_family: Executed safety probability and control cost under one declared initial-state and policy law; generated scores separate.
  assignment_interference: Policy assigned before reset; separate physical, observation, action-policy and generator randomness; shared tapes are coupling, not independent units; no future noise available to controller.
  event_lifecycle: Full physical reset state, parameters, observation map, boundary conditions, actuator support/saturation, action times/interpolation, physical disturbance kernel, solver tolerance, policy updates and RNG states.
  rights_ethics_release: Repository displays MIT label; full license and dependency/data/derived-release rights not qualified. No participant or field work.
  untouched_confirmation: Entire physical regimes and independent disturbances reserved before outcomes; separate training/calibration/selection/evaluation. None qualified yet; PaperD is development for new hypotheses.
  independent_replication: Related DiffPhyCon papers share a lineage; no independent second solver or real bridge qualified.
  cost: Current scientific compute0; future solver, training, calibration, online adaptation and inference costs unqualified.
  stop_rules: No residual beyond competent fixed-dynamics and calibration baselines; incomplete replay/support/rights; absent untouched confirmation; no qualified reentry trigger.
