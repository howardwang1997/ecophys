diagnostics:
- id: A_stable_conserving_response_twin
  epistemic_class: elementary_paper_only_linear_counterexample
  assumptions: A unitary periodic translation; P spatial-mean projector; Q=I-P; AP=PA=P; alpha in[0,1].
  predictor: F_alpha(y,x)=P*x+A*Q*((1-alpha)*x+alpha*A*y)
  conservation: P*F_alpha(y,x)=P*x for every history.
  forecast_identity: x=A*y implies F_alpha(y,x)=A*x; all unforced rollouts remain exact.
  consistent_history_action: (y,x) maps to (y+A^(-1)*b,x+b), P*b=0.
  consistent_history_response: A*b for every alpha.
  current_pulse_action: (y,x) maps to (y,x+b), P*b=0.
  current_pulse_response: (1-alpha)*A*b; true response A*b.
  normalized_one_step_error: alpha
  Q_stability: norm(q_next)<=(1-alpha)*norm(q_current)+alpha*norm(q_previous).
  pulse_rollout: delta_xhat_t=A^t*b*(1+alpha*(-alpha)^t)/(1+alpha), t>=0.
  transformed_roots: ['1', '-alpha']
  limit: Standard off-support nonidentification and linear recurrence; no trained-model or new-physics finding.
- id: B_necessary_history_wave
  epistemic_class: elementary_paper_only_state_sufficiency_twin
  dynamics: One nonzero periodic wave mode, a_next=2*cos(theta)*a_current-a_previous, theta in(0,pi).
  paired_histories: a_current=0; a_previous=+delta or-delta.
  next_truths: -delta or+delta.
  current_only_worst_case_error_lower_bound: delta
  physical_state: Displacement plus velocity is complete; displacement-only observation needs history.
  limit: Known observability/state-sufficiency fact, not evidence that all PDE predictors require history.
