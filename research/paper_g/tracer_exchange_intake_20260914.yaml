analytic_controls:
- name: Absolute flux/pool common-scale ambiguity
  status: standard_control_not_new_theorem
  statement: For passive tracer balances C_i dm_i/dt=F_i(v,m,u), with F homogeneous of degree one in fluxes
    v, scaling every flux and pool by the same positive constant preserves fractional labeling trajectories
    at fixed physical time and arbitrary admissible tracer schedule u.
  conditions: Fixed stoichiometry/atom mapping, initial fractions and metabolic steady state; no fixed absolute
    uptake, secretion or concentration observation. Relative fluxes are not changed by this control.
  boundary: Measured absolute extracellular rates or pool concentrations can break this scaling. The retained
    microliter study includes extracellular rate measurements, so this control is not a refutation of its absolute
    flux inference.
findings:
- Transient isotope inversion and experiment design have classical parents; forward neural surrogate acceleration
  also has a direct parent.
- Do not confuse metabolic stationarity with isotopic stationarity.
- Absolute flux/pool scale needs absolute information; varying tracer schedules alone does not break the stated
  common-scale symmetry.
- NeuralFlux is a forward surrogate embedded in optimization, not simply a label-to-flux predictor or a demonstrated
  wet-lab intervention method.
- Joint microliter analysis explicitly shares net fluxes after inspecting individual fits and allows selected
  pool parameters to vary by dataset.
- The cited methods do not yet form a matched contradiction for one object, intervention and response.
decision: Stop generic neural isotope-curve fitting, reversible-exchange estimation or tracer design as the
  current formulation. No distinct raw question established; retain native controls and source locators without
  a metabolism-wide closure.
next_step: Seek a specific native intervention or competing model with a discriminating consequence beyond
  the existing forward-surrogate and INST-MFA operations. Do not use generic uncertainty recalibration as an
  unqualified re-entry.
comparison_contract:
- Fix atom transitions, observed fragments, compartment pooling and metabolic stationarity.
- Distinguish net flux, exchange flux, turnover rate, relative flux and pool concentration.
- Specify absolute uptake/concentration anchors and all nuisance parameters.
- Distinguish separate fits from joint models with equality constraints chosen after inspection.
- Match fixed versus inferred concentrations and simulation truth versus experimental reference.
- Count forward-surrogate training, optimizer calls, experiment and measurement costs.
reading_depth: Four retained primaries at unequal depth, not four complete reviews. ML-Flux and 13CFLUX hits
  are discovery locators, not additional retained readings.
