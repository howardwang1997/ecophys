- id: schwarz_perturbed_fixed_point_and_damping
  epistemic_class: standard_paper_only_contraction_perturbation
  hypotheses: Exact T contractive by q<1 on a specified invariant domain; uniform assembled-map discrepancy
    eta in the same norm.
  identity: norm(u-u*) <= (norm(T_hat(u)-u)+eta)/(1-q); affine fixed-point shift (I-Q)^(-1)b; damping scales
    increments, not fixed points.
  limitation: Does not establish learned convergence, uniform error from empirical patch MSE, or the assumptions
    for nonlinear NEST.
- id: schwarz_full_cycle_cancellation_control
  epistemic_class: standard_paper_only_linear_algebra
  hypotheses: Scalar A=1, residual f-u; one half residual step, then linear N(r_s)=-r_s.
  identity: u_s=u+r/2, r_s=r/2, u_next=u_s-r_s=u for all u; both substeps can be nonzero.
  limitation: Deliberate analytic correction map, not a trained-model observation. For delta=B r with invertible
    B, exact zero still implies r=0; small increments require conditioning.
- id: schwarz_residual_affine_hull_scope
  epistemic_class: standard_paper_only_affine_residual_identity
  hypotheses: Linear A, candidate iterates g_i and weights summing to one.
  identity: f-A sum(alpha_i g_i)=sum(alpha_i (f-A g_i)); with invertible A, zero residual attainable iff u*
    is in the affine hull.
  limitation: No new directions from a deficient history, no universal convergence theorem, no automatic nonlinear-PDE
    or continuum guarantee.
