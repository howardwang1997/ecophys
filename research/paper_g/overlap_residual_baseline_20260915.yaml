analytic_controls:
- id: B1_same_label_chebyshev_repair
  result: On the declared constant planar-rotation family, a0=1, a1=q, a(k+1)=2q*a(k)-a(k-1) recovers exact
    distant overlaps with no added labels or training.
  limit: Restricted prior and exact labels; long-range sensitivity can grow quadratically with index. No generic
    molecular advantage.
- id: B2_three_node_psd_minimax
  result: Given nearest overlaps q, the missing real overlap lies in [2q^2-1,1]. Linked product q^2 is its
    minimax midpoint with worst-case error 1-q^2, also minimizing the specified single-pair kinetic operator
    error.
  limit: Only the stated label class, three nodes and loss; extra features/derivative labels or learned valid
    priors can change the information class.
- id: B3_diagonal_preserving_landmark_certificate
  result: With P=B*C^-1*B^dagger and v=1-diag(P), use P+diag(v). Exact-label PSD residual gives operator error
    at most max_n sum_(m!=n) abs(T_nm)*sqrt(v_n*v_m).
  limit: Known complete landmark columns cost queries; conditioning, noise and conservative bounds remain.
    Not a sharp query-complexity theorem or observed advantage.
remaining_learning_target: Transferable normalized complementary-subspace correlations after observed-landmark
  projection, compared with same-feature kinetic-aware landmark completion, KRR and linked products.
decision: Keep g41 parked. The previous toy is exactly solved with the original nearest-link label. General
  nearest-link completion has a precise information boundary; no learned cost/transfer gain established.
next_step: Stop routine toy/literature expansion. Revisit only for a specified supported residual correlation
  structure or matched acquisition asset; account for off-landmark training labels and molecular reference
  cost.
