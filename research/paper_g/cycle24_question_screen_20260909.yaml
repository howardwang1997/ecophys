questions:
- id: G24-01
  route_id: paper_g_ald_uniform_price_only_implementation
  archetype: theory_mechanism
  source_lane: market_native_action_or_constraint
  native_object: Nonconvex dispatch settled under a pure energy price or the complete ALD contingent cash schedule.
  rivals:
  - Exact augmented duality supplies a uniform energy price with zero individual deviation gain.
  - Zero deviation gain requires the allocation-dependent penalty term in the settlement contract.
  discriminator: Exact individual best responses for the same dispatch, costs and feasible output sets under the two complete payments.
  positive_value: Qualify the price-only implementation interpretation.
  null_value: Identify the required contingent payment and prevent false comparison of incentive measures.
  minimal_truth: Physical outputs, costs, individual versus joint feasibility, allocation target, complete on/off-allocation payments and deviation class.
  source_refs: [cycle24_wang_ald, cycle24_bichler_nonconvex, cycle24_feizollahi_exact_ald]
  context_refs: [cycle24_ahunbay_pricing]
  diagnostic_refs: [A_settlement_support]
  stage: F1
  disposition: quick_closed
  terminal_gate: exact_payment_contract_change_and_known_nonconvex_price_obstruction
  interpretation_limit: Does not refute the complete ALD mechanism or audit its full theorem, algorithm, network or demand-side claims.
- id: G24-02
  route_id: paper_g_pay_as_bid_fixed_quantity_uniqueness_transfer
  archetype: theory_mechanism
  source_lane: market_native_action_or_constraint
  native_object: Pay-as-bid scalar prices with fixed bid quantity, compared with the same auction allowing quantity choice.
  rivals:
  - Common information and payment format alone preserve equilibrium uniqueness.
  - Restricting the bid quantity sustains multiple equilibria removed by quantity deviations.
  discriminator: Exhaust scalar deviations and exhibit a profitable price-quantity deviation with other primitives unchanged.
  positive_value: Justify the proposed equilibrium transfer across order permissions.
  null_value: Specify the missing action and prevent treating restricted simulators as the original game.
  minimal_truth: Exact price/quantity action set, tie rationing, supply, valuations, payment, abstention and information.
  source_refs: [cycle24_pycia_woodward, cycle24_kastl_constrained]
  diagnostic_refs: [B_bid_quantity]
  stage: F1
  disposition: quick_closed
  terminal_gate: exact_quantity_action_change_and_known_constrained_bidding_parent
  interpretation_limit: Defined hypothetical game; no claim about a current venue, all expanded-game equilibria or a refutation of the unrestricted theorem.
