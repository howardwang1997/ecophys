analytic_controls:
- id: C1_radial_measure
  status: standard_partition_integral_not_new_theorem
  construction: For m>=0, U(m)=kappa*m^2/2, kappa>0, and radial measure (m/m_ref)^q dm/m_ref with q>-1, the
    Gamma-integral ratio gives E[m^2]=(q+1)*k_B*T/kappa. q=0,1,2 yield coefficients 1,2,3 for the same energy.
  coordinate_scope: To represent the q measure using the q=2 reference, use U_eff=U+(2-q)*k_B*T*log(m/m_ref)
    for m>0. With the density transformed consistently the ensemble is unchanged; the integrable singular endpoint
    is understood through the probability measure.
  implication: Energy labels alone do not choose a density of coarse states. Merely changing coordinates consistently
    is not a new physical discrepancy; altering the state-count measure at fixed U changes the model.
  limitation: Standard single-site harmonic control, not new physics or a prediction for any specific real
    material.
- id: C2_auxiliary_inertia
  status: standard_harmonic_equilibrium_trajectory_control_not_new_theorem
  construction: For H=p^2/(2*mu)+kappa*s^2/2, canonical equilibrium gives E[s^2]=k_B*T/kappa independent of
    mu, while exact Hamiltonian evolution from that ensemble gives C_mu(t)=(k_B*T/kappa)*cos(sqrt(kappa/mu)*t).
  implication: Identical configurational sampling does not establish identical physical clocks. Physical bath-induced
    inertia requires a microscopic response bridge rather than arbitrary tuning.
  limitation: Scalar harmonic control, not a complete spin equation or an empirical failure of TSPIN; current
    v3 thermodynamic validation remains distinct.
decision: Do not advance generic spin-state MLPs, radial reweighting or fictitious-mass sampling as a new topic.
  Existing parents cover the generic operations; no same-material unresolved prediction or distinctive learning
  contribution formed. No magnetic-materials-wide closure.
next_step: Require a native response or state-counting truth source and a concrete contribution beyond existing
  longitudinal models/samplers; do not continue by renaming the potential architecture or sampler. Preserve
  the separation of energy, measure and physical dynamics.
comparison_contract:
- Freeze material, temperature, lattice, moment definition, energy reference and state-count measure.
- Transform energy and density consistently under a coordinate change.
- Use current primary version and separate equilibrium observables from dynamic susceptibility/relaxation.
- Retain generalized longitudinal Langevin baselines; conventional fixed-magnitude LLG is not the entire prior
  class.
- A physical bath model and arbitrary auxiliary inertia are different scientific objects.
