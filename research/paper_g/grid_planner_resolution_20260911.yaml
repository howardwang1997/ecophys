proof_scope:
  original_model: Original fixed-mark prefunded unit-action q0=1 model; Q>=2, one independent restoration;
    actual feedback.
  gain: Nondecreasing in p_b,p_s; |g(nu)-g(nuprime)|<=6|nu-nuprime| with willingness fixed.
  confidence: eta=(T+1)^(-2), L_star=ceil(log2(6T(T+1)^2)); rational outward endpoints at mesh1/M; widths increase<=2/M.
  candidates: Set willingness to rounded upper endpoints; enumerate at mostM+1 nu grid values.
  planner: gamma=1-1/[M(Q+1)]; minimize sum v subject to v>=r+gamma Pv; choose candidate maximizing (1-gamma)V_gamma(0).
  bias: h=V_gamma-V_gamma(0); adjacent difference<=2, |h|<=2Q, gain/Bellman approximation<=2Q/[M(Q+1)].
  approximation: Grid6/M + two bias errors<=4/M + rounded widths20/M, totaling<=30/M per round.
  result: R<=min(3T,4Q+2QK_T+(24+16sqrt2)sqrt(L_star T)+13T eta+30T/M).
  complexity: At most(M+1)K_T LPs; Q+1 variables, <=27(Q+1) inequalities; rational coefficient bitsO(log(M(Q+1))).
  choice: M=ceil(sqrtT) preserves O(sqrt(T logT)+Q logT), with O(sqrtT logT) LP solves.
  excluded: Strong polynomiality, constant per-step cost, numerical speed or accuracy, exact old constants,
    optimal Q law, original novelty, endogenous protection.
