window:
  clock: ethereum_block_timestamp_utc
  boundary_rule: first_block_with_timestamp_greater_than_or_equal_to_target
  start_inclusive: true
  end_exclusive: true
  execution_block_excluded: true
  bins_are_relative_to_exact_payload_execution: true

activity_rule:
  preperiod_days: 28
  weekly_bin_days: 7
  minimum_weekly_borrow_events: 10
  minimum_weekly_repay_events: 10
  minimum_weekly_unique_debt_users: 10
  minimum_total_combined_actions: 200
  minimum_total_unique_debt_users: 50
  every_week_must_meet_all_weekly_floors: true
  threshold_tuning_after_values: forbidden
  counts_are_power_metadata_not_behavioral_outcomes: true

decision:
  minimum_total_eligible_units: 15
  minimum_primary_eligible_units: 12
  minimum_reverse_sign_eligible_units: 2
  minimum_eligible_assets_per_proposal: 2
  all_four_conditions_required: true
  below_gate: stop_aave_singleton_panel_before_postevent_outcomes
  pass_only_authorizes_separately_frozen_intervention_ledger_gate: true

blinding:
  allowed_retained_market_values:
    - weekly_borrow_event_count
    - weekly_repay_event_count
    - weekly_unique_debt_user_count
    - total_event_counts
    - total_unique_debt_user_count
  forbidden_retained_values:
    - participant_or_user_address
    - amount
    - realized_rate
    - utilization
    - reserve_balance_or_index
    - transaction_hash
    - per_log_block_identifier
    - raw_log_or_rpc_response
  postevent_logs: forbidden
  execution_block_logs: forbidden
  reserve_data_updated_logs: forbidden
  position_or_balance_calls: forbidden

limits:
  request_timeout_seconds: 30
  transport_retries: 3
  block_chunk_size: 5000
  maximum_log_range_split_depth: 8
  boundary_search_back_blocks: 400000
  cpu_core_hours: 4
  temporary_data_mb: 500
  paid_data: forbidden
  gpu: forbidden
  v100: forbidden
  rtx2060: forbidden
  h20: forbidden
  ecomd: forbidden
