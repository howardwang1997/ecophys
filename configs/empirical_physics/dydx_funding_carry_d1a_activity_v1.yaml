  minimum_trades_per_day: 100
  minimum_eligible_pre_days: 21
  missing_daily_candle_makes_market_ineligible: true
  threshold_tuning_after_values: forbidden

decision:
  proceed_minimum_markets: 20
  amber_minimum_markets: 15
  fewer_than_15: stop_dydx_only_before_bulk_ticks
  proposal_317_cannot_rescue_d1a: true

blinding:
  allowed_retained_candle_values: [startedAt, trades]
