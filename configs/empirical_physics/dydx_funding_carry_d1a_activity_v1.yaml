     orderbookMidPriceOpen, orderbookMidPriceClose]
  post_event_data: forbidden
  trade_endpoint: forbidden
  proposal_317: forbidden
  proposal_220_window: forbidden
  raw_responses: forbidden

limits:
  requests: 21
  response_limit_each: 100
  request_timeout_seconds: 30
  transport_retries: 3
  cpu_core_hours: 1
  temporary_data_mb: 50
  paid_data: forbidden
  gpu: forbidden
  v100: forbidden
  rtx2060: forbidden
  h20: forbidden
  ecomd: forbidden
