cross_chain_gate:
  source_audit_requires_only_rate_slope1_changed_for_comparator_asset: true
  comparator_asset_aliases:
    DAI: DAI
    DAIe: DAI
    USDC: USDC
    USDCe: USDC
    USDCn: USDC
    USDT: USDT
    USDTe: USDT
  stagger_population: executed_source_audited_comparable_chains_including_ethereum
  minimum_executed_v3_payload_chains_per_qualifying_proposal: 3
  minimum_non_ethereum_comparator_chains_per_qualifying_proposal: 2
  minimum_execution_stagger_hours: 24
  minimum_qualifying_proposals: 4
  cross_chain_activity_is_not_assumed: true
  pass_only_authorizes_separate_cross_chain_preperiod_activity_gate: true

ethereum_panel_gate:
  minimum_total_clean_units: 15
  minimum_primary_clean_units: 12
  minimum_reverse_sign_clean_units: 2
  minimum_clean_assets_per_proposal: 2

decision:
  all_required:
    - six_of_six_announcement_and_governance_timelines_resolved
    - selected_ethereum_rate_events_match_exact_t0_blocks_and_transactions
    - ethereum_panel_gate_passes_with_at_least_14_clean_post_days
    - cross_chain_gate_passes_for_at_least_four_proposals
  pass: pass_to_separately_frozen_cross_chain_preperiod_activity_d1c
  fail: stop_ncs_causal_route_before_behavioral_outcomes
  specialist_descriptive_route_after_fail: requires_separate_explicit_scope_decision

blinding:
  allowed:
    - governance_and_forum_timestamps
    - proposal_source_and_diff_metadata
    - cross_chain_payload_execution_metadata
    - protocol_configuration_event_names_values_blocks_and_transactions
    - clean_window_and_censoring_decisions
  forbidden:
    - post_execution_borrow_or_repay_events
    - reserve_data_updated_outcomes
    - position_or_balance_outcomes
    - utilization_or_realized_borrow_rate
    - price_or_volume_outcomes
    - participant_addresses
    - any_behavioral_response_statistic

