transport:
  rpc_is_replaceable_transport: true
  qualification_occurs_only_after_this_freeze: true
  require_chain_id_and_both_anchor_hashes: true
  require_nonempty_hub_shard_identity_crosscheck: true
  identity_crosscheck_sources: 2
  qualification_get_logs_span: 10000
  formal_initial_span_rule: approximate_seven_utc_days_from_frozen_header_rate
  formal_range_errors_split_recursively_without_changing_union: true
  maximum_topics_per_get_logs: 14
  minimum_request_interval_seconds_per_endpoint: 0.75
  no_api_keys_or_paid_endpoints: true
  raw_rpc_responses_retained: false
  amendment_2026_08_20_after_first_qualification_attempt:
    trigger: explicit_provider_range_limits_and_log_transport_without_historical_state
    fixed_10000_block_qualification_union_unchanged: true
    anchor_rpc_verifies_chain_and_hashes: true
    first_archive_capable_anchor_or_formal_candidate_verifies_agent_hub_code_at_to_block: true
    formal_log_transports_verify_chain_hashes_and_exact_log_identity: true
    avalanche_added_documented_public_rpc: https://avalanche.drpc.org
    bnb_added_documented_public_archive_rpc: https://bnb.api.onfinality.io/public
    no_chain_sample_event_family_threshold_or_stop_rule_changed: true

allowed_event_families:
  agent_hub:
    - AgentRegistered
    - AgentAddressSet
    - AgentAdminSet
    - AgentEnabledSet
    - AgentPermissionedStatusSet
    - MarketsFromAgentEnabled
    - ExpirationPeriodSet
    - MinimumDelaySet
    - AgentContextSet
    - AllowedMarketAdded
    - AllowedMarketRemoved
    - RestrictedMarketAdded
    - RestrictedMarketRemoved
    - UpdateInjected
  range_validation_module:
    - DefaultRangeConfigSet
    - MarketRangeConfigSet
  risk_oracle:
    - ParameterUpdated

eligibility:
  source_key: [chain_id, risk_oracle, update_type_hash]
  activation_requires_at_least_one_prior_initialized_registration: true
  source_unambiguous_requires_exactly_one_prior_initialized_registration: true
  require_registered_risk_oracle_equals_address_book_edge_risk_oracle: true
  required_prior_initialization:
    - AgentAddressSet
    - AgentEnabledSet_true
    - ExpirationPeriodSet
    - MinimumDelaySet
  proposal_must_follow_all_required_events_by_block_transaction_log_order: true
  pre_activation_or_never_registered_proposals:
    retained_in_exclusion_ledger: true
    excluded_from_support_and_terminal_classification_denominators: true
  post_activation_ambiguous_proposals:
    retained_in_eligible_ledger: true
    count_against_terminal_classification: true

batching:
  purpose: conservative_dependence_unit_for_synchronized_or_bulk_oracle_actions
  sort_key: [oracle_timestamp, chain_id, block_number, transaction_index, log_index]
  maximum_adjacent_gap_seconds: 120
  connected_component_rule: adjacent_oracle_timestamps_at_most_120_seconds_apart
  update_type_or_chain_need_not_match: true
  reference_id_is_not_used_to_split_batches: true
  batch_id: sha256_of_sorted_canonical_proposal_identities
  inference_must_cluster_by_batch: true

matching:
  exact_fields: [chain_id, risk_oracle, update_type_hash, update_id, market, proposed_value]
  same_block_order: transaction_index_then_log_index
  previous_oracle_value_is_not_protocol_validation_state: true

boundary_support:
  boundary_key: [chain_id, agent_id, unchanged_minimum_delay_epoch]
  never_pool_boundaries_across_chains_or_agents: true
  row_level_minimum_scores: 20
  row_level_minimum_each_side: 5
  neighborhood_fraction: 0.25
  row_level_minimum_near_each_side: 5
  batch_representative: median_margin_within_boundary_and_batch
  batch_level_minimum_scores: 10
  batch_level_minimum_each_side: 3
  batch_level_minimum_near_each_side: 3
  exact_row_bunching_minimum_count: 5
  exact_batch_bunching_minimum_count: 3
  exact_bunching_minimum_fraction: 0.50
  minimum_qualifying_boundaries: 2
  minimum_chains_with_qualifying_boundary: 2

pass_thresholds:
  minimum_eligible_proposals: 30
  minimum_exact_injections: 20
  minimum_update_types: 2
  minimum_chain_market_pairs: 5
  minimum_represented_chain_agents: 3
  minimum_represented_chains: 3
  minimum_proposal_batches: 10
  minimum_resolved_non_immediate_proposals: 10
  minimum_resolved_non_immediate_batches: 5
  minimum_terminal_classification_rate: 0.90

forbidden_data:
  - pool_balances
  - utilization
  - borrow_or_supply_rates
  - user_transactions
  - positions
  - prices
  - liquidations
  - market_response_windows
  - ethereum_pilot_rows_in_holdout_counts

stop_rules:
  any_pass_or_boundary_threshold_failure_stops_before_d1: true
  no_chain_may_be_dropped_for_low_activity: true
  unavailable_transport_requires_replacement_not_panel_selection: true
  no_market_outcomes_on_failure: true
  no_synthetic_rejected_actions: true
  no_gpu_or_ecomd: true

resources:
  maximum_cpu_core_hours: 50
  maximum_retained_derived_gb: 5
  gpu_hours: 0
  paid_data_budget_usd: 0
  current_gpu_pool_held_idle: [v100_32gb_a, v100_32gb_b, rtx2060]
  h20_assumed: false
