activation_rule:
  minimum_t0_survival_probability: 0.15
  all_required:
    - irreducible_central_theorem_or_scientific_phenomenon
    - identified_estimand_or_explicit_abstention_boundary
    - two_independent_versionable_systems_or_field_replications
    - prospective_held_out_prediction
    - primary_evidence_beyond_ecomd
    - no_exact_reduction_to_existing_problem_class
  on_failure: do_not_implement_open_outcomes_or_use_compute

selected_candidate:
  graph_id: fcc_clock1_random_rank_cascade
  title: FCC clock-1 randomized tie-order cascade
  status: candidate
  t0_survival_probability: 0.12
  t0_upper_bound: 0.14
  complete_ncs_probability: [0.01, 0.04]
  complete_nmi_probability: [0.002, 0.01]
  scientific_question: >-
    Can bid-specific pseudorandom ordering inside an otherwise tied FCC clock-auction price point cause a local
    bid-application difference that propagates through the unfulfilled-bid queue, aggregate demand, posted prices,
    bidder activity and later eligibility, and can a frozen simulator predict that response across auctions?
  official_field_anchors:
    - auction_108
    - auction_110
    - auction_113
  blockers:
    - randomization_support_unverified
    - public_prng_or_seed_audit_missing
    - deterministic_first_stage_replay_unverified
    - exact_clock1_simulator_missing
    - private_valuation_and_intent_unobserved
  authorization:
    - metadata_only_tie_support_audit
    - official_randomization_semantics_audit
    - primary_literature_novelty_audit
  forbidden_until_dminus1_passes:
    - bid_or_result_outcome_analysis
    - simulator_implementation
    - model_fitting
    - welfare_or_private_value_claims
    - ecomd_or_gpu_work
  next_artifact: papers/proposal/fcc_clock1_random_rank_cascade_dminus1_freeze_2026-08-24.md

