question: >-
  After the A-prime influence-tail route failed, does any fresh market-simulation question combine an
  irreducible scientific object, an identified intervention, two versionable systems or field replications, and a
  prospective test strongly enough to justify a Nature Machine Intelligence or Nature Computational Science
  program?

