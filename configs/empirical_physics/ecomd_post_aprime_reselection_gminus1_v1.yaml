decision:
  active_nature_route_created: false
  candidate_created: fcc_clock1_random_rank_cascade
  closed_card_count: 17
  reason: >-
    Every AI-agent and molecular-dynamics card either reduces to direct prior art or fails by a finite
    counterexample. Five field protocols lack randomization, replay state, treated L2, a post period or a second
    system. FCC clock-1 is retained because official rules expose a genuine randomized micro-ordering and public
    schemas expose its first-stage and propagation variables, but support, exchangeability and exact replay have
    not yet passed.
