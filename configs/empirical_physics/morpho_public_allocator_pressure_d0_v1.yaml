transport:
  portal_timeout_seconds: 60
  portal_retry_attempts: 4
  portal_retry_backoff_seconds: 1
  rpc_timeout_seconds: 30
  rpc_retry_attempts: 6
  rpc_retry_backoff_seconds: 1
  rpc_minimum_request_interval_seconds: 0.15
  split_log_ranges_on_failure: true
  minimum_split_span: 1
  maximum_index_only_events_each_chain: 10
  maximum_index_only_fraction_each_chain: 0.001
  maximum_rpc_only_events_each_chain: 0
  dense_blocks_checked_each_chain: 20
  require_exact_cutoff_header_all_sources: true
  require_all_index_only_receipt_verified: true
  require_all_candidate_receipts_verified: true
  retain_raw_responses: false
  retain_event_identities: false
  decode_log_data: false

classification:
  terminal_consumes_preceding_unconsumed_withdrawals: true
  require_same_sender_and_vault: true
  require_at_least_one_withdrawal: true
  require_later_borrow_in_same_receipt: true
  require_borrow_emitted_by_exact_morpho: true
  require_borrow_market_equals_target_market: true
  count_unique_transactions: true
  edge_unit: donor_market_id_to_target_market_id
  call_true_jit_before_amount_gate: false

pass_thresholds:
  required_chains: [ethereum, base]
  minimum_target_matched_candidate_transactions_total: 500
  minimum_target_matched_candidate_transactions_each_chain: 100
  minimum_active_span_days_each_chain: 90
  minimum_active_utc_dates_each_chain: 30
  minimum_distinct_vaults_each_chain: 3
  minimum_distinct_edges_each_chain: 4
  minimum_distinct_edges_total: 12
  minimum_public_allocator_sequence_classification_rate: 1.0
  minimum_candidate_receipt_verification_rate: 1.0
  maximum_unresolved_identity_discrepancies: 0

d1_future_gates_not_tested_here:
  minimum_amount_compatible_adaptive_curve_events: 300
  require_positive_routed_assets: true
  require_routed_assets_not_above_borrow_assets: true
  require_target_uses_official_adaptive_curve_irm: true

forbidden_before_d0_pass:
  - supplied_withdrawn_or_borrowed_amounts_and_shares
  - flow_cap_values
  - balances
  - utilization
  - interest_rates
  - participant_response
  - prices_or_yields
  - liquidations_losses_or_bad_debt
  - incident_labels_or_resolv_window
  - causal_or_predictive_effects
  - ecomd_or_learned_models

stop_rules:
  any_source_transport_identity_or_support_gate_failure_stops_route: true
  no_chain_addition_cutoff_change_or_threshold_relaxation_after_counts: true
  no_amount_decode_or_d1_on_failure: true
  no_market_outcome_gpu_or_paid_data_on_failure: true

resources:
  maximum_cpu_core_hours: 25
  maximum_transferred_gb: 50
  maximum_retained_derived_gb: 1
  gpu_hours: 0
  paid_data_usd: 0
