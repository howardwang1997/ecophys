contract:
  name: performative_dispatch_t0
  version: 1
  status: frozen_before_aemo_market_row_acquisition_or_outcome_analysis
  purpose: test_novelty_and_identifiability_of_closed_loop_public_forecasts_in_rolling_electricity_dispatch
  source_decision: papers/proposal/real_physics_zero_cost_decision_2026-08-11.md
  human_protocol: papers/proposal/performative_dispatch_t0_freeze_2026-08-19.md
  stop_at_first_hard_failure: true

candidate:
  question: distinguish_new_physical_information_from_market_response_to_a_published_forecast
  primary_domain: rolling_electricity_dispatch
  initial_operator: AEMO_NEM
  primary_outcome_language: forecast_induced_response_and_decision_value
  forbidden_primary_language:
    - forecast_revision_rebid_association_is_causal
    - classical_forecast_error_equals_social_value
    - binding_constraints_cause_price_changes_is_novel
    - lower_price_prediction_error_is_the_primary_scientific_claim
    - ecomd_validates_the_mechanism

observation_contract:
  observed_candidate_nodes: [physical_public_state, published_forecast, bid_rebid, clearing_active_set, dispatch_outcome]
  hidden_candidate_nodes: [private_information, proprietary_forecast, private_operational_state]
  primary_intervention: do_published_forecast_or_forecast_availability
  primary_response: participant_bid_rebid
  downstream_state: clearing_active_set
  downstream_outcomes: [dispatch, price, interconnector_flow, reliability]
  chronological_order_alone_identifies_causal_effect: false

frozen_nonidentifiability_control:
  exogenous_state: U_bernoulli_half
  model_a: {F: U, B: F, C: B, Y: B}
  model_b: {F: U, B: U, C: B, Y: B}
  observed_joint_laws_identical: true
  do_F_effects_different: true
  required_estimator_behavior: reject_total_effect_without_additional_identification

prior_art:
  clusters:
    - performative_prediction_and_stability
    - performative_proper_scoring_and_divergence
    - causal_policy_learning_with_strategic_agents
    - rolling_predispatch_price_quantity_discovery
    - strategic_bidding_and_rebidding
    - parametric_market_clearing_and_lmp_sensitivity
    - credible_forecast_exposure_instruments_and_natural_experiments
  forward_search_cutoff: 2026-08-19
  primary_sources_required: true

allowed_exits:
  e0_identification_theorem:
    requires_weaker_or_structurally_different_assumptions_than_nearest_work: true
    frozen_counterexample_must_be_rejected: true
  e1_real_instrument:
    minimum_independent_events: 5
    exclusion_and_relevance_required: true
    timing_alone_is_not_an_instrument: true
  e2_constraint_mediated_law:
    must_not_reduce_to_piecewise_affine_clearing_or_standard_lmp_sensitivity: true
    falsifiable_out_of_sample_prediction_required: true
  e3_closed_loop_benchmark:
    ordinary_price_forecasting_is_ineligible: true
    alone_authorizes_ncs_claim: false

pass_gate:
  at_least_one_of_e0_e1_e2: true
  nearest_five_non_equivalence: true
  estimand_identified_or_proven_partial: true
  complete_free_data_field_path: true
  fresh_chronological_split_reservable: true
  independent_transfer_market_reservable: true
  confirmed_result_changes_a_real_decision: true

fail_policy:
  application_of_existing_performative_score: stop
  ordinary_predictive_model: stop
  observational_association_only: stop
  standard_active_set_explanation_only: stop
  on_fail:
    aemo_market_row_acquisition: forbidden
    conditional_synthetic_implementation: forbidden
    cpu_queue: forbidden
    gpu_queue: forbidden

data_lock:
  allowed: [primary_papers, official_rules, schema_pages, metadata_only_outage_or_rule_listings]
  forbidden: [prices, bids, dispatch_quantities, constraint_outcomes, event_window_statistics]
  d0_source_qualification_requires_t0_pass: true

compute:
  cpu_core_hour_cap: 20
  temporary_data_gb_cap: 1
  gpu_forbidden: true
  v100_forbidden: true
  rtx2060_forbidden: true
  h20_forbidden: true
  paid_data_forbidden: true
