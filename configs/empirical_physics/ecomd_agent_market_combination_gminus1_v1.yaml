      Paired-replica damage susceptibility and a prospective low-clone-dose prediction of a high-dose boundary may
      be used only as a stress test for the parked path-kernel theorem; it is not an independent novelty claim.
    blockers:
      - broad_claim_directly_occupied
      - rank_one_susceptibility_pole_is_textbook
      - finite_engine_scale_can_mimic_a_crossover
      - feedback_sign_can_reverse_the_clone_effect
