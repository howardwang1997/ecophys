    status: failed_closed
    standalone_verdict: red
    t0_survival_probability: [0.04, 0.08]
    complete_nmi_probability: [0.005, 0.02]
    identifiable_residual: harmful_nonpublic_cross_agent_causal_influence
    invalid_headline: general_tacit_collusion_or_intent_certificate
    reductions:
      - interference_randomization_inference
      - controlled_direct_effect_with_public_mediator_clamp
      - calibrated_regret_and_algorithmic_noncollusion_audits
      - forced_deviation_and_off_path_punishment_tests
    blockers:
      - collusion_label_not_identified_under_common_signal_and_public_market_mediation
      - private_causal_influence_does_not_imply_intent_illegality_or_harm
      - abides_and_pams_lack_native_public_trace_clamp
      - direct_algorithmic_collusion_audit_and_market_intervention_prior_art

  clone_susceptibility_phase_boundary:
    graph_id: clone_monoculture_susceptibility_phase_boundary
    status: failed_closed
    standalone_verdict: red_broad_claim
    t0_survival_probability: [0.03, 0.08]
    complete_nature_probability: [0.005, 0.03]
    occupied_headline: ai_clone_or_strategy_homogeneity_causes_market_instability_at_a_threshold
    direct_neighbors:
      - algorithmic_monoculture
      - minority_game_and_heterogeneous_agent_phase_transitions
      - trader_copying_and_identical_strategy_market_experiments
      - ai_representation_homogeneity_and_systemic_risk
