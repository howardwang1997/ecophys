question: >-
  Does any standalone or combined form of composition-generalizing market world modeling, active harmful-
  coordination certification, and quenched clone susceptibility define an irreducible, identifiable and
  two-system-executable Nature Machine Intelligence or Nature Computational Science route?

resource_boundary:
  market_outcomes: forbidden
  paid_data: forbidden
  implementation: forbidden
  benchmark_runs: forbidden
  ecomd_execution: forbidden
  model_api_calls: forbidden
  gpu_hours: 0
  allowed:
    - primary_papers_and_supplements
    - official_platform_documentation
    - public_source_and_license_metadata
    - finite_toy_models
    - symbolic_reductions

activation_rule:
  minimum_t0_survival_probability: 0.15
  all_required:
    - irreducible_central_theorem_or_scientific_claim
    - identifiable_estimand_or_declared_abstention_boundary
    - two_independent_versionable_external_system_contracts
    - prospective_held_out_test_not_replaced_by_post_hoc_fit
    - primary_evidence_not_ecomd_only
    - top_venue_claim_not_occupied_by_direct_prior_work
  on_failure: do_not_implement_or_open_outcomes

cards:
  composition_path_kernel:
    graph_id: composition_generalizing_path_kernel
    status: failed_closed
    standalone_verdict: red_at_subsequent_A_prime_G0
    subsequent_result: papers/proposal/ecomd_aprime_influence_tail_g0_result_2026-08-24.md
    t0_survival_probability: [0.05, 0.12]
    complete_nmi_probability: [0.003, 0.02]
    exact_component:
      claim: connected_composition_expansion
      reduction: multivariate_binomial_mobius_newton_expansion
    occupied_neighbors:
      - functional_anova_hdmr_and_harsanyi_interactions
      - regression_empirical_game_theoretic_analysis
      - unseen_composition_and_population_size_generalization
      - population_scalable_multi_agent_world_models
    nonexact_residual: >-
      A market-path transition kernel is richer than an EGTA payoff map. A possible new core would have to derive
      a measurable, uniform-in-population-size connected-tail certificate from exchange event semantics, together
      with a failure lower bound and prospective cross-system path-law prediction.
    blockers:
      - first_order_replace_one_influence_does_not_control_high_order_mobius_tail
      - raw_mobius_truncation_is_not_a_probability_kernel
      - q_h_equal_one_is_not_a_necessary_boundary
      - valid_repairs_reduce_to_semigroup_or_cluster_theory
      - power_tac_scml_system_and_dose_are_confounded

  harmful_coordination_certificate:
