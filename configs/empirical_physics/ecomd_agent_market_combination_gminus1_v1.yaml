combinations:
  composition_plus_coordination:
    verdict: no_rescue
    reason: active_design_for_a_population_response_surface_reduces_to_experimental_design_and_active_egta
  composition_plus_clone:
    verdict: historically_parked_then_failed_at_a_prime_G0
    reason: >-
      Clone share may serve as a hard extrapolation coordinate for the path-kernel theorem, but phase-boundary
      language supplies no independent novelty.
  coordination_plus_clone:
    verdict: no_rescue
    reason: shared_models_and_public_price_mediation_make_coordination_attribution_less_identifiable
  all_three:
    verdict: no_activation
    reason: >-
      Aggregating three occupied claims creates a factorial experiment, not a central theorem. The only admissible
      use is an A-prime paper-only contract in which private replace-one probes measure influence and clone share is
      a prespecified stress coordinate.

