question: >-
  Can a local rule intervention in a deterministic-replayable event-driven simulator be evaluated exactly by
  replaying only its dynamically affected collision cone, with work controlled by that cone rather than the full
  baseline trajectory and with a non-circular subcritical certificate for expected cone size?

