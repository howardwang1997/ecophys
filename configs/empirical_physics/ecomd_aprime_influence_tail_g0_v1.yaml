project: ecomd_aprime_influence_tail_g0
version: 1
frozen_date: 2026-08-24
closed_date: 2026-08-24
status: failed_closed
verdict: red_at_normalization_and_influence_implication
parent_screen: papers/proposal/ecomd_agent_market_combination_gminus1_result_2026-08-24.md
freeze_artifact: papers/proposal/ecomd_aprime_influence_tail_g0_freeze_2026-08-24.md
result_artifact: papers/proposal/ecomd_aprime_influence_tail_g0_result_2026-08-24.md
memory_artifact: .claude/memory/project_ecomd_aprime_influence_tail_g0_2026-08-24.md
stop_at_first_failure: true

question: >-
  Can a pre-high-dose, replace-one influence quantity derived from event-driven market semantics certify a
  population-uniform tail bound for composition interactions and a path-law approximation, with a separating
  failure result and one scientifically identical prospective test in Power TAC and SCML?

resource_boundary:
  allowed:
    - primary_papers_and_supplements
    - official_platform_documentation
    - public_repository_metadata_and_source_reading
    - symbolic_proofs
    - finite_handworked_counterexamples
  forbidden:
    - agent_download_or_installation
    - implementation_or_benchmark_run
    - market_or_simulator_outcomes
    - paid_data
    - model_api_calls
    - ecomd_execution
    - gpu_or_remote_compute

formal_objects:
  varying_population:
    composition: "n in N^d"
    path_law: "P_n^H = Law(Y_0:H | protocol s, composition n)"
    observable_operator: "F_phi(n) = integral phi dP_n^H"
    newton_coefficient: "C_alpha[phi] = Delta^alpha F_phi(0)"
  fixed_population:
    population_size: N
    baseline_agents: "[N] with frozen versioned policies"
    replacement_set: "S subseteq [N]"
    anchored_path_law: "P_N,S^H"
    anchored_interaction: "c_N(S) = sum_{T subseteq S} (-1)^(|S|-|T|) P_N,T^H"
  influence_candidate:
    intervention: one_agent_policy_or_private_input_replacement
    coupling: common_public_state_shocks_and_agent_keyed_randomness
    required_scope: worst_case_over_declared_states_histories_and_allowed_versions
    forbidden_proxy: average_realized_damage_or_post_high_dose_fit

theorem_stack:
  T0_normalization:
    claim: define_one_common_metric_space_and_nonvacuous_population_normalization
    failure: origin_newton_bound_forces_all_nonzero_first_order_coefficients_to_zero
  T1_positive:
    claim: pre_intervention_q_below_one_implies_population_uniform_connected_tail
    prohibited_assumption: directly_assume_high_order_decay_or_cluster_size_tail
  T2_path_law:
    claim: tail_bound_implies_declared_metric_error_for_K_order_path_law_approximation
    requirements:
      - approximant_is_a_valid_probability_kernel
      - no_cancellation_is_hidden_by_signed_measure_norms
      - bound_is_nonvacuous_at_target_population_sizes
  T3_failure:
    claim: construct_a_market_family_where_the_certificate_fails_and_every_fixed_K_has_constant_error
    prohibited_claim: q_at_least_one_universally_implies_instability
  T4_separation:
    claim: central_result_is_not_a_corollary_of_existing_weak_dependence_or_cluster_theory
  T5_transfer:
    claim: one_versioned_intervention_and_path_endpoint_supports_a_no_retuning_prospective_test_in_power_tac_and_scml

immediate_failures:
  - population_uniform_bound_is_algebraically_impossible_under_the_declared_newton_normalization
  - average_replace_one_influence_does_not_control_worst_case_or_high_order_interactions
  - mean_offspring_below_one_does_not_supply_the_required_uniform_geometric_tail
  - positive_theorem_is_dobrushin_disagreement_percolation_or_cluster_expansion_specialization
  - approximated_signed_operator_is_not_a_valid_path_probability_law
  - certificate_requires_high_dose_outcomes_or_the_counterfactual_target_it_claims_to_predict
  - power_tac_and_scml_require_different_interventions_or_estimands
  - no_three_independently_developed_versioned_agent_artifacts_per_required_system_role
  - cross_system_prediction_requires_system_specific_refitting

finite_toys:
  - independent_additive_agents_under_varying_N
  - fixed_N_single_agent_replacement_with_no_propagation
  - rare_global_batch_event_with_small_average_influence_and_large_high_order_effect
  - stable_negative_feedback_with_dobrushin_row_sum_above_one
  - threshold_auction_or_queue_with_constant_fixed_K_error
  - signed_mobius_truncation_that_is_not_a_probability_kernel
  - same_generic_metric_name_but_different_power_tac_and_scml_semantics

prior_art_buckets:
  - dobrushin_uniqueness_and_comparison
  - disagreement_percolation_and_information_percolation
  - cluster_cumulant_and_polymer_expansions
  - functional_inequalities_and_influence_matrices
  - propagation_of_chaos_and_mean_field_particle_systems
  - algorithmic_stability_and_bounded_differences
  - multi_agent_population_world_models

system_gate:
  systems: [power_tac, scml]
  required:
    - exact_public_version_and_license
    - at_least_three_independent_agent_artifacts_for_the_declared_roles
    - controllable_composition_and_population_count
    - deterministic_seed_and_event_log_contract
    - semantically_identical_replace_one_intervention
    - common_path_law_endpoint_with_same_scientific_meaning
    - system_B_high_dose_outcomes_sealed_until_prediction_is_frozen

pass_rule:
  all_required: [T0_normalization, T1_positive, T2_path_law, T3_failure, T4_separation, T5_transfer]
  on_fail: close_parked_card_before_any_implementation_or_outcome_access

closure:
  first_failed_gate: T0_normalization_and_T1_positive
  failure_codes:
    - origin_newton_population_uniform_bound_implies_exact_finite_degree
    - first_order_replace_one_influence_does_not_control_high_order_mobius_tail
    - mobius_truncation_is_not_generally_a_probability_kernel
    - q_h_equal_one_is_not_a_necessary_stability_boundary
    - valid_positive_repair_reduces_to_bounded_semigroup_or_cluster_expansion
    - power_tac_scml_system_and_dose_are_confounded
  decisive_counterexamples:
    - parity_auction_with_q_below_one_and_constant_first_order_error
    - first_active_agent_with_q_below_one_and_diverging_raw_newton_shells
    - quadratic_composition_law_with_q_above_one_and_exact_second_order_truncation
    - subcritical_mean_offspring_with_non_geometric_cluster_tail
  prior_art_collision:
    strongest_dynamic_primary_work: maes_netcny_2002_spacetime_expansions
    supporting_theories:
      - dobrushin_comparison_and_block_influence
      - disagreement_percolation
      - kotecky_preiss_polymer_expansion
      - path_space_gibbs_cluster_expansion
      - hawkes_cluster_branching
      - propagation_of_chaos
  system_contract:
    verdict: failed
    reason: >-
      Adding a broker to Power TAC changes a global electricity retail and auction system, whereas adding a
      factory manager to an SCML layer changes a bilateral supply-chain world and its generated opponent graph,
      profiles and exogenous contracts. Training at low dose in the first and testing at high dose in the second
      confounds platform with dose and does not preserve one path-law estimand.
  authorization_after_closure:
    implementation: forbidden
    outcome_access: forbidden
    agent_download_or_installation: forbidden
    ecomd_or_gpu: forbidden
  reopen_only_as_new_route_if:
    - abandon_raw_probability_law_newton_truncation_for_a_valid_resummed_or_local_object
    - derive_a_non_circular_exchange_specific_cluster_condition_strictly_beyond_spacetime_polymer_theory
    - prove_a_common_intensive_estimand_and_projective_system_mapping_before_any_outcome_access
