  repay_signature: Repay(address,address,address,uint256,bool)
  reserve_data_updated_signature: ReserveDataUpdated(address,uint256,uint256,uint256,uint256,uint256)

blinding:
  borrow_repay_logs: forbidden_at_t0
  reserve_data_outcomes: forbidden_at_t0
  position_balances: forbidden_at_t0
  post_event_values: forbidden_at_t0
  raw_market_responses: forbidden_at_t0

decision:
  pass_if:
    - every_selected_proposal_is_executed_with_one_exact_ethereum_payload_event
    - every_selected_asset_has_only_variable_rate_slope1_as_configured_change
    - singleton_market_event_units_at_least_15
    - public_rpc_chain_and_event_topic_metadata_are_available
  rendered_diff_nonindependent_fields:
    - baseStableBorrowRate
    - maxVariableBorrowRate
    - interestRate
    - interestRateStrategy
  dataset_doi_unavailable: use_direct_chain_logs_but_record_the_data_claim_failure
  t0_pass_only_authorizes_a_separately_committed_preperiod_activity_freeze: true

limits:
  request_timeout_seconds: 30
  transport_retries: 3
  cpu_core_hours: 2
  temporary_data_mb: 200
  paid_data: forbidden
  gpu: forbidden
  v100: forbidden
  rtx2060: forbidden
  h20: forbidden
  ecomd: forbidden
