decision:
  active_nature_route_created: false
  new_candidate: oasis_ssw_random_priority_network_response
  parked_probe: dcrdex_verifiable_sequencing_response
  existing_candidate_preserved: fcc_clock1_random_rank_cascade
  failed_card_count: 10
  reason: >-
    OASIS is the only true non-auction field mechanism in this screen that marginally clears the frozen T0 floor
    while offering multiple operators and literal constrained-state propagation. DCRDEX has superior cryptographic
    replay semantics but lacks archival support and an equivalent second system. All remaining cards fail the
    public-state, realized-randomness, market-status, support or novelty contract.
