gate_results:
  rule_gate:
    status: pass
    finding: >-
      MISO and SPP formally randomize customer order after deterministic priority rules and expand it through
      round-robin request positions evaluated sequentially against available capacity.
  realization_gate:
    status: fail
    finding: >-
      The inspected public standard machine contract does not document a stable SSW identifier, customer lottery
      order, lottery round or derived TSR evaluation-position export. Ordinary queue and update times are not valid
      substitutes.
  state_gate:
    status: fail
    finding: >-
      Current and horizon flowgate reports do not establish an atomic, versioned request-to-immediate-pre/post AFC
      state join with complete topology, outage, impact and counteroffer inputs.
  access_and_reuse_gate:
    status: fail
    finding: >-
      Programmatic OATI access requires supported templates and credentials; UI scraping is prohibited and no open
      bulk research/publication licence for the required custom fields was found.
  support_gate:
    status: not_run
    reason: stopped_before_transaction_records_after_realization_and_state_failure
  nontriviality_gate:
    status: not_run
    reason: stopped_before_transaction_records_after_realization_and_state_failure
  replay_gate:
    status: not_run
    reason: no_complete_public_input_contract
  replication_gate:
    status: fail
    finding: >-
      MISO and SPP are distinct networks and operators but use the same OATI product family and essentially the same
      customer-random-order, round-robin, sequential-AFC mechanism; they are not independent implementations.
  novelty_gate:
    status: stopped_with_reduction_warning
    finding: >-
      No exact OASIS SSW empirical application was found in a partial 18-work audit, but immediate network response
      reduces to random-order multidimensional packing and established connection-order path dependence.

