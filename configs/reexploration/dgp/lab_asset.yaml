# D1 = lab-asset-v3 episodes (primary truth; prereg section 4.1). The frozen
# A-2 bundle (manifest fea8a136...9581c) is the schema anchor; per-seed
# fixtures extend, never modify, the schema (C4).
dgp_id: lab_asset
dgp_label: D1
series_law: null  # engine-native episodes; no exogenous series

# == scripts/lab_asset/dgp_request_generator.DGPConfig defaults (E-2);
# config_from_mapping-compatible (strict unknown-key rejection).
config:
  n_rounds: 32
  n_makers: 10
  n_aggressors: 6
  reference_price: 1000
  price_half_band: 80
  tick_factor: 1
  latency_window_ticks: 40
  initial_clock_max: 80
  initial_ask_levels: 3
  initial_bid_levels: 2
  initial_orders_per_level: [2, 3]
  initial_quantity_range: [2, 5]
  level_spacing_range: [1, 2]
  resting_add_rate: 0.35
  replenish_orders: 2
  replenish_quantity_range: [2, 4]
  spread_gap_ticks: 1
  level_lockout_ticks: 1
  v_star_single_unit_prob: 0.16666666666666666
  v_star_max_share: 0.5
  min_pool_units: 4
  maker_unit_budget: 120
  aggressor_unit_budget: 60
  series_burn_in: 200
  series_v_star_scale: 4.0
  feedback_class: m1
  dgp_family: lab_asset
  request_tick_start: 100
  build_attempts: 8
  shadow_rule: fifo
