schema_version: constraint-iclr-pilot-manifest-v1
workers:
  v100a:
    - name: a_advection
      runner: pde
      config: pde_pilot
      overrides:
        family: A
        system: advection
        resolution: 64
        capacity_grid: [32, 64, 128]
        output: experiments/constraint_attribution_iclr/pilot/a_advection.jsonl
    - name: a_diffusion
      runner: pde
      config: pde_pilot
      overrides:
        family: A
        system: diffusion
        resolution: 64
        capacity_grid: [32, 64, 128]
        output: experiments/constraint_attribution_iclr/pilot/a_diffusion.jsonl
    - name: a_burgers
      runner: pde
      config: pde_pilot
      overrides:
        family: A
        system: burgers
        resolution: 64
        nu: 0.01
        capacity_grid: [32, 64, 128]
        output: experiments/constraint_attribution_iclr/pilot/a_burgers.jsonl
    - name: h_near
      runner: pde
      config: pde_pilot
      overrides:
        family: H
        system: contraction_near
        resolution: 64
        gamma: 0.5
        capacity_grid: [32, 64, 128]
        output: experiments/constraint_attribution_iclr/pilot/h_near.jsonl
    - name: h_strong
      runner: pde
      config: pde_pilot
      overrides:
        family: H
        system: contraction_strong
        resolution: 64
        gamma: 50.0
        capacity_grid: [32, 64, 128]
        output: experiments/constraint_attribution_iclr/pilot/h_strong.jsonl
    - name: m2_fifo
      runner: market
      config: market_pilot
      overrides:
        output: experiments/constraint_attribution_iclr/pilot/m2_fifo.jsonl

  v100b:
    - name: b_advection
      runner: pde
      config: pde_pilot
      overrides:
        family: B
        system: advection
        resolution: 128
        capacity_grid: [8, 16, 32]
        output: experiments/constraint_attribution_iclr/pilot/b_advection.jsonl
    - name: b_diffusion
      runner: pde
      config: pde_pilot
      overrides:
        family: B
        system: diffusion
        resolution: 128
        capacity_grid: [8, 16, 32]
        output: experiments/constraint_attribution_iclr/pilot/b_diffusion.jsonl
    - name: b_burgers
      runner: pde
      config: pde_pilot
      overrides:
        family: B
        system: burgers
        resolution: 128
        nu: 0.01
        capacity_grid: [8, 16, 32]
        output: experiments/constraint_attribution_iclr/pilot/b_burgers.jsonl
    - name: c_ad2d
      runner: pde
      config: pde_pilot
      overrides:
        family: C
        system: ad2d
        resolution: 32
        capacity_grid: [8, 16, 32]
        output: experiments/constraint_attribution_iclr/pilot/c_ad2d.jsonl

