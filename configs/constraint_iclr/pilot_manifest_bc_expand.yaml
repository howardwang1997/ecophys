schema_version: constraint-iclr-pilot-manifest-v1
workers:
  v100b_expand:
    - name: b_advection_c32
      runner: pde
      config: pde_pilot
      overrides:
        family: B
        system: advection
        resolution: 128
        capacity_grid: [32]
        epochs_grid: [100, 200]
        lr_grid: [0.0003, 0.001]
        output: experiments/constraint_attribution_iclr/pilot/b_advection.jsonl
    - name: b_advection_e400
      runner: pde
      config: pde_pilot
      overrides:
        family: B
        system: advection
        resolution: 128
        capacity_grid: [8, 16, 32]
        epochs_grid: [400]
        lr_grid: [0.0003, 0.001]
        output: experiments/constraint_attribution_iclr/pilot/b_advection.jsonl
